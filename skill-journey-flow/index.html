<script type="module">
// ─────────────────────────────────────────────────────────────
//  Skill Journey Flow Vertical — 내 스킬 하나가 상대 화면에 뜨기까지 (~21s, 1080×1920, mobile)
//  The ~20 s cut of ../skill-journey-flow-wide/ (흐름과 관계를 빛으로): the same night route map, the same lit
//  fiber and the same "time wall" behind ONE packet — the camera rides with the packet from my PC through
//  the ISP, the backbone and the IDC, waits for the server tick, and arrives at the other player's PC where
//  the interpolation buffer adds the tallest cliff. Then the route stands up as a tower of time (221 ms).
//  Every frame is a pure function of time: renderAt(t).
//  Facts follow ../skill-journey/index.html (example: 20Hz · RTT 50ms):
//    my screen ~25 ms (prediction) · uplink one-way 25 ms · tick wait 0~50 ms (avg 25) · tick ~12 ms
//    downlink ~25 ms · frame 8 · interpolation buffer ~100 ms · render 16 → ≈ 221 ms
//    the 100 ms buffer applies when events are also played at the interpolated time
// ─────────────────────────────────────────────────────────────
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1080, H = 1920, DURATION = 21;
const FOV = 46;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';

// ── math ─────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const win = (t, s, e, f = .45) => Math.min(eo(p(t, s, f)), 1 - eio(p(t, e - f, f)));
const fract = x => x - Math.floor(x);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function interpK(K, x) {   // piecewise-linear lookup in [[x, y], …] (x ascending)
  if (x <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (x <= K[i][0]) { const [x0, y0] = K[i - 1], [x1, y1] = K[i]; return x1 > x0 ? lerp(y0, y1, (x - x0) / (x1 - x0)) : y1; }
  return K[K.length - 1][1];
}

// ── timeline ─────────────────────────────────────────────────
// [start, end, number, title] — chapters (route progress + chapter chips)
const HEAD = [
  [0, 2.6, '01', '출발'],
  [2.6, 7.0, '02', '업링크'],
  [7.0, 10.6, '03', '서버 틱'],
  [10.6, 15.0, '04', '보간 버퍼'],
  [15.0, DURATION, '05', '다 더하면'],
];
const END_AT = 18.4;                       // end card
const OUTRO_AT = END_AT;
const T_TICK = [6.6, 8.6, 10.6];           // server tick pulses (one every 2 s of video = one 50 ms tick)
const T_MORPH = 15.0;                      // the route stands up as a tower of time

// ── palette (night route map · NOC weathermap) ───────────────
const HEX = { sig: '#52ffa0', me: '#6cc8ff', them: '#ff6fd8', amber: '#ffb23e', red: '#ff4f62', gold: '#ffe08a', dev: '#86a59d', ink: '#e9f1ee' };
const COL = Object.fromEntries(Object.entries(HEX).map(([k, v]) => [k, new THREE.Color(v)]));
const INK = HEX.ink, DIM = 'rgba(196,214,208,.76)', SIG = HEX.sig, ME = HEX.me, THEM = HEX.them, AMB = HEX.amber, RED = HEX.red, GOLD = HEX.gold, LAB = '#a8f5cc';

// ── three setup ──────────────────────────────────────────────
const gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
gl.setPixelRatio(1); gl.setSize(W, H, false);
gl.setClearColor(0x03050a, 1);
gl.toneMapping = THREE.ACESFilmicToneMapping; gl.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, W / H, .05, 600);
const composer = new EffectComposer(gl);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), .55, .4, .7);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const U = { uPx: { value: H / (2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2))) }, uTime: { value: 0 } };
const blendAdd = { transparent: true, depthWrite: false, depthTest: false, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendEquation: THREE.AddEquation };

// soft additive glows: round gaussian sprites
const GVS = `
attribute float size; attribute float alpha; attribute vec3 color;
uniform float uPx, uGain;
varying vec3 vC;
void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  float d = max(-mv.z, 0.05);
  gl_PointSize = clamp(size * uPx / d, 1.5, 160.0);
  vC = color * alpha * uGain;
  gl_Position = projectionMatrix * mv;
  if (alpha <= 0.0) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
}`;
const GFS = `varying vec3 vC; void main() { vec2 c = gl_PointCoord * 2.0 - 1.0; float d = dot(c, c); if (d > 1.0) discard; gl_FragColor = vec4(vC * (exp(-d * 5.0) + .15 * exp(-d * 1.5)), 1.0); }`;
// station beacons: a thin ring with a dot (hop marker)
const RFS = `varying vec3 vC; void main() { vec2 c = gl_PointCoord * 2.0 - 1.0; float d = length(c); if (d > 1.0) discard;
  float aa = fwidth(d) * 1.3; float ring = 1.0 - smoothstep(.1, .1 + aa, abs(d - .78)); float core = 1.0 - smoothstep(.26 - aa, .26, d);
  gl_FragColor = vec4(vC * (ring * .9 + core * 1.2 + .12 * exp(-d * d * 3.0)), 1.0); }`;
const LVS = `
attribute vec3 color; attribute float alpha;
uniform float uGain;
varying vec3 vC;
void main() { vC = color * alpha * uGain; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const LFS = `varying vec3 vC; void main() { gl_FragColor = vec4(vC, 1.0); }`;
const gMat = (g, fs = GFS) => new THREE.ShaderMaterial({ uniforms: { ...U, uGain: { value: g } }, vertexShader: GVS, fragmentShader: fs, ...blendAdd });
const lMat = g => new THREE.ShaderMaterial({ uniforms: { ...U, uGain: { value: g } }, vertexShader: LVS, fragmentShader: LFS, ...blendAdd });

class PB {   // point builder
  constructor() { this.p = []; this.s = []; this.a = []; this.c = []; }
  add(v, size, alpha, col) { this.p.push(v.x, v.y, v.z); this.s.push(size); this.a.push(alpha); this.c.push(col.r, col.g, col.b); return this; }
  build(gain = 1, order = 1, fs = GFS) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('size', new THREE.Float32BufferAttribute(this.s, 1));
    g.setAttribute('alpha', new THREE.Float32BufferAttribute(this.a, 1));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    const o = new THREE.Points(g, gMat(gain, fs)); o.frustumCulled = false; o.renderOrder = order; scene.add(o); return o;
  }
}
class LB {   // line-segment builder
  constructor() { this.p = []; this.a = []; this.c = []; }
  add(v1, v2, a1, col, a2 = a1) { this.p.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z); this.a.push(a1, a2); this.c.push(col.r, col.g, col.b, col.r, col.g, col.b); return this; }
  poly(pts, a, col, closed = false) { for (let i = 0; i < pts.length - (closed ? 0 : 1); i++) this.add(pts[i], pts[(i + 1) % pts.length], a, col); return this; }
  build(gain = 1, order = 3) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('alpha', new THREE.Float32BufferAttribute(this.a, 1));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    const o = new THREE.LineSegments(g, lMat(gain)); o.frustumCulled = false; o.renderOrder = order; scene.add(o); return o;
  }
}
const setGain = (o, g) => { o.material.uniforms.uGain.value = g; o.visible = g > .002; };

// ═════════════════════════════════════════════════════════════
//  THE ROUTE — 29 stations, one Catmull-Rom path through all of them
// ═════════════════════════════════════════════════════════════
// [name, detail, ms label, kind, ms on arrival, ms on leaving]  (cumulative ms from the button press — the budget of 06)
//   arrival < leaving = a wait at this station (the time wall rises as a cliff); between stations ms grows along the link.
//   The split of 10 ms inside the client and 12 ms inside the tick is only for drawing the wall; on screen only the 2D labels are shown.
const STN = [
  ['키 입력', 'OS 입력 이벤트', '~0ms', 'me', 0, 0],
  ['게임 루프', '다음 프레임에 읽음', '0~16ms', 'me', 0, 7],
  ['예측 실행', '애니메이션 먼저', '즉시', 'me', 7, 7],
  ['패킷 생성', 'UseSkillReq', '<1ms', 'me', 7, 8],
  ['직렬화 · 암호화', 'protobuf → 바이트', '<1ms', 'me', 8, 9],
  ['send()', '커널 송신 버퍼', '<1ms', 'me', 9, 9.5],
  ['NIC', '랜카드 · 와이파이로', '<1ms', 'me', 9.5, 10],
  ['공유기 · 와이파이', '', '2ms', 'up', 12, 12],
  ['ISP 망', '', '8ms', 'up', 18, 18],
  ['인터넷 백본', '', '16ms', 'up', 26, 26],
  ['IDC 방화벽 · DDoS 필터', '', '23ms', 'up', 33, 33],
  ['로드밸런서', '', '24ms', 'up', 34, 34],
  ['NIC → 커널', '수신 버퍼', '<1ms', 'srv', 35, 35],
  ['I/O 스레드', 'recv · 복호화 · 역직렬화', '<1ms', 'srv', 35, 35],
  ['세션 확인', '누구의 패킷인지', '<1ms', 'srv', 35, 35],
  ['존 메시지 큐', '다음 틱까지 대기', '0~50ms', 'queue', 35, 60],
  ['검증', '쿨다운 · 사거리 · 마나 · 치트', '', 'tick', 60, 63],
  ['판정', '데미지 · 상태 변경', '', 'tick', 63, 66],
  ['AOI 조회', '주변 플레이어 32명', '', 'tick', 66, 69],
  ['브로드캐스트', 'SkillCastNoti · DamageNoti', '', 'tick', 69, 72],
  ['송신 큐 → I/O', '직렬화 · 암호화 · send', '<1ms', 'srv', 72, 72],
  ['인터넷 백본', '', '', 'down', null, null],
  ['상대 ISP', '', '', 'down', null, null],
  ['상대 공유기', '', '', 'down', null, null],
  ['NIC → recv', '복호화 · 역직렬화', '<1ms', 'them', 97, 97],
  ['다음 프레임', '게임 루프가 읽음', '0~16ms', 'them', 97, 105],
  ['보간 버퍼', '일부러 과거를 그림', '~100ms', 'buf', 105, 205],
  ['애니 · 이펙트', '스킬 모션 재생', '즉시', 'them', 205, 205],
  ['화면 출력', 'vsync', '~16ms', 'them', 205, 221],
];
const KIND = { me: HEX.me, up: HEX.sig, srv: HEX.gold, queue: HEX.amber, tick: HEX.gold, down: HEX.sig, them: HEX.them, buf: HEX.red };
// world positions (x, z): my home front-left, the IDC at the back, the other player's home front-right
const POS = [];
for (let i = 0; i < 7; i++) POS.push([-31 + i * 1.33, 9]);
POS.push([-19.4, 6.0], [-15.4, 1.2], [-11.8, -3.6], [-9.4, -7.6], [-7.7, -10.3]);
for (let i = 0; i < 9; i++) POS.push([-6 + i * 1.5, -12]);
POS.push([10.6, -5.2], [15.2, .8], [19.4, 6.0]);
for (let i = 0; i < 5; i++) POS.push([23 + i * 2.4, 9]);
const NS = STN.length, SEG = 40, NSMP = (NS - 1) * SEG + 1;
const CURVE = new THREE.CatmullRomCurve3(POS.map(([x, z]) => V(x, 0, z)), false, 'centripetal');
const PA = new Float32Array(NSMP * 3), SL = new Float32Array(NSMP);
{ const q = new THREE.Vector3(); let px = 0, pz = 0;
  for (let k = 0; k < NSMP; k++) { CURVE.getPoint(k / (NSMP - 1), q); PA[k * 3] = q.x; PA[k * 3 + 2] = q.z; SL[k] = k ? SL[k - 1] + Math.hypot(q.x - px, q.z - pz) : 0; px = q.x; pz = q.z; } }
const LEN = SL[NSMP - 1];

  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const tp = ctx.createLinearGradient(0, 0, 0, 470); tp.addColorStop(0, 'rgba(2,4,6,.92)'); tp.addColorStop(.6, 'rgba(2,4,6,.6)'); tp.addColorStop(1, 'rgba(2,4,6,0)');
  ctx.fillStyle = tp; ctx.fillRect(0, 0, W, 470);
  const b = ctx.createLinearGradient(0, H * .78, 0, H); b.addColorStop(0, 'rgba(2,4,6,0)'); b.addColorStop(1, 'rgba(2,4,6,.75)');
  ctx.fillStyle = b; ctx.fillRect(0, H * .78, W, H * .22);
}
// the running total under the HUD
function counter(t) {
  const a = win(t, 2.55, END_AT + .1, .4); if (a <= 0) return;
  const ms = t < 15.2 ? msAt(HEADS) : TOTAL, hot = ms > 150 ? '#ff8a96' : ms > 55 ? GOLD : INK;
  ctx.save(); ctx.globalAlpha = a; shadow(20);
  txt(t > 15.2 ? '버튼부터 상대 화면까지' : '버튼부터 누적', X0, 236, { size: 40, weight: 700, color: LAB });
  const num = (t > 15.2 ? '≈ ' : '') + Math.round(ms), nw = tw(num, 150, 700, true, -3);
  txt(num, X0, 386, { size: 150, weight: 700, mono: true, color: hot, ls: -3 });
  txt('ms', X0 + nw + 16, 386, { size: 54, weight: 700, color: SIG });
  ctx.restore();
  ctx.save(); shadow(10); txt('* 수치는 예시 · 20Hz · RTT 50ms', X1, 236, { size: 30, weight: 600, color: 'rgba(214,232,226,.62)', align: 'right', alpha: a }); ctx.restore();
}

// ── title (0 – 2.6) ──────────────────────────────────────────
function sTitle(t) {
  const a = 1 - eio(p(t, 2.3, .5)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  txt('UseSkillReq → SkillCastNoti', CX, 300, { size: 34, weight: 600, color: DIM, align: 'center', mono: true, ls: 2, alpha: eo(p(t, .1, .6)) });
  shadow(24);
  const L = [[[['내', ME], [' 스킬 하나가', INK]], 470, .3], [[['상대', THEM], [' 화면에', INK]], 610, .55], [[['뜨기까지', INK]], 750, .8]];
  L.forEach(([line, y, t0]) => {
    const k = eo(p(t, t0, .7)), tot = line.reduce((s, [w]) => s + tw(w, 124, 800, false, -2), 0); let x = CX - tot / 2;
    line.forEach(([w, c]) => { txt(w, x, y + (1 - k) * 26, { size: 124, weight: 800, color: c, alpha: k, blur: (1 - k) * 12, ls: -2 }); x += tw(w, 124, 800, false, -2); });
  });
  ctx.restore();
}

// ── scene tags per beat ──────────────────────────────────────
function sTags(t) {
  // my PC
  { const a = win(t, 2.7, 4.3, .3); tag(2, a, { name: '예측 실행 → 내 화면', col: ME, up: 120, size: 36 }); }
  // the network hops
  [[7, '공유기 · 와이파이', '12ms', 4.3], [9, '인터넷 백본', '26ms', 5.3], [10, 'IDC 방화벽', '33ms', 5.8]].forEach(([i, name, ms, t0]) => tag(i, win(t, t0, 7.0, .3), { name, ms, col: SIG, up: 66, size: 34 }));
  // the server
  tag(15, win(t, 7.4, 9.0, .3), { name: '존 메시지 큐', ms: '0~50ms', col: AMB, up: 110 });
  tag(17, win(t, 8.9, 10.6, .3), { name: '틱 처리', ms: '~12ms', col: GOLD, up: 110 });
  { const a = win(t, 7.0, 10.0, .3); if (a > 0) { const P = proj(V(TICKBOX[0], 0, TICKBOX[1] + 1.4)); ctx.save(); shadow(12); txt('틱 · 50ms마다', P.x, P.y + 60, { size: 34, weight: 800, color: GOLD, align: 'center', alpha: a }); ctx.restore(); } }
  { const tb = ARRIVE[19] ?? 9.95, a = win(t, tb + .2, 10.9, .3); if (a > 0) { const P = proj(V(AOI_C.x, 3.2, AOI_C.z - 1.4)); ctx.save(); shadow(12); txt('주변 32명에게 전파', P.x, P.y - 20, { size: 34, weight: 800, color: '#ffb8ea', align: 'center', alpha: a }); ctx.restore(); } }
  // the other player's PC
  tag(24, win(t, 11.4, 12.6, .3), { name: '상대 PC 도착', ms: '', col: THEM, up: 80, size: 34, align: 'right', dx: -24 });
  { const a = win(t, 12.4, 15.1, .3); if (a > 0) { const c = posAtRaw(SS[26]); c.y = 150 * KH; const P = proj(c); ctx.save(); shadow(14);
    txt('보간 버퍼', P.x - 40, P.y - 40, { size: 40, weight: 800, color: '#ff9aa6', align: 'right', alpha: a });
    txt('~100ms', P.x - 40, P.y + 12, { size: 44, weight: 800, mono: true, color: RED, align: 'right', alpha: a }); ctx.restore(); } }
  tag(28, win(t, 14.4, 15.2, .25), { name: '상대 화면', ms: '221ms', col: THEM, up: 70, size: 34 });
}

// ── 05 · the tower of time ───────────────────────────────────
const BUD_V = [['입력 · 처리', 10, HEX.me], ['업링크', 25, HEX.sig], ['틱 대기', 25, HEX.amber], ['틱 처리', 12, HEX.gold], ['다운링크', 25, HEX.sig], ['프레임', 8, '#c58cff'], ['보간 버퍼', 100, HEX.red], ['렌더', 16, HEX.them]];
function sTower(t) {
  const a = win(t, 15.9, END_AT + .2, .4); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  let acc = 0;
  const yAt = ms => proj(V(.8, BY0 + BHT * ms / TOTAL, BZ));
  BUD_V.forEach(([lab, ms, col], i) => {
    const s0 = acc; acc += ms; const k = eo(p(t, 16.0 + i * .12, .4)); if (k <= 0) return;
    const P0 = yAt(s0), P1 = yAt(acc), y = (P0.y + P1.y) / 2, x = P0.x + 40;
    const big = i === 6;
    // small stages sit close together: spread their labels
    const ly = big ? y : [0, 0, 0, 0, 0, 0, 0, 0][i] + y;
    ctx.save(); ctx.globalAlpha *= k * .6; ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(P0.x + 8, y); ctx.lineTo(x - 8, ly); ctx.stroke(); ctx.restore();
    ctx.save(); shadow(12);
    if (big) { txt(lab, x, ly - 14, { size: 46, weight: 800, color: '#ff9aa6', alpha: k }); txt('~100ms', x, ly + 44, { size: 52, weight: 800, mono: true, color: RED, alpha: k }); }
    else { txt(lab, x, ly + 12, { size: 34, weight: 700, color: INK, alpha: k }); txt(ms + 'ms', x + tw(lab, 34, 700) + 16, ly + 12, { size: 34, weight: 700, mono: true, color: col, alpha: k }); }
    ctx.restore();
  });
  ctx.restore();
}

// ── end card ─────────────────────────────────────────────────
function endCard(t) {
  const v = t - END_AT, a = eio(p(v, 0, .5));
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(2,4,6,.8)'; ctx.fillRect(0, 0, W, H);
  const k1 = eo(p(v, .2, .6)), k2 = eo(p(v, .5, .6)), k3 = eo(p(v, 1.0, .6)), k4 = eo(p(v, 1.4, .6));
  ctx.save(); shadow(24);
  [[[['내 화면은', INK]], 640, k1], [[['~25ms,', ME]], 790, k1], [[['상대 화면은', INK]], 980, k2], [[['200ms+.', THEM]], 1130, k2]].forEach(([line, y, k]) => {
    const [w, c] = line[0]; txt(w, CX, y + (1 - k) * 20, { size: 124, weight: 800, color: c, align: 'center', alpha: k, blur: (1 - k) * 10, ls: -2 });
  });
  ctx.restore();
  txt('예시 20Hz · RTT 50ms · 이벤트도 보간 시점에 재생할 때', CX, 1260, { size: fit('예시 20Hz · RTT 50ms · 이벤트도 보간 시점에 재생할 때', 960, 34, 600), weight: 600, color: DIM, align: 'center', alpha: k3 });
  const url = 'jungrok5.github.io/motion-graphics/skill-journey', uw = tw(url, 30, 600, true);
  ctx.save(); ctx.globalAlpha *= k4; ctx.fillStyle = 'rgba(82,255,160,.55)'; ctx.fillRect(CX - uw / 2 - 70, 1440, 44, 2); ctx.fillRect(CX + uw / 2 + 26, 1440, 44, 2); ctx.restore();
  txt('전체 영상 · 설명 · 용어집', CX, 1390, { size: 38, weight: 700, color: DIM, align: 'center', alpha: k4 });
  txt(url, CX, 1450, { size: 30, weight: 600, mono: true, color: SIG, align: 'center', alpha: k4 });
  ctx.restore();
}

// ── frame ────────────────────────────────────────────────────
function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.shadowBlur = 0;
  update3D(t);
  composer.render();
  ctx.drawImage(gl.domElement, 0, 0, W, H);
  vignette();
  sTitle(t); sTags(t); sTower(t);
  counter(t);
  caption(['내 화면엔 ~25ms 만에 보인다', '예측 실행 · 서버 승인은 아직'], t, 2.75, 4.35, { col2: ME });
  caption(['패킷은 집 → ISP → 백본 → IDC', '편도 25ms (RTT 50ms의 절반)'], t, 4.45, 7.0, { col2: SIG });
  caption(['다음 틱까지 줄 서서 기다린다', '0~50ms, 평균 25ms (20Hz)'], t, 7.15, 8.95, { col2: AMB });
  caption(['틱에서 판정 ~12ms,', '주변 32명에게 전파'], t, 9.05, 10.6, { col2: GOLD });
  caption(['다운링크 ~25ms를 지나', '상대 PC 도착 · 버튼부터 97ms'], t, 10.7, 12.4, { col2: SIG });
  caption(['상대 클라는 일부러', '~100ms 과거를 그린다 (보간 버퍼)'], t, 12.5, 15.0, { col2: '#ff9aa6' });
  caption(['가장 큰 몫은 보간 버퍼 ~100ms'], t, 15.6, 16.9, { col2: '#ff9aa6' });
  caption(['이벤트를 받자마자 재생하면', '이 100ms는 빠진다'], t, 17.0, END_AT + .1, { col2: '#ff9aa6' });
  if (t > END_AT) endCard(t);
  header(t);
  const fo = p(t, DURATION - .5, .5); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;
window.DURATION = DURATION;

window.ready = (async () => {
  const faces = [['Pretendard', 'Pretendard-Variable.woff2', '100 900'], ['JetBrains Mono', 'JetBrainsMono.woff2', '100 800']];
  for (const [family, file, weight] of faces) {
    for (const base of ['assets/fonts/', '../assets/fonts/']) {
      try { document.fonts.add(await new FontFace(family, `url(${base}${file})`, { weight }).load()); break; } catch (e) { /* try next */ }
    }
  }
  await document.fonts.ready;
})();
// ── player (skipped when ?render) ────────────────────────────
if (!location.search.includes('render')) {
  const $ = id => document.getElementById(id);
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    replay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>',
  };
  const CHAPTERS = HEAD.map(h => [h[0], h[2], h[3]]);
  $('scrub').setAttribute('aria-valuemax', Math.round(DURATION));
  const POSTER = 13.4;   // the packet waiting in the other player's interpolation buffer, the red cliff rising
  let t = 0, playing = false, started = false, last = 0;
  const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

  CHAPTERS.forEach(([s, n, label], i) => {
    const b = document.createElement('button');
    b.innerHTML = (n ? `<span>${n}</span>` : '') + label;
    b.addEventListener('click', () => { seek(s + .01); play(); });
    $('chapters').appendChild(b);
    if (i) { const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (s / DURATION * 100) + '%'; $('ticks').appendChild(tk); }
  });

  function ui() {
    const k = t / DURATION, ended = t >= DURATION;
    $('fill').style.width = k * 100 + '%'; $('knob').style.left = k * 100 + '%';
    $('time').textContent = `${mmss(t)} / ${mmss(DURATION)}`;
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
    $('play').innerHTML = playing ? ICON.pause : ended ? ICON.replay : ICON.play;
    $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
    $('big').hidden = playing;
    $('big').innerHTML = ended ? ICON.replay : ICON.play;
    $('big').classList.toggle('replay', ended);
    let cur = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) cur = i; });
    [...$('chapters').children].forEach((b, i) => b.setAttribute('aria-current', i === cur && started));
  }
  function draw() { renderAt(started ? Math.min(t, DURATION - .001) : POSTER); }
  function play() { if (t >= DURATION) t = 0; started = true; playing = true; last = performance.now(); ui(); }
  function pause() { playing = false; ui(); }
  function toggle() { playing ? pause() : play(); }
  function seek(x) { started = true; t = clamp(x, 0, DURATION); draw(); ui(); }

  function frame(now) {
    if (playing) {
      t += (now - last) / 1000 * rate; last = now;
      if (t >= DURATION) { t = DURATION; playing = false; }
      draw(); ui();
    }
    requestAnimationFrame(frame);
  }

  const RATES = [1, .75, .5];
  let rate = 1;
  try { rate = +localStorage.getItem('mg-rate') || 1; } catch (e) { /* storage unavailable */ }
  if (!RATES.includes(rate)) rate = 1;
  function setRate(r) {
    rate = r; $('rate').textContent = r + '×'; $('rate').setAttribute('aria-label', `재생 속도 ${r}배`);
    try { localStorage.setItem('mg-rate', String(r)); } catch (e) { /* storage unavailable */ }
  }
  setRate(rate);
  $('rate').addEventListener('click', () => setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]));
  $('stage').addEventListener('click', toggle);
  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {
    const el = $('stage');
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
  });
  const scrub = $('scrub');
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
    else if (e.key === ',' || e.key === '<') setRate(RATES[Math.min(RATES.length - 1, RATES.indexOf(rate) + 1)]);
    else if (e.key === '.' || e.key === '>') setRate(RATES[Math.max(0, RATES.indexOf(rate) - 1)]);
  });

  const posterMode = location.hash === '#poster';
  if (posterMode) document.body.classList.add('poster');
  ui();
  const deep = /^#ch(\d\d)$/.exec(location.hash), deepHead = deep && HEAD.find(r => r[2] === deep[1]);
  window.ready.then(() => {
    draw(); requestAnimationFrame(frame);
    if (deepHead) seek(deepHead[0] + .01);
    if (posterMode) { play(); setInterval(() => { if (!playing) { t = 0; play(); } }, 500); }
  });
  renderAt(POSTER);
}
</script>
