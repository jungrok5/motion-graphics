<style>
  /* Layout: one 16:9 stage, a slim transport bar under it, chapter chips below. Single dark look. */
  :root {
    --bg: #070a13; --surface: #0e1424; --line: #24304a; --fg: #e8ecf4; --dim: #8b95a7;
    --accent: #a78bfa; --live: #34d399; --text2: #c3cad8;
    --sans: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; overflow-x: hidden; }
  .player { width: min(100%, calc((100vh - 170px) * 9 / 16), 480px); min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .big { position: absolute; inset: auto 0 5% 0; margin: 0 auto; width: clamp(44px, 11%, 84px); height: auto; aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--accent);
    background: rgba(14,20,36,.78); color: var(--fg); display: grid; place-items: center; cursor: pointer; transition: transform .15s, opacity .2s; }
  .big[hidden] { display: none; }
  .big:hover { transform: scale(1.06); }
  .big svg { width: 36%; height: 36%; margin-left: 6%; }
  .big.replay svg { margin-left: 0; }
  .bar { display: flex; align-items: center; gap: 14px; }
  .btn { flex: none; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--fg); display: grid; place-items: center; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn svg { width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .time { flex: none; font: 500 13px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .scrub { position: relative; flex: 1; min-width: 0; height: 28px; cursor: pointer; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--line); }
  .fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--live)); }
  .tick { position: absolute; top: 8px; width: 2px; height: 12px; background: var(--dim); opacity: .6; }
  .knob { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 4px rgba(167,139,250,.25); }
  .chapters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chapters button { font: 600 13px/1 var(--sans); color: var(--dim); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; cursor: pointer; }
  .chapters button span { font-family: var(--mono); color: var(--accent); margin-right: 6px; }
  .chapters button:hover { color: var(--fg); }
  .chapters button[aria-current="true"] { color: var(--fg); border-color: var(--accent); background: rgba(167,139,250,.12); }
  .hint { font-size: 12px; color: var(--dim); margin-left: auto; }
  @media (max-width: 600px) { .hint { display: none; } .time { font-size: 12px; } }
  .set { display: flex; flex-wrap: wrap; gap: 8px; }
  .set a { font: 600 13px/1 var(--sans); color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
  .set a:hover { border-color: var(--accent); }
  body.poster .set { display: none; }
  .rate { width: auto; min-width: 56px; padding: 0 10px; font: 600 13px/1 var(--mono); }
  /* Notes under the player: chapter-by-chapter explanation + glossary */
  .notes { width: min(100%, 860px); margin-top: 56px; padding-bottom: 48px; font-size: 16px; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
  .notes h2 { font-size: 22px; line-height: 1.4; margin: 48px 0 16px; text-wrap: balance; }
  .notes h2:first-child { margin-top: 0; }
  .notes h2 .more { font: 600 13px/1 var(--sans); color: var(--accent); margin-left: 10px; white-space: nowrap; }
  .notes .lede { font-size: 18px; color: var(--fg); }
  .notes p, .notes li { color: var(--text2); }
  .notes ul { padding-left: 1.2em; }
  .notes article { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 24px; }
  .notes h3 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 18px; line-height: 1.4; margin: 0 0 8px; }
  .notes h3 .n { font: 600 13px/1 var(--mono); color: var(--accent); }
  .notes h3 button { margin-left: auto; font: 600 12px/1 var(--sans); color: var(--dim); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .notes h3 button:hover { color: var(--fg); border-color: var(--accent); }
  .notes code { font: 500 .88em var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
  .notes .terms { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: 12px 24px; margin: 0; }
  .notes dt { font-weight: 700; }
  .notes dd { margin: 0; color: var(--text2); }
  @media (max-width: 600px) { .notes .terms { grid-template-columns: minmax(0, 1fr); gap: 2px; } .notes dd { margin-bottom: 14px; } }
  /* #poster: embed mode for gallery thumbnails — canvas only, loops */
  body.poster { padding: 0; }
  body.poster .player { width: 100%; }
  body.poster .bar, body.poster .chapters, body.poster .big, body.poster .notes { display: none; }
  body.poster .stage { border: 0; border-radius: 0; }
</style>

<script>
// ─────────────────────────────────────────────────────────────
//  이동 패킷 1바이트: 네 가지 크기, 곱하기, 총량, 프로토버퍼 (세로 쇼츠)
//  Every frame is a pure function of time: renderAt(t).
// ─────────────────────────────────────────────────────────────
const W = 1080, H = 1920, DURATION = 54;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg: '#070a13', text: '#e8ecf4', dim: '#8b95a7', faint: '#4b5568',
  proto: '#a78bfa', client: '#38bdf8', server: '#fbbf24', bot: '#34d399',
  pub: '#f472b6', red: '#f87171', panel: '#0e1424', line: '#24304a',
};
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';

// ── math / easing ────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
// fade in at s, fade out at e
const win = (t, s, e, f = .45) => Math.min(eo(p(t, s, f)), 1 - eio(p(t, e - f, f)));

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);
const PARTS = Array.from({ length: 70 }, () => ({ x: R() * W, y: R() * H, vx: (R() - .5) * 14, vy: -4 - R() * 10, s: 1 + R() * 2, a: .05 + R() * .18 }));

// ── drawing helpers ──────────────────────────────────────────
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(sz, wt = 500, mono = false) { ctx.font = `${wt} ${sz}px ${mono ? MONO : SANS}`; }
function txt(s, x, y, o = {}) {
  const { size = 32, weight = 500, color = C.text, align = 'left', base = 'alphabetic', alpha = 1, mono = false, ls = 0 } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; font(size, weight, mono);
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = ls + 'px';
  ctx.fillText(s, x, y); ctx.restore();
}
function tw(s, size, weight = 500, mono = false) { font(size, weight, mono); return ctx.measureText(s).width; }
function panel(x, y, w, h, o = {}) {
  const { r = 18, fill = C.panel, stroke = C.line, glow = null, glowA = 1, alpha = 1, lw = 1.5, dash = null } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  if (glow) { ctx.shadowColor = rgba(glow, .55 * glowA); ctx.shadowBlur = 50; }
  rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.shadowBlur = 0;
  if (dash) ctx.setLineDash(dash);
  ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); ctx.restore();
}
function chip(label, x, y, color, o = {}) {
  const { alpha = 1, size = 18, align = 'left', fillA = .14 } = o;
  font(size, 700, true);
  const w = ctx.measureText(label).width + size * 1.2, h = size * 1.6;
  const X = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  ctx.save(); ctx.globalAlpha *= alpha;
  rr(X, y - h / 2, w, h, h / 2); ctx.fillStyle = rgba(color, fillA); ctx.fill();
  ctx.strokeStyle = rgba(color, .7); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, X + w / 2, y + 1); ctx.restore();
  return w;
}
function dot(x, y, r, color, a = 1, glow = 18) {
  ctx.save(); ctx.globalAlpha *= a; ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function check(x, y, s, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = s * .16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .36, y); ctx.lineTo(x - s * .1, y + s * .26); ctx.lineTo(x + s * .38, y - s * .28); ctx.stroke(); ctx.restore();
}
function cross(x, y, s, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = s * .16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .3, y - s * .3); ctx.lineTo(x + s * .3, y + s * .3);
  ctx.moveTo(x + s * .3, y - s * .3); ctx.lineTo(x - s * .3, y + s * .3); ctx.stroke(); ctx.restore();
}
function botIcon(x, y, s, color, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, s * .07);
  rr(x - s / 2, y - s * .36, s, s * .72, s * .2); ctx.fillStyle = rgba(color, .15); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - s * .36); ctx.lineTo(x, y - s * .54); ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y - s * .6, s * .07, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x - s * .19, y - s * .04, s * .08, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + s * .19, y - s * .04, s * .08, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - s * .16, y + s * .18); ctx.lineTo(x + s * .16, y + s * .18); ctx.stroke();
  ctx.restore();
}
function bezPt(P, t) {
  const [a, b, c, d] = P, u = 1 - t;
  return [u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0],
          u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1]];
}
function bezLine(P, k, color, lw = 2, a = 1) {
  if (k <= 0 || a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
  for (let i = 0; i <= 48; i++) { const q = bezPt(P, k * i / 48); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
  ctx.stroke(); ctx.restore();
}

// ── tiny syntax highlighter ──────────────────────────────────
const KW = new Set(['syntax', 'package', 'message', 'public', 'sealed', 'partial', 'class', 'final', 'var', 'new', 'const', 'get', 'set']);
const TY = new Set(['string', 'int32', 'int64', 'int', 'int32_t', 'IMessage']);
function tokens(line) {
  const out = [], re = /(\/\/.*$|"[^"]*"|\s+|\d+|[A-Za-z_]\w*|.)/g; let m;
  while ((m = re.exec(line))) {
    const s = m[0]; let c = C.text;
    if (s.startsWith('//')) c = C.faint;
    else if (s[0] === '"') c = '#86efac';
    else if (/^\d+$/.test(s)) c = C.server;
    else if (KW.has(s)) c = C.proto;
    else if (TY.has(s)) c = C.client;
    else if (/^[^\w\s]$/.test(s)) c = C.dim;
    out.push([s, c]);
  }
  return out;
}
// lines: array of strings. chars: how many characters are revealed (newline = 1).
// insert: {idx, s, k, chars} — a line sliding in at idx (k: 0..1).
function code(lines, x, y, o = {}) {
  const { size = 24, lh = 36, chars = Infinity, alpha = 1, insert = null, hlW = 600 } = o;
  ctx.save(); ctx.globalAlpha *= alpha; font(size, 500, true); ctx.textBaseline = 'alphabetic';
  const cw = ctx.measureText('M').width; let left = chars, cursor = null;
  const drawLine = (s, yy, limit) => {
    let col = 0;
    for (const [tok, c] of tokens(s)) {
      if (limit <= 0) break;
      const vis = tok.slice(0, limit); ctx.fillStyle = c;
      ctx.fillText(vis, x + col * cw, yy); col += vis.length; limit -= vis.length;
    }
    return col;
  };
  let shift = 0;
  const drawInsert = i => {
    if (!insert || i !== insert.idx || insert.k <= 0) return;
    {
      const yy = y + i * lh; const k = insert.k;
      ctx.save(); ctx.globalAlpha *= k;
      ctx.fillStyle = rgba(C.bot, .16 * (insert.flash ?? 1)); ctx.fillRect(x - 18, yy - lh * .74, hlW, lh);
      ctx.fillStyle = C.bot; ctx.fillRect(x - 18, yy - lh * .74, 4, lh);
      drawLine(insert.s, yy, insert.chars ?? Infinity); ctx.restore();
      shift = insert.k;
    }
  };
  lines.forEach((ln, i) => {
    drawInsert(i);
    if (left <= 0) return;
    const yy = y + (i + shift) * lh;
    const col = drawLine(ln, yy, left);
    cursor = [x + col * cw, yy]; left -= ln.length + 1;
  });
  drawInsert(lines.length);
  ctx.restore();
  return { cw, cursor };
}

// ── background, headers, progress ────────────────────────────
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const glow = (cx, cy, r, col) => { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  glow(W * .18 + Math.sin(t * .2) * 80, H * .1, 900, 'rgba(167,139,250,0.10)');
  glow(W * .86, H * .92 + Math.cos(t * .17) * 60, 900, 'rgba(56,189,248,0.08)');
  ctx.strokeStyle = 'rgba(148,163,184,0.055)'; ctx.lineWidth = 1;
  const off = (t * 10) % 60; ctx.beginPath();
  for (let x = -60 + off; x < W; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -60 + off; y < H; y += 60) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  for (const q of PARTS) {
    const x = ((q.x + t * q.vx) % W + W) % W, y = ((q.y + t * q.vy) % H + H) % H;
    ctx.fillStyle = `rgba(200,210,255,${q.a})`; ctx.fillRect(x, y, q.s, q.s);
  }
}

// [start, end, number, title, subtitle] — one row per chapter. Chapters own the top-left header zone (y < 190).
// ── word-by-word title ───────────────────────────────────────
function words(ws, cx, y, t, t0, o = {}) {
  const { size = 96, weight = 800, stagger = .12, colors = [] } = o;
  font(size, weight); const sp = size * .28;
  const widths = ws.map(w => ctx.measureText(w).width);
  let x = cx - (widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1)) / 2;
  ws.forEach((w, i) => {
    const k = eo(p(t, t0 + i * stagger, .8));
    ctx.save(); ctx.globalAlpha *= k; font(size, weight); ctx.fillStyle = colors[i] || C.text;
    if (colors[i]) { ctx.shadowColor = rgba(colors[i], .5); ctx.shadowBlur = 40; }
    ctx.fillText(w, x, y + (1 - k) * 46); ctx.restore();
    x += widths[i] + sp;
  });
}


// ═════════════════════════════════════════════════════════════
//  INTRO (0 – 5.2) — config driven
// ═════════════════════════════════════════════════════════════
const fmt = n => Math.round(n).toLocaleString('en-US');
// ── vertical layout (shorts) ─────────────────────────────────
// Full-bleed frame; only text keeps a light margin from the shorts app's own UI (top ~110px, bottom ~280px).
// Header y 100–340, picture y 370–1470, caption y 1500–1640. Side margins 60, centered on 540.
const X0 = 60, X1 = 1020, CX = (X0 + X1) / 2;

// [start, end, number, title, subtitle]
const HEAD = [
  [4.5, 15.0, '01', '네 가지 크기', '같은 이동 정보를 네 방식으로 인코딩'],
  [15.0, 27.0, '02', '1바이트에 붙는 곱하기', '보는 사람 × 갱신 빈도 × 동접 × 시간'],
  [27.0, 38.0, '03', '크기별 총량', '서버 전체 송신 / 월 · 비용'],
  [38.0, 49.0, '04', '프로토버퍼와 비교', '같은 수준끼리 비교한다'],
];
function headers(t) {
  for (const [s, e, n, title, sub] of HEAD) {
    const a = win(t, s, e, .4); if (a <= 0) continue;
    const k = eo(p(t, s + .05, .7)), k2 = eo(p(t, s + .3, .7));
    ctx.save(); ctx.globalAlpha = a;
    chip(n, X0 - (1 - k) * 30, 168, C.proto, { size: 32, alpha: k });
    txt(title, X0 - (1 - k) * 30, 262, { size: 80, weight: 800, alpha: k });
    txt(sub, X0, 330, { size: 40, weight: 500, color: C.dim, alpha: k2 });
    ctx.restore();
  }
}
function progress(t) {   // thin bar only; the shorts app shows its own timeline
  const a = clamp(Math.min(t - HEAD[0][0] + .4, DURATION - .6 - t) * 2) * .8; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(148,163,184,0.18)'; ctx.fillRect(X0, 110, X1 - X0, 4);
  ctx.fillStyle = C.proto; ctx.fillRect(X0, 110, (X1 - X0) * clamp(t / DURATION), 4);
  ctx.restore();
}
function caption(lines, u, t0, col = C.text) {
  lines.forEach((l, i) => txt(l, CX, 1550 + i * 70, { size: i ? 44 : 54, weight: 800, align: 'center', color: i ? C.dim : col, alpha: eo(p(u, t0 + i * .5, .5)) }));
}

// ── model (same example as the full video) ───────────────────
// Roles: client = 이동 데이터, proto = 프로토버퍼, red = 태그 · 초과, bot = 절감, pub = 보는 사람
// 5,000 CCU · 50 viewers · 10Hz → 1 byte of movement = 6.48TB/month; movement = 60% of outbound at 24B
const VIEW = 50, HZ = 10, TB_PER_BYTE = 6.48;
const OTHER_TB = 24 * TB_PER_BYTE / .6 * .4;   // non-movement outbound, fixed
const SIZES = [[34, '프로토버퍼 기본', C.proto], [24, '커스텀 기본', C.client], [19, '커스텀 비트 패킹', C.client], [8, '이동 전용 극단 양자화', C.bot]];
const totalTB = b => b * TB_PER_BYTE + OTHER_TB;
function bytesFmt(b) { const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; } return (b >= 100 || i === 0 ? Math.round(b) : b.toFixed(1)) + ' ' + u[i]; }
const money = tb => '$' + (tb * .05).toFixed(1) + 'k~' + (tb * .09).toFixed(1) + 'k';
// groups: [label, tagBytes, valueBytes, color]
const G34 = [['래퍼', 2, 0, C.red], ['ID', 1, 3, C.pub], ['x', 1, 4, C.client], ['y', 1, 4, C.client], ['z', 1, 4, C.client], ['방향', 1, 3, C.server], ['상태', 1, 1, C.proto], ['시각', 1, 6, C.faint]];
const G24 = [['ID', 0, 4, C.pub], ['x', 0, 4, C.client], ['y', 0, 4, C.client], ['z', 0, 4, C.client], ['방향', 0, 2, C.server], ['상태', 0, 2, C.proto], ['시각', 0, 4, C.faint]];
const G19 = [['ID', 0, 3, C.pub], ['x', 0, 4, C.client], ['y', 0, 4, C.client], ['z', 0, 4, C.client], ['방향', 0, 2, C.server], ['상태', 0, 1, C.proto], ['Δt', 0, 1, C.faint]];
const BITS8 = [['슬롯', 12, C.pub], ['x', 14, C.client], ['y', 14, C.client], ['z', 8, C.client], ['방향', 6, C.server], ['상태', 4, C.proto], ['Δt', 6, C.faint]];
function cellRow(x, y, bw, h, groups, k, reveal = 1) {
  const total = groups.reduce((s, [, t, v]) => s + t + v, 0); let n = 0, cx = x;
  groups.forEach(([, tb, vb, col]) => {
    for (let b = 0; b < tb + vb; b++) {
      if (n++ >= total * reveal) return;
      const isTag = b < tb;
      ctx.save(); ctx.globalAlpha *= k; rr(cx + 2, y, bw - 4, h, 5); ctx.fillStyle = rgba(isTag ? C.red : col, isTag ? .8 : .5); ctx.fill(); ctx.restore();
      cx += bw;
    }
  });
}
function bitCells(x, y, bw, h, k, reveal = 1) {
  const bitW = bw / 8; let bit = 0;
  BITS8.forEach(([, n, col]) => {
    const x0 = x + bit * bitW, w = n * bitW; bit += n;
    if (bit > 64 * reveal) return;
    ctx.save(); ctx.globalAlpha *= k; ctx.fillStyle = rgba(col, .6); ctx.fillRect(x0 + 1, y + 4, w - 2, h - 8); ctx.restore();
  });
  for (let b = 0; b < 8; b++) { if (b >= 8 * reveal) break; ctx.save(); ctx.globalAlpha *= k; rr(x + b * bw + 2, y, bw - 4, h, 5); ctx.strokeStyle = rgba(C.bot, .9); ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
}

// ═════════════════════════════════════════════════════════════
//  INTRO
// ═════════════════════════════════════════════════════════════
function sTitle(t) {
  const a = win(t, 0, 4.9, .5); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  txt('BYTES × VIEWERS × HZ × CCU', CX, 600, { size: 36, weight: 600, color: C.dim, align: 'center', mono: true, ls: 4, alpha: eo(p(t, .1, .6)) });
  words(['이동', '패킷'], CX, 790, t, .3, { size: 120, colors: [C.client, null] });
  words(['1바이트를', '줄이면'], CX, 950, t, .7, { size: 120, colors: [C.bot, null] });
  const k = eo(p(t, 1.4, .6)), n = Math.round(lerp(34, 8, eio(p(t, 2, 1.6)))), bw = 26, x = CX - n * bw / 2;
  for (let i = 0; i < n; i++) { ctx.save(); ctx.globalAlpha *= k; rr(x + i * bw + 2, 1140, bw - 4, 70, 5); ctx.fillStyle = rgba(i < 2 && n > 30 ? C.red : n > 20 ? C.proto : C.bot, .6); ctx.fill(); ctx.restore(); }
  txt(n + 'B', CX, 1340, { size: 104, weight: 800, mono: true, align: 'center', color: n > 20 ? C.proto : C.bot, alpha: k });
  ctx.restore();
}

// ═════════════════════════════════════════════════════════════
//  01 · same movement entry, four sizes
// ═════════════════════════════════════════════════════════════
function sSizes(t) {
  const [S, E] = HEAD[0]; const a = win(t, S, E, .5); if (a <= 0) return;
  const u = t - S; ctx.save(); ctx.globalAlpha = a;
  const rows = [[G34, '빨간 칸 = 필드 태그 · 길이', C.red], [G24, '필드 순서를 미리 약속, 태그 없음', C.dim],
                [G19, '방향 · 상태 · Δt를 1~2바이트로', C.dim], [null, 'AOI 슬롯 · 상대 좌표 · 방향 64단계', C.dim]];
  rows.forEach(([g, desc, dcol], i) => {
    const [size, lab, col] = SIZES[i], t0 = .3 + i * 1.3, k = eo(p(u, t0, .5)); if (k <= 0) return;
    const y = 380 + i * 270 + (1 - k) * 30;
    panel(X0, y, X1 - X0, 248, { alpha: k, stroke: rgba(col, .45) });
    txt(lab, X0 + 38, y + 66, { size: 42, weight: 800, color: col, alpha: k });
    txt(size + 'B', X1 - 38, y + 90, { size: 96, weight: 800, mono: true, align: 'right', color: col, alpha: k });
    const rv = eio(p(u, t0 + .1, 1));
    if (g) cellRow(X0 + 38, y + 114, 26, 60, g, k, rv); else bitCells(X0 + 38, y + 114, 26, 60, k, rv);
    txt(desc, X0 + 38, y + 222, { size: 36, weight: dcol === C.red ? 700 : 500, color: dcol, alpha: eo(p(u, t0 + .6, .5)) });
  });
  caption(['34B에서 8B까지, 76% 차이', '8B는 이동만 극단적으로 다듬은 예'], u, 6.2, C.bot);
  ctx.restore();
}

// ═════════════════════════════════════════════════════════════
//  02 · one byte, multiplied
// ═════════════════════════════════════════════════════════════
const CHAIN = [
  ['1 바이트', '줄인 크기', 1, ''],
  ['× 50', '한 명의 이동을 보는 사람 수', 50, ''],
  ['× 10', '초당 이동 갱신 (10Hz)', 500, '/s'],
  ['× 5,000', '동시접속', 2.5e6, '/s'],
  ['× 86,400', '하루 (초)', 2.16e11, '/일'],
  ['× 30', '한 달', 6.48e12, '/월'],
];
function sChain(t) {
  const [S, E] = HEAD[1]; const a = win(t, S, E, .5); if (a <= 0) return;
  const u = t - S; ctx.save(); ctx.globalAlpha = a;
  CHAIN.forEach(([op, desc, val, unit], i) => {
    const k = eo(p(u, .4 + i * 1.2, .6)); if (k <= 0) return;
    const last = i === CHAIN.length - 1, y = 380 + i * 150, h = last ? 320 : 136;
    ctx.save(); ctx.globalAlpha *= k; rr(X0, y, X1 - X0, h, 16); ctx.fillStyle = rgba(last ? C.red : C.proto, last ? .1 : i % 2 ? .06 : .1); ctx.fill();
    if (last) { ctx.strokeStyle = rgba(C.red, .5); ctx.lineWidth = 1.5; ctx.stroke(); } ctx.restore();
    txt(op, X0 + 36, y + 62, { size: 54, weight: 800, mono: true, color: i === 0 ? C.client : C.pub, alpha: k });
    txt(desc, X0 + 36, y + 114, { size: 34, color: C.dim, alpha: k });
    const shown = val * eo(p(u, .6 + i * 1.2, .7));
    if (!last) txt(bytesFmt(shown) + unit, X1 - 36, y + 80, { size: 54, weight: 800, mono: true, align: 'right', alpha: k });
    else txt(bytesFmt(shown) + unit, CX, y + 262, { size: 120, weight: 800, mono: true, align: 'center', color: C.red, alpha: k });
    if (i === 3) txt('= 20 Mbps', X1 - 36, y + 122, { size: 34, weight: 700, mono: true, align: 'right', color: C.proto, alpha: eo(p(u, 4.6, .4)) });
  });
  caption(['1바이트가 한 달에 6.5TB', '동접 5,000이 24시간 유지된다는 예시'], u, 8.2, C.red);
  ctx.restore();
}

// ═════════════════════════════════════════════════════════════
//  03 · totals by size
// ═════════════════════════════════════════════════════════════
function sTotals(t) {
  const [S, E] = HEAD[2]; const a = win(t, S, E, .5); if (a <= 0) return;
  const u = t - S; ctx.save(); ctx.globalAlpha = a;
  const k = eo(p(u, .1, .5)), max = totalTB(34);
  panel(X0, 370, X1 - X0, 700, { alpha: k });
  SIZES.forEach(([b, , col], i) => {
    const kk = eo(p(u, .5 + i * .6, .7)), y = 400 + i * 165, tb = totalTB(b), w = 520 * tb / max * kk;
    txt(b + 'B', X0 + 36, y + 70, { size: 54, weight: 800, mono: true, color: col, alpha: k });
    ctx.save(); ctx.globalAlpha *= k; rr(X0 + 190, y + 22, Math.max(4, w), 62, 10); ctx.fillStyle = rgba(col, .6); ctx.fill(); ctx.restore();
    txt(Math.round(tb * kk) + 'TB', X0 + 190 + w + 18, y + 72, { size: 48, weight: 800, mono: true, alpha: k * kk });
    txt(money(tb) + '/월', X0 + 190, y + 130, { size: 34, color: C.dim, mono: true, alpha: k * kk });
  });
  const kd = eo(p(u, 3.2, .5)), save = totalTB(34) - totalTB(8);
  panel(X0, 1090, X1 - X0, 370, { alpha: kd, stroke: rgba(C.bot, .5), fill: rgba(C.bot, .06) });
  txt('34B → 8B 이면', X0 + 36, 1158, { size: 40, weight: 800, color: C.bot, alpha: kd });
  txt('−' + Math.round(save) + 'TB/월', X0 + 36, 1290, { size: 100, weight: 800, mono: true, color: C.bot, alpha: eo(p(u, 3.6, .5)) });
  txt('−' + Math.round(save / totalTB(34) * 100) + '%', X1 - 36, 1290, { size: 96, weight: 800, mono: true, color: C.bot, align: 'right', alpha: eo(p(u, 3.9, .5)) });
  txt('송신 비용 −' + money(save) + '/월', X0 + 36, 1400, { size: 40, weight: 700, alpha: eo(p(u, 4.4, .5)) });
  caption(['줄인 만큼 송신과 비용이 준다', '* 수치는 예시 · 이동 외 송신은 고정'], u, 6.2, C.bot);
  ctx.restore();
}

// ═════════════════════════════════════════════════════════════
//  04 · protobuf, like for like
// ═════════════════════════════════════════════════════════════
function sProtobuf(t) {
  const [S, E] = HEAD[3]; const a = win(t, S, E, .5); if (a <= 0) return;
  const u = t - S; ctx.save(); ctx.globalAlpha = a;
  [['기본끼리', '커스텀 24B  vs  프로토 34B', '+25%'], ['튜닝끼리', '커스텀 19B  vs  프로토 26B', '+20%']].forEach(([l, cmp, d], i) => {
    const kk = eo(p(u, .3 + i * .8, .5)); if (kk <= 0) return;
    const y = 380 + i * 245 + (1 - kk) * 30;
    panel(X0, y, X1 - X0, 225, { alpha: kk, stroke: rgba(C.proto, .45) });
    txt(l, X0 + 36, y + 68, { size: 44, weight: 800, alpha: kk });
    txt('프로토 쪽 서버 송신', X0 + 36, y + 118, { size: 34, color: C.dim, alpha: kk });
    txt(d, X1 - 36, y + 112, { size: 100, weight: 800, mono: true, color: C.red, align: 'right', alpha: kk });
    txt(cmp, X0 + 36, y + 190, { size: 44, weight: 700, color: C.proto, alpha: kk });
  });
  const kb = eo(p(u, 2.4, .5));
  panel(X0, 875, X1 - X0, 585, { alpha: kb, stroke: rgba(C.bot, .5) });
  txt('이동만 bytes 필드 하나에 담으면', X0 + 36, 945, { size: 42, weight: 800, color: C.bot, alpha: kb });
  const sx = X0 + 36, sy = 990, sh = 80, fill = eio(p(u, 2.8, 1.2));
  ctx.save(); ctx.globalAlpha *= kb; rr(sx, sy, 66, sh, 8); ctx.fillStyle = rgba(C.red, .8); ctx.fill();
  for (let j = 0; j < 50 * fill; j++) { rr(sx + 76 + j * 16.2, sy, 13, sh, 3); ctx.fillStyle = rgba(C.bot, .6); ctx.fill(); } ctx.restore();
  txt('태그 · 길이 3B', sx, sy + sh + 52, { size: 34, weight: 700, color: C.red, alpha: kb });
  txt('8B × 50명 = 400B', X1 - 36, sy + sh + 52, { size: 34, weight: 700, color: C.bot, align: 'right', mono: true, alpha: eo(p(u, 3.6, .5)) });
  const kr = eo(p(u, 4.4, .5));
  txt('캐릭터당', X0 + 36, 1260, { size: 40, color: C.dim, alpha: kr });
  txt('≈ 8.06B', X0 + 36, 1380, { size: 110, weight: 800, mono: true, color: C.bot, alpha: kr });
  txt('커스텀과 같은 크기', X1 - 36, 1380, { size: 40, weight: 700, align: 'right', alpha: eo(p(u, 4.9, .5)) });
  caption(['나머지 메시지는 프로토버퍼 그대로', '바이트는 이동 같은 뜨거운 경로만 깎는다'], u, 6.6, C.bot);
  ctx.restore();
}

// ═════════════════════════════════════════════════════════════
//  OUTRO
// ═════════════════════════════════════════════════════════════
const OUTRO = { link: 'jungrok5.github.io/motion-graphics/one-byte' };
function sOutro(t) {
  const S = HEAD[3][1] - .3; const a = win(t, S, DURATION + .2, .6); if (a <= 0) return;
  const v = t - S; ctx.save(); ctx.globalAlpha = a;
  words(['1바이트도', '곱하면'], CX, 820, t, S + .3, { size: 116, colors: [C.bot, null] });
  words(['월', '6.5TB.'], CX, 990, t, S + .8, { size: 116, colors: [null, C.red] });
  txt('예시: 동접 5,000 · 보는 사람 50 · 10Hz', CX, 1090, { size: 34, color: C.faint, align: 'center', alpha: eo(p(v, 1.6, .6)) });
  const k = eo(p(v, 2, .6));
  txt('전체 영상 · 설명 · 용어집', CX, 1210, { size: 40, weight: 700, color: C.dim, align: 'center', alpha: k });
  txt(OUTRO.link, CX, 1280, { size: 34, weight: 600, mono: true, color: C.proto, align: 'center', alpha: k });
  ctx.restore();
}


// ── frame ────────────────────────────────────────────────────
function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  background(t);
  sTitle(t); sSizes(t); sChain(t); sTotals(t); sProtobuf(t); sOutro(t);
  headers(t); progress(t);
  const fo = p(t, DURATION - .6, .6); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;
window.DURATION = DURATION;


window.ready = (async () => {
  const faces = [['Pretendard', 'Pretendard-Variable.woff2', '100 900'], ['JetBrains Mono', 'JetBrainsMono.woff2', '100 800']];
  for (const [family, file, weight] of faces) {
    for (const base of ['assets/fonts/', '../assets/fonts/']) {
      try { document.fonts.add(await new FontFace(family, `url(${base}${file})`, { weight }).load()); break; } catch (e) { /* try next */ }
    }
  }
  await document.fonts.ready;
})();

// ── player (skipped when ?render) ────────────────────────────
if (!location.search.includes('render')) {
  const $ = id => document.getElementById(id);
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    replay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>',
  };
  const CHAPTERS = [[0, '', '인트로'], ...HEAD.map(h => [h[0], h[2], h[3]]), [DURATION - 5.5, '', '정리']];
  $('scrub').setAttribute('aria-valuemax', Math.round(DURATION));
  const POSTER = 3.6;
  let t = 0, playing = false, started = false, last = 0;
  const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

  CHAPTERS.forEach(([s, n, label], i) => {
    const b = document.createElement('button');
    b.innerHTML = (n ? `<span>${n}</span>` : '') + label;
    b.addEventListener('click', () => { seek(s + .01); play(); });
    $('chapters').appendChild(b);
    if (i) { const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (s / DURATION * 100) + '%'; $('ticks').appendChild(tk); }
  });

  function ui() {
    const k = t / DURATION, ended = t >= DURATION;
    $('fill').style.width = k * 100 + '%'; $('knob').style.left = k * 100 + '%';
    $('time').textContent = `${mmss(t)} / ${mmss(DURATION)}`;
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
    $('play').innerHTML = playing ? ICON.pause : ended ? ICON.replay : ICON.play;
    $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
    $('big').hidden = playing;
    $('big').innerHTML = ended ? ICON.replay : ICON.play;
    $('big').classList.toggle('replay', ended);
    let cur = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) cur = i; });
    [...$('chapters').children].forEach((b, i) => b.setAttribute('aria-current', i === cur && started));
  }
  function draw() { renderAt(started ? Math.min(t, DURATION - .001) : POSTER); }
  function play() { if (t >= DURATION) t = 0; started = true; playing = true; last = performance.now(); ui(); }
  function pause() { playing = false; ui(); }
  function toggle() { playing ? pause() : play(); }
  function seek(x) { started = true; t = clamp(x, 0, DURATION); draw(); ui(); }

  function frame(now) {
    if (playing) {
      t += (now - last) / 1000 * rate; last = now;
      if (t >= DURATION) { t = DURATION; playing = false; }
      draw(); ui();
    }
    requestAnimationFrame(frame);
  }

  const RATES = [1, .75, .5];
  let rate = 1;
  try { rate = +localStorage.getItem('mg-rate') || 1; } catch (e) { /* storage unavailable */ }
  if (!RATES.includes(rate)) rate = 1;
  function setRate(r) {
    rate = r; $('rate').textContent = r + '×'; $('rate').setAttribute('aria-label', `재생 속도 ${r}배`);
    try { localStorage.setItem('mg-rate', String(r)); } catch (e) { /* storage unavailable */ }
  }
  setRate(rate);
  $('rate').addEventListener('click', () => setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]));
  $('stage').addEventListener('click', toggle);
  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {
    const el = $('stage');
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
  });
  const scrub = $('scrub');
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
    else if (e.key === ',' || e.key === '<') setRate(RATES[Math.min(RATES.length - 1, RATES.indexOf(rate) + 1)]);
    else if (e.key === '.' || e.key === '>') setRate(RATES[Math.max(0, RATES.indexOf(rate) - 1)]);
  });

  const posterMode = location.hash === '#poster';
  if (posterMode) document.body.classList.add('poster');
  ui();
  // chapter deep link: index.html#ch03 opens paused at that chapter
  const deep = /^#ch(\d\d)$/.exec(location.hash), deepHead = deep && HEAD.find(r => r[2] === deep[1]);
  window.ready.then(() => {
    draw(); requestAnimationFrame(frame);
    if (deepHead) seek(deepHead[0] + .01);
    if (posterMode) { play(); setInterval(() => { if (!playing) { t = 0; play(); } }, 500); }
  });
  renderAt(POSTER);
}
</script>
