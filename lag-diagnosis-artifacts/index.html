<script type="module">
// ─────────────────────────────────────────────────────────────
//  렉 걸렸다. 서버 탓일까, 내 탓일까? — 실물을 공간에 늘어놓기 (9:16 mobile, ~21 s cut of ../lag-diagnosis-artifacts-wide/)
//  The screens an engineer opens to diagnose a lag report stand on one curved on-call wall, client side → network → server:
//  the player's report tickets, the game client with its frame-time / net-stats overlay, a ping terminal on the player's PC,
//  a trace waterfall of one reaction, the server's Grafana-like dashboard, the server's `ss -ti` socket view and the game-logic
//  queue, and the runbook. The camera walks them in diagnosis order; a report's timestamp flies from the ticket to the graph,
//  pings travel from the client to the socket and into the queue, and each lag type lights up its tell-tale panels.
//  Look comes from the subject: a game HUD perf overlay, a terminal, Grafana panels, a trace waterfall, a helpdesk ticket.
//  The vertical cut walks the same wall in portrait close-ups: the trace, then the tell-tale panel of each lag type, then the two pings.
//  three.js renders offscreen → drawImage onto #c → 2D header, captions, readouts and the end card on top.
//  Every frame is a pure function of t: renderAt(v) maps vertical time v to the wide page's time t. Facts follow ../lag-diagnosis/index.html.
// ─────────────────────────────────────────────────────────────

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

// ── math / easing ────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

const bump = (t, s, e) => win(t, s, e, .25);

// ── palette: the tools on an on-call wall ────────────────────
// Roles (same meaning as the 2D video): cyan = client, violet = network, amber = server, green = normal, red = spiking.

  gameBg: '#0d1411', hudBg: 'rgba(4,8,11,0.86)', hudLine: 'rgba(56,189,248,0.32)',
  graf: '#111217', gpanel: '#181b1f', gborder: '#2c3235', gtext: '#d8d9da',
  term: '#0b0d0f', termBar: '#191c20', tkBg: '#151b25', tkBar: '#1e2634', trBg: '#0f131a', trBar: '#181e28', docBg: '#13161c', docBar: '#1c2029',
};

// ── timeline (same chapters as the 2D video) ─────────────────
const HEAD = [
  [5.0, 14.0, '01', '렉의 세 구간', '한 번의 반응 = 클라 + 네트워크 + 서버'],
  [14.0, 25.0, '02', '클라렉', '내 컴퓨터가 제때 프레임을 못 그리는 경우'],
  [25.0, 36.0, '03', '네트워크렉', '패킷이 늦게 오가거나 사라지는 경우'],
  [36.0, 47.5, '04', '서버렉', '서버가 틱 안에 일을 못 끝내는 경우'],
  [47.5, 58.0, '05', '핑 두 개로 가르기', '전송 핑은 커널 · 소켓의 TCP RTT, 앱 핑은 게임 로직을 거친다'],
  [58.0, 68.0, '06', '판별 순서', '세 가지만 보면 어디가 문제인지 나온다'],
];
const OUT0 = 68.0;

const SEGS = [['입력 처리', 8, 'client'], ['업링크', 25, 'net'], ['서버 큐 + 틱', 30, 'server'], ['다운링크', 25, 'net'], ['렌더링', 16, 'client']];
const HITCH = [[3.2, 3.9], [6.6, 7.0]];
const frameAt = s => { for (const [a, b] of HITCH) if (s >= a && s < b) return 230 + 40 * Math.sin(s * 9); return 16 + 2.5 * Math.sin(s * 13) + 1.5 * Math.sin(s * 5.3); };
const frameOk = s => 16 + 2.5 * Math.sin(s * 13) + 1.5 * Math.sin(s * 5.3);
const rttAt = s => 45 + 780 * Math.exp(-(((s - 4.0) / .7) ** 2)) + 6 * Math.sin(s * 7);
const rttOk = s => 45 + 6 * Math.sin(s * 7);
const tickAt = s => s < 3.4 ? 26 + 6 * Math.sin(s * 11) + 3 * Math.sin(s * 4) : 120 + 45 * Math.sin(s * 3.1) + 15 * Math.sin(s * 8);
const tickOk = s => 26 + 6 * Math.sin(s * 11) + 3 * Math.sin(s * 4);
const hold = (u, wins) => { for (const [a, b] of wins) if (u >= a && u < b) return a; return u; };
const PH = [
  { t0: .4, name: '정상', col: K.ok, wire: .45, wait: .15, tp: 41, ap: 46, rtt: '41.2/2.6' },
  { t0: 3.6, name: '네트워크렉', col: K.net, wire: 1.1, wait: .15, tp: 420, ap: 428, rtt: '420.3/38.1' },
  { t0: 6.8, name: '서버렉', col: K.server, wire: .45, wait: 1.5, tp: 42, ap: 380, rtt: '42.1/2.9' },
];
const phaseAt = u => { let ph = PH[0]; for (const q of PH) if (u >= q.t0) ph = q; return ph; };
const qDepth = u => { const ph = phaseAt(u); return ph.name === '서버렉' ? Math.min(12, 2 + Math.floor((u - ph.t0) * 7)) : 2; };
// reports (example tickets; the timestamp is where the matching graph spikes)
const TICKETS = [
  { id: '#4817', l1: '보스 잡다가 화면이 통째로 멈췄어요.', l2: '버튼도 안 눌려요.', time: '21:04:12', meta: '채널 3 · 제보 1건', S: 14.0 },
  { id: '#4821', l1: '다른 사람이 멈췄다가 순간이동해요.', l2: '제 캐릭터는 잘 움직여요.', time: '21:17:40', meta: '채널 3 · 와이파이', S: 25.0 },
  { id: '#4826', l1: '채널 3 전체가 느려요!', l2: '스킬이 한참 뒤에 나가요.', time: '21:32:05', meta: '같은 시각 · 같은 채널 제보 여러 건', S: 36.0 },
];
function clockStr(base, s) { const tot = base[0] * 3600 + base[1] * 60 + base[2] + Math.floor(s); const hh = Math.floor(tot / 3600), mm = Math.floor(tot / 60) % 60, ss = tot % 60; return `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`; }

// ── three.js setup ───────────────────────────────────────────
const FOV = 40;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(K.desk);
const camera = new THREE.PerspectiveCamera(FOV, W / H, .1, 600);
scene.add(camera);
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .5, .45, .86);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const TAN = Math.tan(FOV / 2 * Math.PI / 180);
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c, mip = true) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.generateMipmaps = mip; if (!mip) t.minFilter = THREE.LinearFilter; return t; }

// ── the floor: dark operations-room tiles, a violet band where the internet is, light pools under lit screens ─────
const NPOOL = 12;
const floorMat = new THREE.ShaderMaterial({
  depthWrite: false, fog: false,
  uniforms: { uCam: { value: new THREE.Vector3() }, uPool: { value: Array.from({ length: NPOOL }, () => new THREE.Vector4()) }, uPC: { value: Array.from({ length: NPOOL }, () => new THREE.Color()) }, uNet: { value: 0 } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `varying vec3 vW; uniform vec3 uCam; uniform vec4 uPool[${NPOOL}]; uniform vec3 uPC[${NPOOL}]; uniform float uNet;
    void main(){
      float d = length(vW.xz - uCam.xz);
      vec3 c = vec3(.010,.013,.019);
      vec2 gq = abs(fract(vW.xz * .5) - .5);
      float lw = fwidth(vW.x * .5) * 1.2 + .004;
      float grid = 1. - smoothstep(0., lw, .5 - max(gq.x, gq.y));
      c += vec3(.020,.028,.042) * grid * .55 * exp(-d * .02);
      for (int i = 0; i < ${NPOOL}; i++) {
        vec4 P = uPool[i];
        if (P.w <= 0.) continue;
        vec2 q = (vW.xz - P.xy) / vec2(P.z, P.z * .5);
        c += uPC[i] * exp(-dot(q,q)) * P.w * .085;
      }
      float band = smoothstep(-8.5, -6.5, vW.x) * smoothstep(2.5, .5, vW.x) * smoothstep(11., 4., vW.z) * smoothstep(-7., -2., vW.z);
      c += vec3(.050,.032,.095) * band * uNet;
      float fade = exp(-d * .011);
      c = mix(vec3(.007,.009,.013), c, clamp(fade * 1.4, 0., 1.));
      gl_FragColor = vec4(c, 1.);
    }`,
});
floorMat.extensions = { derivatives: true };
const floor = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), floorMat);
floor.rotation.x = -Math.PI / 2; floor.position.set(10, 0, 0); floor.renderOrder = 0;
scene.add(floor);

const shadowTex = (() => { const c = mkCanvas(256, 128), g = c.getContext('2d'); const gr = g.createRadialGradient(128, 64, 0, 128, 64, 128); gr.addColorStop(0, 'rgba(0,0,0,0.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.setTransform(1, 0, 0, .5, 0, 32); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c); })();
const reflAlpha = (() => { const c = mkCanvas(4, 256), g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#000'); gr.addColorStop(.55, '#000'); gr.addColorStop(1, '#5a5a5a'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); return new THREE.CanvasTexture(c); })();
const glowTex = (() => { const c = mkCanvas(128, 128), g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.2, 'rgba(255,255,255,.8)'); gr.addColorStop(.5, 'rgba(255,255,255,.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();

// ── canvas drawing kit (design px; 100 design px = 1 world unit) ─────
const TS = 1.5;
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function gt(g, s, x, y, o = {}) {
  const { size = 28, weight = 500, color = K.text, align = 'left', mono = false, alpha = 1, base = 'alphabetic', ls = 0 } = o;
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = `${weight} ${size}px ${mono ? MONO : SANS}`;
  g.fillStyle = color; g.textAlign = align; g.textBaseline = base; if (ls) g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.restore();
}
function mw(g, s, size, weight = 500, mono = false) { g.font = `${weight} ${size}px ${mono ? MONO : SANS}`; return g.measureText(s).width; }
function gdot(g, x, y, r, col, a = 1) { g.save(); g.globalAlpha *= a; g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = col; g.fill(); g.restore(); }

  const { size = 24, align = 'left', fillA = .16, alpha = 1, mono = true, weight = 700, r = 8 } = o;
  if (alpha <= 0) return 0;

// NT · a terminal on the player's PC: ping to the game server
const NTW = 1000, NTH = 560;
const PING = (() => {   // seq 1..25; 12..25 are the last 14 samples (0.4 s apart over ch03 local time 0..5.2); 3 lost in the spike
  const rows = [];
  for (let seq = 1; seq <= 25; seq++) {
    const s = (seq - 12) * .4, lost = [21, 23, 24].includes(seq);
    const v = seq < 12 ? 45 + 5 * Math.sin(seq * 2.3) : rttAt(s);
    rows.push({ seq, s, lost, v });
  }
  const rec = rows.filter(r => !r.lost).map(r => r.v);
  return { rows, min: Math.min(...rec), max: Math.max(...rec), avg: rec.reduce((a, b) => a + b, 0) / rec.length };
})();
const NT_STOP = 5.4;
function drawNT(g, t) {
  const w = NTW, h = NTH, u = t - 25;
  chrome(g, w, h, { bg: K.term, bar: K.termBar, title: ['내 PC', K.client], sub: '터미널 · ping', right: 'zsh' });
  const lines = [['$ ping game-kr-03', 'cmd']];
  for (const r of PING.rows) {
    if (r.s > Math.min(u, NT_STOP - .1) && r.seq >= 12) break;
    lines.push(r.lost ? [`Request timeout for icmp_seq ${r.seq}`, 'lost'] : [`icmp_seq=${r.seq}  time=${r.v.toFixed(1)} ms`, r.v > 200 ? 'hot' : 'ok']);
  }
  if (u >= NT_STOP) {
    lines.push(['^C', 'cmd'], ['--- game-kr-03 ping statistics ---', 'dim'], ['25 packets transmitted, 22 received, 12% packet loss', 'sum'],
      [`rtt min/avg/max = ${PING.min.toFixed(1)}/${PING.avg.toFixed(1)}/${PING.max.toFixed(1)} ms`, 'sum2']);
  }
  const vis = lines.slice(-10), y0 = TB + 50, lh = 46;
  vis.forEach(([s, kind], i) => {
    const yy = y0 + i * lh;
    const col = kind === 'cmd' ? K.hi : kind === 'lost' ? K.red : kind === 'hot' ? '#ff8f9b' : kind === 'dim' ? K.dim : kind === 'sum' ? K.tk : kind === 'sum2' ? K.hi : '#a9b3bf';
    gt(g, s, 28, yy, { size: 30, mono: true, color: col, weight: kind === 'sum' || kind === 'lost' ? 700 : 500 });
  });
  if (u < NT_STOP || Math.floor(t * 2) % 2 === 0) { const last = vis.length; if (u >= NT_STOP) { g.fillStyle = K.hi; g.fillRect(28, y0 + last * lh - 26, 16, 32); } }
}

    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
