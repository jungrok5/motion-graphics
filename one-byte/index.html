<meta charset="utf-8">
<title>One Byte at Scale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one 16:9 stage, a slim transport bar under it, chapter chips below. Single dark look. */
  :root {
    --bg: #070a13; --surface: #0e1424; --line: #24304a; --fg: #e8ecf4; --dim: #8b95a7;
    --accent: #a78bfa; --live: #34d399;
    --sans: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; overflow-x: hidden; }
  .player { width: min(100%, calc((100vh - 170px) * 16 / 9)); min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .big { position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%; border: 1.5px solid var(--accent);
    background: rgba(14,20,36,.78); color: var(--fg); display: grid; place-items: center; cursor: pointer; transition: transform .15s, opacity .2s; }
  .big[hidden] { display: none; }
  .big:hover { transform: scale(1.06); }
  .big svg { width: 30px; height: 30px; margin-left: 5px; }
  .big.replay svg { margin-left: 0; }
  .bar { display: flex; align-items: center; gap: 14px; }
  .btn { flex: none; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--fg); display: grid; place-items: center; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn svg { width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .time { flex: none; font: 500 13px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .scrub { position: relative; flex: 1; min-width: 0; height: 28px; cursor: pointer; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--line); }
  .fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--live)); }
  .tick { position: absolute; top: 8px; width: 2px; height: 12px; background: var(--dim); opacity: .6; }
  .knob { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 4px rgba(167,139,250,.25); }
  .chapters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chapters button { font: 600 13px/1 var(--sans); color: var(--dim); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; cursor: pointer; }
  .chapters button span { font-family: var(--mono); color: var(--accent); margin-right: 6px; }
  .chapters button:hover { color: var(--fg); }
  .chapters button[aria-current="true"] { color: var(--fg); border-color: var(--accent); background: rgba(167,139,250,.12); }
  .hint { font-size: 12px; color: var(--dim); margin-left: auto; }
  @media (max-width: 600px) { .hint { display: none; } .time { font-size: 12px; } }
  /* #poster: embed mode for gallery thumbnails — canvas only, loops */
  body.poster { padding: 0; }
  body.poster .player { width: 100%; }
  body.poster .bar, body.poster .chapters, body.poster .big { display: none; }
  body.poster .stage { border: 0; border-radius: 0; }
</style>

<div class="player">
  <div class="stage" id="stage">
    <canvas id="c" width="1920" height="1080" aria-label="이동 패킷 1바이트를 줄이면 생기는 일 모션그래픽"></canvas>
    <button class="big" id="big" aria-label="재생"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg></button>
  </div>
  <div class="bar">
    <button class="btn" id="play" aria-label="재생"></button>
    <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="86" aria-valuenow="0">
      <div class="track"></div><div class="fill" id="fill"></div><div id="ticks"></div><div class="knob" id="knob"></div>
    </div>
    <div class="time" id="time">0:00 / 1:25</div>
    <button class="btn" id="fs" aria-label="전체 화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="chapters" id="chapters"></div>
</div>
<script>
// ─────────────────────────────────────────────────────────────
//  이동 패킷 1바이트 — 곱하기가 붙으면 얼마가 되고, 정직하게 무엇이 달라지나
//  Every frame is a pure function of time: renderAt(t).
// ─────────────────────────────────────────────────────────────
const W = 1920, H = 1080, DURATION = 85.5;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg: '#070a13', text: '#e8ecf4', dim: '#8b95a7', faint: '#4b5568',
  proto: '#a78bfa', client: '#38bdf8', server: '#fbbf24', bot: '#34d399',
  pub: '#f472b6', red: '#f87171', panel: '#0e1424', line: '#24304a',
};
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';

// ── math / easing ────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
// fade in at s, fade out at e
const win = (t, s, e, f = .45) => Math.min(eo(p(t, s, f)), 1 - eio(p(t, e - f, f)));

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);
const PARTS = Array.from({ length: 70 }, () => ({ x: R() * W, y: R() * H, vx: (R() - .5) * 14, vy: -4 - R() * 10, s: 1 + R() * 2, a: .05 + R() * .18 }));

// ── drawing helpers ──────────────────────────────────────────
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(sz, wt = 500, mono = false) { ctx.font = `${wt} ${sz}px ${mono ? MONO : SANS}`; }
function txt(s, x, y, o = {}) {
  const { size = 32, weight = 500, color = C.text, align = 'left', base = 'alphabetic', alpha = 1, mono = false, ls = 0 } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; font(size, weight, mono);
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = ls + 'px';
  ctx.fillText(s, x, y); ctx.restore();
}
function tw(s, size, weight = 500, mono = false) { font(size, weight, mono); return ctx.measureText(s).width; }
function panel(x, y, w, h, o = {}) {
  const { r = 18, fill = C.panel, stroke = C.line, glow = null, glowA = 1, alpha = 1, lw = 1.5, dash = null } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  if (glow) { ctx.shadowColor = rgba(glow, .55 * glowA); ctx.shadowBlur = 50; }
  rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.shadowBlur = 0;
  if (dash) ctx.setLineDash(dash);
  ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); ctx.restore();
}
function chip(label, x, y, color, o = {}) {
  const { alpha = 1, size = 18, align = 'left', fillA = .14 } = o;
  font(size, 700, true);
  const w = ctx.measureText(label).width + size * 1.2, h = size * 1.6;
  const X = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  ctx.save(); ctx.globalAlpha *= alpha;
  rr(X, y - h / 2, w, h, h / 2); ctx.fillStyle = rgba(color, fillA); ctx.fill();
  ctx.strokeStyle = rgba(color, .7); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, X + w / 2, y + 1); ctx.restore();
  return w;
}
function dot(x, y, r, color, a = 1, glow = 18) {
  ctx.save(); ctx.globalAlpha *= a; ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function check(x, y, s, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = s * .16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .36, y); ctx.lineTo(x - s * .1, y + s * .26); ctx.lineTo(x + s * .38, y - s * .28); ctx.stroke(); ctx.restore();
}
function cross(x, y, s, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = s * .16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .3, y - s * .3); ctx.lineTo(x + s * .3, y + s * .3);
  ctx.moveTo(x + s * .3, y - s * .3); ctx.lineTo(x - s * .3, y + s * .3); ctx.stroke(); ctx.restore();
}
function botIcon(x, y, s, color, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, s * .07);
  rr(x - s / 2, y - s * .36, s, s * .72, s * .2); ctx.fillStyle = rgba(color, .15); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - s * .36); ctx.lineTo(x, y - s * .54); ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y - s * .6, s * .07, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x - s * .19, y - s * .04, s * .08, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + s * .19, y - s * .04, s * .08, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - s * .16, y + s * .18); ctx.lineTo(x + s * .16, y + s * .18); ctx.stroke();
  ctx.restore();
}
function bezPt(P, t) {
  const [a, b, c, d] = P, u = 1 - t;
  return [u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0],
          u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1]];
}
function bezLine(P, k, color, lw = 2, a = 1) {
  if (k <= 0 || a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
  for (let i = 0; i <= 48; i++) { const q = bezPt(P, k * i / 48); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
  ctx.stroke(); ctx.restore();
}

// ── tiny syntax highlighter ──────────────────────────────────
const KW = new Set(['syntax', 'package', 'message', 'public', 'sealed', 'partial', 'class', 'final', 'var', 'new', 'const', 'get', 'set']);
const TY = new Set(['string', 'int32', 'int64', 'int', 'int32_t', 'IMessage']);
function tokens(line) {
  const out = [], re = /(\/\/.*$|"[^"]*"|\s+|\d+|[A-Za-z_]\w*|.)/g; let m;
  while ((m = re.exec(line))) {
    const s = m[0]; let c = C.text;
    if (s.startsWith('//')) c = C.faint;
    else if (s[0] === '"') c = '#86efac';
    else if (/^\d+$/.test(s)) c = C.server;
    else if (KW.has(s)) c = C.proto;
    else if (TY.has(s)) c = C.client;
    else if (/^[^\w\s]$/.test(s)) c = C.dim;
    out.push([s, c]);
  }
  return out;
}
// lines: array of strings. chars: how many characters are revealed (newline = 1).
// insert: {idx, s, k, chars} — a line sliding in at idx (k: 0..1).
function code(lines, x, y, o = {}) {
  const { size = 24, lh = 36, chars = Infinity, alpha = 1, insert = null, hlW = 600 } = o;
  ctx.save(); ctx.globalAlpha *= alpha; font(size, 500, true); ctx.textBaseline = 'alphabetic';
  const cw = ctx.measureText('M').width; let left = chars, cursor = null;
  const drawLine = (s, yy, limit) => {
    let col = 0;
    for (const [tok, c] of tokens(s)) {
      if (limit <= 0) break;
      const vis = tok.slice(0, limit); ctx.fillStyle = c;
      ctx.fillText(vis, x + col * cw, yy); col += vis.length; limit -= vis.length;
    }
    return col;
  };
  let shift = 0;
  const drawInsert = i => {
    if (!insert || i !== insert.idx || insert.k <= 0) return;
    {
      const yy = y + i * lh; const k = insert.k;
      ctx.save(); ctx.globalAlpha *= k;
      ctx.fillStyle = rgba(C.bot, .16 * (insert.flash ?? 1)); ctx.fillRect(x - 18, yy - lh * .74, hlW, lh);
      ctx.fillStyle = C.bot; ctx.fillRect(x - 18, yy - lh * .74, 4, lh);
      drawLine(insert.s, yy, insert.chars ?? Infinity); ctx.restore();
      shift = insert.k;
    }
  };
  lines.forEach((ln, i) => {
    drawInsert(i);
    if (left <= 0) return;
    const yy = y + (i + shift) * lh;
    const col = drawLine(ln, yy, left);
    cursor = [x + col * cw, yy]; left -= ln.length + 1;
  });
  drawInsert(lines.length);
  ctx.restore();
  return { cw, cursor };
}

// ── background, headers, progress ────────────────────────────
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const glow = (cx, cy, r, col) => { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  glow(W * .18 + Math.sin(t * .2) * 80, H * .1, 900, 'rgba(167,139,250,0.10)');
  glow(W * .86, H * .92 + Math.cos(t * .17) * 60, 900, 'rgba(56,189,248,0.08)');
  ctx.strokeStyle = 'rgba(148,163,184,0.055)'; ctx.lineWidth = 1;
  const off = (t * 10) % 60; ctx.beginPath();
  for (let x = -60 + off; x < W; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -60 + off; y < H; y += 60) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  for (const q of PARTS) {
    const x = ((q.x + t * q.vx) % W + W) % W, y = ((q.y + t * q.vy) % H + H) % H;
    ctx.fillStyle = `rgba(200,210,255,${q.a})`; ctx.fillRect(x, y, q.s, q.s);
  }
}

// [start, end, number, title, subtitle] — one row per chapter. Chapters own the top-left header zone (y < 190).
const HEAD = [
  [5.0, 14.0, '01', '이동 정보 하나', '한 캐릭터의 위치를 주변에 알리는 24바이트'],
  [14.0, 28.0, '02', '곱하기가 붙는다', '보는 사람 × 갱신 빈도 × 동접 × 시간'],
  [28.0, 41.0, '03', '왜 브로드캐스트가 대부분인가', '서버는 1을 받고 50을 내보낸다'],
  [41.0, 55.0, '04', '성능과 용량은 얼마나?', '억지 없이: 병목이 어디냐에 따라 다르다'],
  [55.0, 67.0, '05', '문턱을 넘을 때', '1바이트가 패킷 수를 절반으로 만드는 순간'],
  [67.0, 80.0, '06', '1바이트를 넘어서', '같은 원리로 절반을 줄이면'],
];
function headers(t) {
  for (const [s, e, n, title, sub] of HEAD) {
    const a = win(t, s, e, .4); if (a <= 0) continue;
    const k = eo(p(t, s + .05, .7)), k2 = eo(p(t, s + .3, .7));
    ctx.save(); ctx.globalAlpha = a;
    chip(n, 120 - (1 - k) * 30, 106, C.proto, { size: 22, alpha: k });
    txt(title, 196 - (1 - k) * 30, 122, { size: 50, weight: 800, alpha: k });
    txt(sub, 122, 174, { size: 27, weight: 500, color: C.dim, alpha: k2 });
    ctx.restore();
  }
}
function progress(t) {
  const x0 = 120, x1 = 1800, y = 1040;
  const a = clamp(Math.min(t - HEAD[0][0] + .4, DURATION - .6 - t) * 2) * .9; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(148,163,184,0.15)'; ctx.fillRect(x0, y, x1 - x0, 3);
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, C.proto); g.addColorStop(.5, C.bot); g.addColorStop(1, C.pub);
  ctx.fillStyle = g; ctx.fillRect(x0, y, (x1 - x0) * clamp(t / DURATION), 3);
  for (const h of HEAD) {
    const x = x0 + (x1 - x0) * h[0] / DURATION;
    ctx.fillStyle = t >= h[0] ? C.text : C.faint; ctx.fillRect(x, y - 4, 2, 11);
    txt(h[2] + ' ' + h[3], x + 8, y - 10, { size: 16, weight: 600, color: t >= h[0] ? C.dim : C.faint });
  }
  ctx.restore();
}

// ── word-by-word title ───────────────────────────────────────
function words(ws, cx, y, t, t0, o = {}) {
  const { size = 96, weight = 800, stagger = .12, colors = [] } = o;
  font(size, weight); const sp = size * .28;
  const widths = ws.map(w => ctx.measureText(w).width);
  let x = cx - (widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1)) / 2;
  ws.forEach((w, i) => {
    const k = eo(p(t, t0 + i * stagger, .8));
    ctx.save(); ctx.globalAlpha *= k; font(size, weight); ctx.fillStyle = colors[i] || C.text;
    if (colors[i]) { ctx.shadowColor = rgba(colors[i], .5); ctx.shadowBlur = 40; }
    ctx.fillText(w, x, y + (1 - k) * 46); ctx.restore();
    x += widths[i] + sp;
  });
}


// ═════════════════════════════════════════════════════════════
//  INTRO (0 – 5.2) — config driven
// ═════════════════════════════════════════════════════════════
const TITLE = {
  eyebrow: 'BYTES × VIEWERS × HZ × CCU × SECONDS',
  line1: ['이동', '패킷', '1바이트를'], line1Colors: [C.client, null, C.bot],
  line2: ['줄이면', '무슨', '일이?'], line2Colors: [],
  sub: '수천 명이 플레이하는 MMO에서 1바이트가 몇 번 곱해지는지, 그리고 정직하게 무엇이 달라지는지',
  story: [['1바이트', C.bot], ['× 보는 사람', C.pub], ['× 10Hz', C.client], ['× 동접', C.proto], ['= 월 6.5TB', C.red]],
};
function sTitle(t) {
  const a = win(t, 0, 5.2, .6); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  txt(TITLE.eyebrow, W / 2, 330, { size: 22, weight: 600, color: C.dim, align: 'center', mono: true, ls: 5, alpha: eo(p(t, .2, .8)) });
  words(TITLE.line1, W / 2, 470, t, .45, { size: 104, colors: TITLE.line1Colors });
  words(TITLE.line2, W / 2, 600, t, .85, { size: 104, colors: TITLE.line2Colors });
  txt(TITLE.sub, W / 2, 690, { size: 30, color: C.dim, align: 'center', alpha: eo(p(t, 1.7, .8)) });
  const n = TITLE.story.length, x0 = 520, x1 = 1400, y = 820, k = eio(p(t, 2.1, 1.6));
  ctx.strokeStyle = 'rgba(148,163,184,0.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(lerp(x0, x1, k), y); ctx.stroke();
  TITLE.story.forEach(([lab, col], i) => {
    const x = lerp(x0, x1, i / (n - 1)), kk = eback(p(t, 2.1 + i * .3, .6)); if (kk <= 0) return;
    dot(x, y, 9 * kk, col, 1, 24);
    txt(lab, x, y + 44, { size: 20, weight: 600, color: col, align: 'center', mono: true, alpha: clamp(kk) });
  });
  const tp = p(t, 2.4, 2.2); if (tp > 0 && tp < 1) dot(lerp(x0, x1, eio(tp)), y, 5, '#fff', 1, 30);
  ctx.restore();
}

// ═════════════════════════════════════════════════════════════
//  shared helpers · model
// ═════════════════════════════════════════════════════════════
// Roles: client = 이동 패킷, server = 서버 · CPU, proto = 네트워크 · 대역폭, pub = 보는 사람, bot = 절감, red = 경계 · 초과
// Example model: 5,000 CCU · 50 viewers · 10Hz · 24-byte movement entry
const CCU = 5000, VIEW = 50, HZ = 10, ENTRY = 24;
const fmt = n => Math.round(n).toLocaleString('en-US');
function bytesFmt(b) { const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; } return (b >= 100 || i === 0 ? Math.round(b) : b.toFixed(1)) + ' ' + u[i]; }
function noteRow(items, u, t0, y0, col, cols = 2, x0 = 120, span = 1700) {
  items.forEach(([ti, de], i) => {
    const k = eo(p(u, t0 + i * .45, .5)); if (k <= 0) return;
    const x = x0 + (i % cols) * (span / cols), y = y0 + Math.floor(i / cols) * 88;
    dot(x + 10, y - 9, 7, col, k, 12);
    txt(ti, x + 32, y, { size: 24, weight: 800, alpha: k });
    if (de) txt(de, x + 32, y + 32, { size: 19, color: C.dim, alpha: k });
  });
}
const FIELDS = [['ID', 4, C.pub], ['x', 4, C.client], ['y', 4, C.client], ['z', 4, C.client], ['방향', 2, C.server], ['상태', 2, C.proto], ['시각', 4, C.faint]];
function byteRow(x, y, bw, h, fields, k, hiIdx = -1, hiK = 0) {
  let cx = x;
  fields.forEach(([lab, n, col], fi) => {
    for (let b = 0; b < n; b++) {
      const cut = fi === hiIdx && b === n - 1, a = cut ? 1 - hiK : 1;
      ctx.save(); ctx.globalAlpha *= k * a; rr(cx + 2, y + (cut ? -hiK * 60 : 0), bw - 4, h, 6); ctx.fillStyle = rgba(cut && hiK > 0 ? C.red : col, .55); ctx.fill(); ctx.restore();
      cx += bw * (cut ? 1 - hiK : 1);
    }
    const w0 = cx - bw * (fi === hiIdx ? n - hiK : n);
    const small = (cx - w0) < 44;
    txt(lab, (w0 + cx) / 2, y + h + 30, { size: small ? 13 : 17, weight: 700, color: col === C.faint ? C.dim : col, align: 'center', alpha: k });
    txt((fi === hiIdx ? n - Math.round(hiK) : n) + 'B', (w0 + cx) / 2, y + h + 54, { size: 15, color: C.dim, align: 'center', mono: true, alpha: k });
  });
  return cx;
}

  ['× 50', '한 명의 이동을 보는 사람 수', 50, ''],
  ['× 10', '초당 이동 갱신 (10Hz)', 500, '/s'],
  ['× 5,000', '동시접속', 2.5e6, '/s'],
  ['× 86,400', '하루 (초)', 2.16e11, '/일'],
  ['× 30', '한 달', 6.48e12, '/월'],

function sChain(t) {
  const [S, E] = HEAD[1]; const a = win(t, S, E, .5); if (a <= 0) return;
  const u = t - S; ctx.save(); ctx.globalAlpha = a;
  CHAIN.forEach(([op, desc, val, unit], i) => {

    if (i === 3) txt('= 20 Mbps', 1740 - tw(bytesFmt(val) + unit, 36, 800, true) - 30, y + 12, { size: 22, weight: 700, color: C.proto, mono: true, align: 'right', alpha: eo(p(u, 4.9, .4)) });

  ctx.restore();
}

// ═════════════════════════════════════════════════════════════
//  05 · the packet-size threshold
// ═════════════════════════════════════════════════════════════
function sMTU(t) {
  const [S, E] = HEAD[4]; const a = win(t, S, E, .5); if (a <= 0) return;
  const u = t - S; ctx.save(); ctx.globalAlpha = a;
  const k = eo(p(u, .2, .6)), entry = u < 4.5 ? 24 : 23, n = 61, total = n * entry, MSS = 1460;
  const x0 = 160, sc = 1.05, y = 330;
  txt('혼잡 지역: 한 틱에 61명의 이동을 한 클라에게 보낸다', 160, 262, { size: 24, weight: 700, alpha: k });
  ctx.save(); ctx.globalAlpha *= k; ctx.setLineDash([8, 6]); ctx.strokeStyle = C.red; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0 + MSS * sc, y - 40); ctx.lineTo(x0 + MSS * sc, y + 110); ctx.stroke(); ctx.restore();
  txt('패킷 하나에 담을 수 있는 최대 1,460B (MSS 예시)', x0 + MSS * sc - 8, y - 50, { size: 16, weight: 700, color: C.red, align: 'right', alpha: k });
  const fill = eio(p(u, entry === 24 ? .6 : 4.6, 1.6));
  for (let i = 0; i < Math.floor(n * fill); i++) {
    const s = i * entry, fitW = Math.min(entry, MSS - s), spill = entry - fitW;
    ctx.save(); ctx.globalAlpha *= k; rr(x0 + s * sc + 1, y, fitW * sc - 2, 70, 3); ctx.fillStyle = rgba(C.client, .6); ctx.fill();
    if (spill > 0) { rr(x0 + 1, y + 150, spill * sc * 4, 70, 3); ctx.fillStyle = rgba(C.red, .7); ctx.fill(); } ctx.restore();
    if (spill > 0) { txt('패킷 2: ' + spill + 'B + 헤더 40B', x0 + spill * sc * 4 + 16, y + 194, { size: 18, weight: 800, color: C.red, alpha: k }); txt('(4배 확대)', x0, y + 244, { size: 14, color: C.dim, alpha: k }); }
  }
  const twoPk = total > MSS;
  if (fill >= 1) {
    if (twoPk) { txt('넘친 4B 때문에 패킷이 하나 더 → 헤더 40B 추가', x0, y + 300, { size: 22, weight: 800, color: C.red, alpha: k }); }

    const kk = eo(p(u, 2.4 + t0, .5)); if (kk <= 0) return;
    const x = 160 + i * 820;
    panel(x, 680, 780, 150, { alpha: kk, stroke: rgba(col, .6) });
    txt(t1, x + 30, 728, { size: 24, weight: 800, color: col, alpha: kk });
    txt(t2, x + 30, 772, { size: 20, mono: true, alpha: kk });
    txt(t3, x + 750, 772, { size: 24, weight: 800, align: 'right', color: col, alpha: kk });
  });
  txt('경계 근처에 있을 때만 일어나는 일 — 하지만 혼잡 지역에서는 바로 그 근처에 있다', W / 2, 920, { size: 24, weight: 700, color: C.dim, align: 'center', alpha: eo(p(u, 8.6, .6)) });
  ctx.restore();
}

  });
  words(OUTRO.tagline, W / 2, 820, t, S + 1.8, { size: 64, stagger: .1, colors: OUTRO.taglineColors });
  txt(OUTRO.footer, W / 2, 890, { size: 22, color: C.faint, align: 'center', mono: true, alpha: eo(p(v, 2.6, .8)) });
  ctx.restore();
}

// ── frame ────────────────────────────────────────────────────
function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  background(t);
  sTitle(t); sPacket(t); sChain(t); sShare(t); sCapacity(t); sMTU(t); sBeyond(t); sOutro(t);
  headers(t); progress(t);
  // final fade to black
  const fo = p(t, DURATION - .6, .6); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;
window.DURATION = DURATION;

window.ready = (async () => {
  const faces = [['Pretendard', 'Pretendard-Variable.woff2', '100 900'], ['JetBrains Mono', 'JetBrainsMono.woff2', '100 800']];
  for (const [family, file, weight] of faces) {
    for (const base of ['assets/fonts/', '../assets/fonts/']) {
      try { document.fonts.add(await new FontFace(family, `url(${base}${file})`, { weight }).load()); break; } catch (e) { /* try next */ }
    }
  }
  await document.fonts.ready;
})();

// ── player (skipped when ?render) ────────────────────────────
if (!location.search.includes('render')) {
  const $ = id => document.getElementById(id);
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    replay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>',
  };
  const CHAPTERS = [[0, '', '인트로'], ...HEAD.map(h => [h[0], h[2], h[3]]), [DURATION - 5.5, '', '정리']];
  const POSTER = 3.6;
  let t = 0, playing = false, started = false, last = 0;
  const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

  CHAPTERS.forEach(([s, n, label], i) => {
    const b = document.createElement('button');
    b.innerHTML = (n ? `<span>${n}</span>` : '') + label;
    b.addEventListener('click', () => { seek(s + .01); play(); });
    $('chapters').appendChild(b);
    if (i) { const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (s / DURATION * 100) + '%'; $('ticks').appendChild(tk); }
  });

  function ui() {
    const k = t / DURATION, ended = t >= DURATION;
    $('fill').style.width = k * 100 + '%'; $('knob').style.left = k * 100 + '%';
    $('time').textContent = `${mmss(t)} / ${mmss(DURATION)}`;
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
    $('play').innerHTML = playing ? ICON.pause : ended ? ICON.replay : ICON.play;
    $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
    $('big').hidden = playing;
    $('big').innerHTML = ended ? ICON.replay : ICON.play;
    $('big').classList.toggle('replay', ended);
    let cur = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) cur = i; });
    [...$('chapters').children].forEach((b, i) => b.setAttribute('aria-current', i === cur && started));
  }
  function draw() { renderAt(started ? Math.min(t, DURATION - .001) : POSTER); }
  function play() { if (t >= DURATION) t = 0; started = true; playing = true; last = performance.now(); ui(); }
  function pause() { playing = false; ui(); }
  function toggle() { playing ? pause() : play(); }
  function seek(x) { started = true; t = clamp(x, 0, DURATION); draw(); ui(); }

  function frame(now) {
    if (playing) {
      t += (now - last) / 1000; last = now;
      if (t >= DURATION) { t = DURATION; playing = false; }
      draw(); ui();
    }
    requestAnimationFrame(frame);
  }

  $('stage').addEventListener('click', toggle);
  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {
    const el = $('stage');
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
  });
  const scrub = $('scrub');
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
  });

  const posterMode = location.hash === '#poster';
  if (posterMode) document.body.classList.add('poster');
  ui();
  window.ready.then(() => {
    draw(); requestAnimationFrame(frame);
    if (posterMode) { play(); setInterval(() => { if (!playing) { t = 0; play(); } }, 500); }
  });
  renderAt(POSTER);
}
</script>
