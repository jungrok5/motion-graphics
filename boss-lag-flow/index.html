<script type="module">
// ─────────────────────────────────────────────────────────────
//  Boss Lag Flow Vertical — 보스가 뜨면 왜 렉이 걸릴까? (~21s, 1080×1920, mobile)
//  The ~20 s cut of ../boss-lag-flow-wide/ (흐름과 관계를 빛으로): the same night zone map, unit pips,
//  packets of light along every link, the boss's aggro radius and the view-radius ring, recomposed for 9:16.
//  Every frame is a pure function of time: renderAt(t).
//  Facts follow ../boss-lag/index.html:
//    updates per tick = N × (N − 1) (movement only, everyone visible, everyone moving)
//    20 → 380, 200 → 39,800 (10× people → ~100× updates)
//    view radius 2× → visible players ~4× (even density)
//    cuts: far targets less often · nearest K only · channels / instances
//  The web draws every directed update i → j as one arc with a travelling packet: 200 players = 39,800 arcs.
// ─────────────────────────────────────────────────────────────
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1080, H = 1920, DURATION = 21;
const FOV = 46;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';

// ── math ─────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const win = (t, s, e, f = .45) => Math.min(eo(p(t, s, f)), 1 - eio(p(t, e - f, f)));
const fract = x => x - Math.floor(x);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const gauss = R => { let s = 0; for (let i = 0; i < 4; i++) s += R(); return (s - 2) / .577; };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const fmt = n => Math.round(n).toLocaleString('en-US');

// ── timeline ─────────────────────────────────────────────────
// [start, end, number, title] — chapters (phase bar + chapter chips)
const HEAD = [
  [0, 2.4, '01', '보스 등장'],
  [2.4, 5.4, '02', '인원 집중'],
  [5.4, 10.6, '03', 'N × (N − 1)'],
  [10.6, 14.2, '04', '시야 반경'],
  [14.2, DURATION, '05', '줄이는 법'],
];
const END_AT = 18.5;                      // summary card over the dimmed map
const OUTRO_AT = END_AT;
const T_BOSS = .6;                        // world boss spawns
const T_CONV = 2.0;                       // crowd converges
const T_SUB = 5.6, T_GROW = 7.7, NSUB = 20;   // links among 20, then grow to 200
const T_R1 = 10.9, T_R2 = 12.3;           // view ring r, then 2r
const T_FAR = 14.3, T_K = 15.5, T_CH = 16.6;   // cuts
const B4 = [99, 99, 99, 99, 99];          // (combat beats live in the wide cut only)
const I_AOE = [99, 99];
const T_SH = 99;

// ── palette (night zone map · game HUD · ops panel) ──────────
const HEX = { pkt: '#5fe3ff', mint: '#7dffd2', boss: '#ff5a48', amber: '#ffa040', gold: '#ffd36b', buff: '#86ff9a', ink: '#eef6f4' };
const COL = Object.fromEntries(Object.entries(HEX).map(([k, v]) => [k, new THREE.Color(v)]));
// unit-frame class colours for the player pips
const CLASS = ['#f2c46d', '#6fb8ff', '#8be07a', '#f58fd0', '#c79bff', '#dfe8ea'].map(c => new THREE.Color(c));

// ── three setup ──────────────────────────────────────────────
const gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
gl.setPixelRatio(1); gl.setSize(W, H, false);
gl.setClearColor(0x040809, 1);
gl.toneMapping = THREE.ACESFilmicToneMapping; gl.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, W / H, .05, 400);
const composer = new EffectComposer(gl);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), .6, .35, .72);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const U = { uPx: { value: H / (2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2))) }, uFocus: { value: 10 }, uAperture: { value: .05 }, uTime: { value: 0 } };
const blendAdd = { transparent: true, depthWrite: false, depthTest: false, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendEquation: THREE.AddEquation };

// soft additive glows (halos, trails, effects): round gaussian sprites
const GVS = `
attribute float size; attribute float alpha; attribute vec3 color;
uniform float uPx, uGain;
varying vec3 vC;
void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  float d = max(-mv.z, 0.05);
  float s = max(size * uPx / d, 1.5);
  gl_PointSize = s;
  vC = color * alpha * uGain;
  gl_Position = projectionMatrix * mv;
  if (alpha <= 0.0) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
}`;
const GFS = `varying vec3 vC; void main() { vec2 c = gl_PointCoord * 2.0 - 1.0; float d = dot(c, c); if (d > 1.0) discard; gl_FragColor = vec4(vC * (exp(-d * 5.0) + .15 * exp(-d * 1.5)), 1.0); }`;
// unit pips: class-coloured disc with a dark rim and a highlight, drawn with normal blending over the map
const MVS = `
attribute float size; attribute float alpha; attribute vec3 color;
uniform float uPx;
varying vec3 vC; varying float vA;
void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  float d = max(-mv.z, 0.05);
  gl_PointSize = clamp(size * uPx / d, 7.0, 46.0);
  vC = color; vA = alpha;
  gl_Position = projectionMatrix * mv;
  if (alpha <= 0.0) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
}`;
const MFS = `
varying vec3 vC; varying float vA;
void main() {
  vec2 c = gl_PointCoord * 2.0 - 1.0; float d = length(c);
  float aa = fwidth(d) * 1.2;
  float edge = 1.0 - smoothstep(1.0 - aa, 1.0, d);
  float body = 1.0 - smoothstep(.66 - aa, .66, d);
  vec3 col = mix(vec3(.015, .03, .035), vC * (1.0 + .45 * clamp(vA - 1.0, 0.0, 1.5)), body);
  col += vec3(.55) * body * (1.0 - smoothstep(.0, .42, length(c - vec2(-.18, -.22))));
  float a = edge * clamp(vA, 0.0, 1.0);
  if (a <= 0.002) discard;
  gl_FragColor = vec4(col, a);
}`;
const LVS = `
attribute vec3 color; attribute float alpha;
uniform float uGain;
varying vec3 vC;
void main() { vC = color * alpha * uGain; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const LFS = `varying vec3 vC; void main() { gl_FragColor = vec4(vC, 1.0); }`;
const gMat = g => new THREE.ShaderMaterial({ uniforms: { ...U, uGain: { value: g } }, vertexShader: GVS, fragmentShader: GFS, ...blendAdd });
const lMat = g => new THREE.ShaderMaterial({ uniforms: { ...U, uGain: { value: g } }, vertexShader: LVS, fragmentShader: LFS, ...blendAdd });

class PB {   // point builder
  constructor() { this.p = []; this.s = []; this.a = []; this.c = []; }
  add(v, size, alpha, col) { this.p.push(v.x, v.y, v.z); this.s.push(size); this.a.push(alpha); this.c.push(col.r, col.g, col.b); return this; }
  geo() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('size', new THREE.Float32BufferAttribute(this.s, 1));
    g.setAttribute('alpha', new THREE.Float32BufferAttribute(this.a, 1));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    return g;
  }
  build(gain = 1, order = 1) { const o = new THREE.Points(this.geo(), gMat(gain)); o.frustumCulled = false; o.renderOrder = order; o.userData.col = Float32Array.from(this.c); scene.add(o); return o; }
}
class LB {   // line-segment builder
  constructor() { this.p = []; this.a = []; this.c = []; }
  add(v1, v2, a1, col, a2 = a1) { this.p.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z); this.a.push(a1, a2); this.c.push(col.r, col.g, col.b, col.r, col.g, col.b); return this; }
  build(gain = 1, order = 3) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('alpha', new THREE.Float32BufferAttribute(this.a, 1));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    const o = new THREE.LineSegments(g, lMat(gain)); o.frustumCulled = false; o.renderOrder = order; scene.add(o); return o;
  }
}
const setGain = (o, g) => { o.material.uniforms.uGain.value = g; o.visible = g > .002; };

// ═════════════════════════════════════════════════════════════
//  WORLD
// ═════════════════════════════════════════════════════════════
const NP = 200, K = 6, NCH = 4, NHIT = 16;
const BOSS = V(0, .45, 0);
const ARENA = 5;                          // crowd disc radius (even areal density) = inside the boss's aggro radius
const PL = (() => {
  const R = rng(7), out = [];
  for (let i = 0; i < NP; i++) {
    const ra = ARENA * Math.sqrt(R()), aa = R() * Math.PI * 2;
    const swarm = V(Math.cos(aa) * ra, .04, Math.sin(aa) * ra);
    const rs = 8 + 15 * Math.sqrt(R()), as = R() * Math.PI * 2;
    out.push({ swarm, ra, aa, rs, as, delay: R() * 1.7, ph: R() * 6.28, ph2: R() * 6.28, ch: i % NCH, thr: .45 + .55 * R(), cls: Math.floor(R() * CLASS.length) });
  }
  // the player whose view ring we draw sits near (1.3, 0, .9); make it index 0 so it is also the first of every subset
  const ci = out.map((a, i) => [a.swarm.distanceToSquared(V(-1.9, 0, -1.3)), i]).sort((x, y) => x[0] - y[0])[0][1];
  [out[0], out[ci]] = [out[ci], out[0]];
  return out;
})();
const CI = 0;
PL.forEach((a, i) => { a.knn = new Set(PL.map((b, j) => [a.swarm.distanceToSquared(b.swarm), j]).filter(x => x[1] !== i).sort((x, y) => x[0] - y[0]).slice(0, K).map(x => x[1])); });
// AoE: the 16 players nearest the boss are hit
const HITS = PL.map((a, i) => [Math.hypot(a.swarm.x, a.swarm.z), i]).sort((x, y) => x[0] - y[0]);
const HIT = new Set(HITS.slice(0, NHIT).map(x => x[1])), R_HIT = HITS[NHIT - 1][0] + .12;
const VR1 = 1.25, VR2 = 2.5, GRID = VR1 / 2;
const insideCount = r => PL.filter((a, i) => i !== CI && Math.hypot(a.swarm.x - PL[CI].swarm.x, a.swarm.z - PL[CI].swarm.z) < r).length;
const CNT1 = insideCount(VR1), CNT2 = insideCount(VR2);
// channels: 2 × 2 grid, laid out along screen-right / depth of the camera at the split
const thAt = t => .55 + .05 * t - .04 * clamp(t - 53, 0, 13);   // camera azimuth; the orbit slows in 05
const CHS = .42, CH_TH = thAt(17.6), CH_GAP = 2.75, CH_R = ARENA * CHS + .35;
const CHO = [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([r, d]) => V(Math.cos(CH_TH) * r * CH_GAP * .85 + Math.sin(CH_TH) * d * CH_GAP * 1.3, 0, -Math.sin(CH_TH) * r * CH_GAP * .85 + Math.cos(CH_TH) * d * CH_GAP * 1.3));

// player position as a pure function of t (on the ground)
const convK = (i, t) => eio(p(t, T_CONV + PL[i].delay * .8, 2.0));
function playerPos(i, t, out) {
  const a = PL[i];
  const k = convK(i, t);
  const r = lerp(a.rs, a.ra, k), ang = lerp(a.as, a.aa, k) + (1 - k) * (.05 * t) + Math.sin(k * Math.PI) * .35;
  const drift = 1 - k;
  out.set(Math.cos(ang) * r + drift * .6 * Math.sin(t * .35 + a.ph), .04, Math.sin(ang) * r + drift * .6 * Math.cos(t * .3 + a.ph));
  if (k >= 1) out.set(a.swarm.x, .04, a.swarm.z);
  out.x += .06 * Math.sin(t * 1.3 + a.ph) * k; out.z += .06 * Math.cos(t * 1.1 + a.ph2) * k;
  const c = eio(p(t, T_CH, 1.3));
  if (c > 0) { const o = CHO[a.ch]; out.x = lerp(out.x, o.x + a.swarm.x * CHS, c); out.z = lerp(out.z, o.z + a.swarm.z * CHS, c); }
  return out;
}

// ── terrain: one ground plane; a baked heightfield gives contours, water and hill shade.
//    Ground marks (aggro radius, view radius, AOI grid cells, telegraphs, LOD rings, channel borders) are drawn here too.
const HF = 256, SPAN = 110;
const HTEX = (() => {
  const R = rng(1234), G = 64, lat = Array.from({ length: (G + 1) * (G + 1) * 2 }, () => R());
  const vn = (x, y, o) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const s = q => q * q * (3 - 2 * q);

  [2.2, 14, 30, V(0, 0, 0), 0],

// ── helpers derived from t ───────────────────────────────────

//  SCENE UPDATE

const _v = new THREE.Vector3(), _w = new THREE.Vector3();

  Lu.uK.value = eio(p(t, T_K, .7)) * (1 - eio(p(t, T_CH + .5, .9)));

  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {
    const el = $('stage');
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
  });
  const scrub = $('scrub');
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
    else if (e.key === ',' || e.key === '<') setRate(RATES[Math.min(RATES.length - 1, RATES.indexOf(rate) + 1)]);
    else if (e.key === '.' || e.key === '>') setRate(RATES[Math.max(0, RATES.indexOf(rate) - 1)]);
  });

  const posterMode = location.hash === '#poster';
  if (posterMode) document.body.classList.add('poster');
  ui();
  // chapter deep link: index.html#ch03 opens paused at that chapter
  const deep = /^#ch(\d\d)$/.exec(location.hash), deepHead = deep && HEAD.find(r => r[2] === deep[1]);
  window.ready.then(() => {
    draw(); requestAnimationFrame(frame);
    if (deepHead) seek(deepHead[0] + .01);
    if (posterMode) { play(); setInterval(() => { if (!playing) { t = 0; play(); } }, 500); }
  });
  renderAt(POSTER);
}
</script>
