<style>
  /* Layout: one 9:16 stage (canvas + live sliders when paused), a slim transport bar under it, chapter chips below. Single dark look. */
  :root {
    --bg: #090c0b; --surface: #111815; --line: #2a3731; --fg: #e3eae2; --dim: #8c998f;
    --accent: #f2b544; --live: #3cd3e6; --text2: #c4cec5;
    --sans: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; overflow-x: hidden; }
  .player { width: min(100%, calc((100vh - 170px) * 9 / 16), 480px); min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .big { position: absolute; inset: auto 0 5% 0; margin: 0 auto; width: clamp(44px, 11%, 84px); height: auto; aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--accent);
    background: rgba(17,24,21,.8); color: var(--fg); display: grid; place-items: center; cursor: pointer; transition: transform .15s, opacity .2s; }
  .big[hidden] { display: none; }
  .big:hover { transform: scale(1.06); }
  .big svg { width: 36%; height: 36%; margin-left: 6%; }
  .big.replay svg { margin-left: 0; }
  /* live sliders: real range inputs laid exactly over the canvas dock; shown only while paused inside a chapter */
  .knobs { position: absolute; inset: 0; pointer-events: none; --th: 22px; }
  .knobs[hidden] { display: none; }
  .knobs input[type=range] { position: absolute; pointer-events: auto; -webkit-appearance: none; appearance: none; background: transparent; margin: 0; padding: 0; cursor: pointer; }
  .knobs input[type=range]::-webkit-slider-runnable-track { height: 100%; background: transparent; }
  .knobs input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: var(--th); height: var(--th); margin-top: 0; border-radius: 50%;
    background: #f4ecd6; border: 3px solid var(--c); box-shadow: 0 0 0 4px rgba(0,0,0,.45), 0 0 14px var(--c); box-sizing: border-box; }
  .knobs input[type=range]::-moz-range-track { height: 100%; background: transparent; }
  .knobs input[type=range]::-moz-range-thumb { width: var(--th); height: var(--th); border-radius: 50%; background: #f4ecd6; border: 3px solid var(--c); box-sizing: border-box; }
  .knobs input[type=range]:focus-visible { outline: none; }
  .knobs input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px #f4ecd6, 0 0 18px var(--c); }
  .knobs input[type=range]:disabled { opacity: .25; cursor: not-allowed; }
  .knobs .reset { position: absolute; pointer-events: auto; font: 700 var(--fs, 12px)/1 var(--sans); color: #0b0f0d; background: #f2b544;
    border: 0; border-radius: 6px; cursor: pointer; padding: 0 .8em; white-space: nowrap; }
  .knobs .reset:hover { background: #ffd27a; }
  .bar { display: flex; align-items: center; gap: 14px; }
  .btn { flex: none; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--fg); display: grid; place-items: center; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn svg { width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .time { flex: none; font: 500 13px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .scrub { position: relative; flex: 1; min-width: 0; height: 28px; cursor: pointer; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--line); }
  .fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--live)); }
  .tick { position: absolute; top: 8px; width: 2px; height: 12px; background: var(--dim); opacity: .6; }
  .knob { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 4px rgba(242,181,68,.25); }
  .chapters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chapters button { font: 600 13px/1 var(--sans); color: var(--dim); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; cursor: pointer; }
  .chapters button span { font-family: var(--mono); color: var(--accent); margin-right: 6px; }
  .chapters button:hover { color: var(--fg); }
  .chapters button[aria-current="true"] { color: var(--fg); border-color: var(--accent); background: rgba(242,181,68,.12); }
  @media (max-width: 600px) { .time { font-size: 12px; } }
  .set { display: flex; flex-wrap: wrap; gap: 8px; }
  .set a { font: 600 13px/1 var(--sans); color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
  .set a:hover { border-color: var(--accent); }
  body.poster .set, body.poster .foot { display: none; }
  .rate { width: auto; min-width: 56px; padding: 0 10px; font: 600 13px/1 var(--mono); }
  .foot { margin: 0; font-size: 13px; line-height: 1.6; color: var(--dim); word-break: keep-all; overflow-wrap: anywhere; }
  .foot b { color: var(--text2); font-weight: 700; }
  /* #poster: embed mode for gallery thumbnails — canvas only, loops */
  body.poster { padding: 0; }
  body.poster .player { width: 100%; }
  body.poster .bar, body.poster .chapters, body.poster .big, body.poster .knobs { display: none; }
  body.poster .stage { border: 0; border-radius: 0; }
</style>

<section class="notes" id="notes" hidden></section>
<script>
// ─────────────────────────────────────────────────────────────
//  Tick and RTT Explorable — vertical ~20 s cut. Same engine, model and player as tick-and-rtt-explore-wide.
//  renderAt(t) is pure; renderAt(t, { P, clock }) is the explicit override the player passes while paused.
// ─────────────────────────────────────────────────────────────
const W = 1080, H = 1920, DURATION = 20.5, POSTER = 2.2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// Roles: srv = 서버 · 틱, a = 플레이어 A(나), b = 플레이어 B(상대), jit = 지터 · 보간, ok = 여유 · 정상, red = 초과 · 늦음
const C = {
  bg: '#090c0b', screen: '#0c110f', text: '#e3eae2', dim: '#8c998f', faint: '#55625a', line: '#2a3731', panel: '#111815',
  srv: '#f2b544', a: '#3cd3e6', b: '#c08cff', jit: '#ff7eb6', ok: '#8fe06e', red: '#ff5d52', cream: '#f4ecd6',
};
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';

// ── engine + model: copied unchanged from tick-and-rtt-explore-wide ──
// ── math / easing ────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const win = (t, s, e, f = .45) => Math.min(eo(p(t, s, f)), 1 - eio(p(t, e - f, f)));
const mod = (x, m) => ((x % m) + m) % m;
const R0 = n => Math.round(n);
const ms1 = v => v < 20 ? v.toFixed(1) : String(Math.round(v));

// ── drawing helpers ──────────────────────────────────────────
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(sz, wt = 500, mono = false) { ctx.font = `${wt} ${sz}px ${mono ? MONO : SANS}`; }
function txt(s, x, y, o = {}) {
  const { size = 28, weight = 500, color = C.text, align = 'left', base = 'alphabetic', alpha = 1, mono = false, ls = 0 } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; font(size, weight, mono);
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = ls + 'px';
  ctx.fillText(s, x, y); ctx.restore();
}
function tw(s, size, weight = 500, mono = false) { font(size, weight, mono); return ctx.measureText(s).width; }
function fit(s, maxW, size, weight = 500, mono = false, min = 18) { let z = size; while (z > min && tw(s, z, weight, mono) > maxW) z -= 1; return z; }
// greedy word wrap on spaces
function wrap(s, maxW, size, weight = 500) {
  const out = []; let line = '';
  for (const w of s.split(' ')) { const tryL = line ? line + ' ' + w : w; if (line && tw(tryL, size, weight) > maxW) { out.push(line); line = w; } else line = tryL; }
  if (line) out.push(line); return out;
}
function para(s, x, y, maxW, o = {}) { const { size = 28, weight = 500, lh = size * 1.3 } = o; wrap(s, maxW, size, weight).forEach((l, i) => txt(l, x, y + i * lh, { ...o, size, weight })); }
function panel(x, y, w, h, o = {}) {
  const { r = 10, fill = C.panel, stroke = C.line, alpha = 1, lw = 1.5, dash = null } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (dash) ctx.setLineDash(dash);
  ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); ctx.restore();
}
function tag(label, x, y, color, o = {}) {   // square-cornered instrument tag; returns width
  const { alpha = 1, size = 22, align = 'left', fillA = .14, mono = true } = o;
  font(size, 700, mono);
  const w = ctx.measureText(label).width + size * 1.0, h = size * 1.55;
  const X = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  ctx.save(); ctx.globalAlpha *= alpha;
  rr(X, y - h / 2, w, h, 4); ctx.fillStyle = rgba(color, fillA); ctx.fill();
  ctx.strokeStyle = rgba(color, .75); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, X + w / 2, y + 1); ctx.restore();
  return w;
}
function dot(x, y, r, color, a = 1, glow = 14) {
  ctx.save(); ctx.globalAlpha *= a; ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function check(x, y, s, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = s * .16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .36, y); ctx.lineTo(x - s * .1, y + s * .26); ctx.lineTo(x + s * .38, y - s * .28); ctx.stroke(); ctx.restore();
}
function hatch(x, y, w, h, col, a = 1) {
  if (w <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = rgba(col, .07); ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = rgba(col, .45); ctx.lineWidth = 1.5; ctx.beginPath();
  for (let i = -h; i < w + h; i += 10) { ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); }
  ctx.stroke(); ctx.strokeStyle = rgba(col, .5); ctx.strokeRect(x + .5, y + .5, w - 1, h - 1); ctx.restore();
}
function block(x, y, w, h, col, a = 1) {   // a decode block: filled body + bright top edge (signal high)
  if (w <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = rgba(col, .38); ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w, 3); ctx.fillRect(x, y, 2, h); ctx.restore();
}
function vline(x, y0, y1, col, a = 1, dash = null, lw = 2) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = lw; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke(); ctx.restore();
}
function hline(x0, x1, y, col, a = 1, dash = null, lw = 2) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = lw; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.restore();
}
function arrowLine(x0, y0, x1, y1, col, a = 1, lw = 2.5) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const an = Math.atan2(y1 - y0, x1 - x0); ctx.translate(x1, y1); ctx.rotate(an);
  ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(-12, -7); ctx.lineTo(-12, 7); ctx.fill(); ctx.restore();
}
function marker(x, y, col, a = 1) {   // event marker: down-triangle on a stem
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x - 9, y - 16); ctx.lineTo(x + 9, y - 16); ctx.lineTo(x, y - 2); ctx.fill(); ctx.restore();
}
// time ruler: minor ticks every `minor` ms, labels every `step`
function ruler(x0, x1, y, maxMs, step, minor, k, X, unit = 'ms', fs = 20) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha *= k; ctx.strokeStyle = 'rgba(160,190,170,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.beginPath();
  for (let ms = 0; ms <= maxMs + .01; ms += minor) { const xx = X(ms), big = Math.abs(ms / step - Math.round(ms / step)) < 1e-6; ctx.moveTo(xx, y); ctx.lineTo(xx, y + (big ? 12 : 6)); }
  ctx.stroke(); ctx.restore();
  for (let ms = 0; ms <= maxMs + .01; ms += step) txt(R0(ms) + unit, X(ms), y + 16 + fs, { size: fs, color: C.dim, align: 'center', mono: true, alpha: k });
}
function words(ws, cx, y, t, t0, o = {}) {
  const { size = 96, weight = 800, stagger = .12, colors = [] } = o;
  font(size, weight); const sp = size * .28;
  const widths = ws.map(w => ctx.measureText(w).width);
  let x = cx - (widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1)) / 2;
  ws.forEach((w, i) => {
    const k = eo(p(t, t0 + i * stagger, .8));
    ctx.save(); ctx.globalAlpha *= k; font(size, weight); ctx.fillStyle = colors[i] || C.text;
    ctx.fillText(w, x, y + (1 - k) * 40); ctx.restore();
    x += widths[i] + sp;
  });
}

// ═════════════════════════════════════════════════════════════
//  THE MODEL — every number on screen comes from here
// ═════════════════════════════════════════════════════════════
// Per-tick spread used only when overloaded (processing > tick interval): processing_n = proc + (proc − interval) / 2 × SPIKE[n].
const SPIKE = [0, 0, .7, .25, 1, .45, .85, .1, .6, .95, .3, .55, .8, .2, .65, .4, .9, .05, .7, .35, .5, .15, .75, .6];
// Per-snapshot network delay spread (× jitter knob)
const JIT = [.2, .9, .4, .7, 0, 1, .3, .6, .85, .1, .5, .95, .25, .75, .05, .55, .35, .8, .15, .65, .45, .9, .3, .7];
const DEFAULT = { proc: 30, hz: 20, rttA: 30, rttB: 30, jit: 0 };
const REF = { proc: 30, hz: 20, rttA: 30, rttB: 30, jit: 0 };
function tickList(P, until) {
  const iv = 1000 / P.hz, ex = Math.max(0, P.proc - iv) * .5, out = [];
  let s = 0, n = 0;
  while (s < until && n < 300) { const pr = P.proc + ex * SPIKE[n % SPIKE.length]; out.push({ n, s, pr, e: s + pr, iv }); s += Math.max(iv, pr); n++; }
  return out;
}
function model(P) {
  const iv = 1000 / P.hz, period = Math.max(iv, P.proc), effHz = 1000 / period, over = P.proc > iv + 1e-9;
  const wait = period / 2, interp = 2 * iv + P.jit, frame = 1000 / 60;
  const hzR = Math.max(1, R0(effHz));
  return {
    iv, period, effHz, hzR, over, wait, interp, frame,
    inServer: inServer(P, 60),
    resA: P.rttA + wait + P.proc, resB: P.rttB + wait + P.proc,          // 내 행동의 결과 확인 = RTT + 틱 대기 + 틱 처리
    seen: P.rttA / 2 + wait + P.proc + P.rttB / 2 + interp,             // B 화면 속 A (= A 화면 속 B), 프레임 제외
    seenF: P.rttA / 2 + wait + P.proc + P.rttB / 2 + interp + frame,    // + 프레임
    buff: over ? 10 * R0(P.hz) / hzR : 10,                               // 틱 횟수로 센 10초 버프의 실제 길이(초)
  };
}
function inServer(P, at) { const k = tickList(P, at + 2000).find(x => x.s >= at - 1e-6); return k ? k.e - at : NaN; }
const MREF = model(REF), MDEF = model(DEFAULT);

// ── the presenter (vertical cut) ─────────────────────────────
const KEYS = {
  proc: [[0, 30], [4.9, 30], [6.1, 120], [9.9, 120], [10.6, 10]],
  hz:   [[0, 20]],
  rttA: [[0, 30], [12.2, 30], [13.4, 200]],
  rttB: [[0, 30]],
  jit:  [[0, 0]],
};
function keyVal(k, t) {
  const K = KEYS[k]; if (t <= K[0][0]) return K[0][1];
  for (let i = 0; i < K.length - 1; i++) { const [t0, v0] = K[i], [t1, v1] = K[i + 1]; if (t < t1) return lerp(v0, v1, eio(clamp((t - t0) / (t1 - t0)))); }
  return K[K.length - 1][1];
}
function scripted(t) { const o = {}; for (const k in KEYS) o[k] = keyVal(k, t); return o; }
function turning(t) {
  const out = [];
  for (const k in KEYS) { const K = KEYS[k]; for (let i = 0; i < K.length - 1; i++) if (t >= K[i][0] - .2 && t < K[i + 1][0] + .5 && K[i][1] !== K[i + 1][1]) out.push([k, K[i][1], K[i + 1][1]]); }
  return out;
}

// ── vertical frame ───────────────────────────────────────────
// Full-bleed; text keeps clear of the shorts app UI (top ~110px, bottom ~280px). Header y 120–370, picture y 390–1280, dock 1296–1476, caption 1540–1640.
const X0 = 60, X1 = 1020, CX = 540;
const HEAD = [
  [2.6, 9.8, '01', '50ms를 넘으면', '처리가 틱 간격보다 길면 다음 틱이 밀린다'],

    const th = Math.round(clamp(26 * s, 14, 26));
    knobs.style.setProperty('--th', th + 'px');
    inputs.forEach((el, i) => {
      const tr = knobTrack(i);
      Object.assign(el.style, { left: (tr.x0 * s - th / 2) + 'px', width: ((tr.x1 - tr.x0) * s + th) + 'px', top: (tr.y * sh / H - th / 2) + 'px', height: th + 'px' });
    });
    Object.assign(reset.style, { left: (DOCK.rx * s) + 'px', top: (DOCK.ry * sh / H) + 'px', height: (DOCK.rh * s) + 'px' });
    reset.style.setProperty('--fs', Math.max(9, DOCK.rf * s) + 'px');
  }
  new ResizeObserver(layoutKnobs).observe($('stage'));
  const exploring = () => started && !playing && t >= HEAD[0][0] && t < OUT0;
  const curP = () => userP || scripted(Math.min(t, DURATION - .001));
  function syncKnobs() {
    const P = curP(), ci = Math.max(0, chapterAt(t));
    inputs.forEach((el, i) => {
      const K = KNOBS[i];
      if (document.activeElement !== el) el.value = Math.round(P[K.key] / K.step) * K.step;
      el.setAttribute('aria-valuetext', Math.round(P[K.key]) + ' ' + K.unit);
      el.disabled = !REL[ci].includes(K.key);
      el.title = el.disabled ? '이 장면에서는 영향이 없다' : '';
    });
    reset.hidden = !userP;
  }

  function ui() {
    const k = t / DURATION, ended = t >= DURATION;
    $('fill').style.width = k * 100 + '%'; $('knob').style.left = k * 100 + '%';
    $('time').textContent = `${mmss(t)} / ${mmss(DURATION)}`;
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
    $('play').innerHTML = playing ? ICON.pause : ended ? ICON.replay : ICON.play;
    $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
    $('big').hidden = playing || exploring();
    $('big').innerHTML = ended ? ICON.replay : ICON.play;
    $('big').classList.toggle('replay', ended);
    let cur = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) cur = i; });
    [...$('chapters').children].forEach((b, i) => b.setAttribute('aria-current', i === cur && started));
    knobs.hidden = !exploring();
    if (exploring()) syncKnobs();
  }
  function draw() {
    const tt = started ? Math.min(t, DURATION - .001) : POSTER;
    if (exploring()) renderAt(tt, { P: curP(), clock: performance.now() / 1000 });
    else renderAt(tt);
  }
  function play() { if (t >= DURATION) t = 0; started = true; playing = true; userP = null; last = performance.now(); ui(); }
  function pause() { playing = false; ui(); draw(); }
  function toggle() { playing ? pause() : play(); }
  function seek(x) { started = true; t = clamp(x, 0, DURATION); ui(); draw(); }

  function frame(now) {
    if (playing) {
      t += (now - last) / 1000 * rate; last = now;
      if (t >= DURATION) { t = DURATION; playing = false; }
      draw(); ui();
    } else if (exploring()) draw();   // keep the looping parts alive while exploring
    requestAnimationFrame(frame);
  }

  const RATES = [1, .75, .5];
  let rate = 1;
  try { rate = +localStorage.getItem('mg-rate') || 1; } catch (e) { /* storage unavailable */ }
  if (!RATES.includes(rate)) rate = 1;
  function setRate(r) {
    rate = r; $('rate').textContent = r + '×'; $('rate').setAttribute('aria-label', `재생 속도 ${r}배`);
    try { localStorage.setItem('mg-rate', String(r)); } catch (e) { /* storage unavailable */ }
  }
  setRate(rate);
  $('rate').addEventListener('click', () => setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]));
  $('stage').addEventListener('click', toggle);
  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {
    const el = $('stage');
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
  });
  const scrub = $('scrub');
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.target instanceof HTMLInputElement && e.key !== ' ' && e.key !== 'k') return;   // sliders keep their arrow keys
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
    else if (e.key === ',' || e.key === '<') setRate(RATES[Math.min(RATES.length - 1, RATES.indexOf(rate) + 1)]);
    else if (e.key === '.' || e.key === '>') setRate(RATES[Math.max(0, RATES.indexOf(rate) - 1)]);
  });

  const posterMode = location.hash === '#poster';
  if (posterMode) document.body.classList.add('poster');
  ui();
  // chapter deep link: index.html#ch03 opens paused at that chapter (sliders live)
  const deep = /^#ch(\d\d)$/.exec(location.hash), deepHead = deep && HEAD.find(r => r[2] === deep[1]);
  window.ready.then(() => {
    layoutKnobs(); draw(); requestAnimationFrame(frame);
    if (deepHead) seek(deepHead[0] + .01);
    if (posterMode) { play(); setInterval(() => { if (!playing) { t = 0; play(); } }, 500); }
  });
  renderAt(POSTER);
}
</script>
