<style>

  .chapters { display: flex; flex-wrap: wrap; gap: 8px; }

<script type="module">
// ─────────────────────────────────────────────────────────────
//  Packet Zoom — style C: one continuous "powers of ten" dive.
//  Hall → rack → server → NIC/DMA → DIMM → DRAM chip → die → cell array → the payload's cells → one cell → back out.
//  Each level is modelled at near-unit size in its own units and nested inside its parent by a fixed transform.
//  Every frame the world is re-rooted on the level the camera is in (doubles on the CPU), so float precision and the
//  depth buffer (near/far scaled to the camera distance) only ever see ~3 orders of magnitude. Every frame is a pure function of t.
//  Facts follow ../one-byte/: the extreme 8 B movement entry = 64 bits (slot 12b, x 14b, y 14b, z 8b, 방향 6b, 상태 4b, Δt 6b).
//  Layouts, field values and cell positions are illustrative.
// ─────────────────────────────────────────────────────────────
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1920, H = 1080, DURATION = 50;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';
const LIME = '#b5e853';

// ── math / easing ────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const ss = u => u * u * u * (u * (u * 6 - 15) + 10);
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const win = (t, s, e, f = .45) => Math.min(eo(p(t, s, f)), 1 - eio(p(t, e - f, f)));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// ── the payload: the 8 B movement entry from ../one-byte (field values are an example) ──
const FIELDS = [['슬롯', 12, 1234], ['x', 14, 9021], ['y', 14, 4410], ['z', 8, 37], ['방향', 6, 45], ['상태', 4, 3], ['Δt', 6, 17]];
const BITS = (() => { let w = 0n, s = 0n; for (const [, b, v] of FIELDS) { w |= BigInt(v) << s; s += BigInt(b); } return [...Array(64)].map((_, i) => Number((w >> BigInt(i)) & 1n)); })();
const CHIP = 2;                                    // this DRAM chip holds byte 2 (lane → chip mapping illustrative)
const MYBITS = BITS.slice(CHIP * 8, CHIP * 8 + 8);
const ONE_K = (() => { let best = 0, bd = 9; MYBITS.forEach((b, k) => { if (b && Math.abs(k - 3.5) < bd) { bd = Math.abs(k - 3.5); best = k; } }); return best; })();

// ── timeline ─────────────────────────────────────────────────
// [start, end, number, chapter label]
const HEAD = [
  [0.0, 4.0, '01', '데이터센터 홀'], [4.0, 8.0, '02', '랙 하나'], [8.0, 12.6, '03', '게임 서버'], [12.6, 18.0, '04', 'NIC → DMA'],
  [18.0, 22.6, '05', 'DIMM'], [22.6, 26.6, '06', 'DRAM 칩'], [26.6, 30.4, '07', '다이 · 뱅크'], [30.4, 33.8, '08', '셀 어레이'],
  [33.8, 38.4, '09', '패킷의 바이트'], [38.4, 42.0, '10', '셀 하나'], [42.0, 46.4, '11', '다시 홀로'],
];
const END = 46.4;
// bottom-left captions: [start, end, TITLE, SUBTITLE, 한국어 한 줄, footnote]
const CAP = [
  [0.3, 3.9, 'DATACENTER HALL', 'ROWS OF RACKS · COLD AISLE IN FRONT, HOT AISLE BEHIND · ILLUSTRATIVE LAYOUT', '데이터센터 홀 — 랙이 줄지어 서 있고, 랙 앞쪽 통로로 찬 공기가 들어온다'],
  [4.0, 7.9, 'ONE RACK', '42U · GAME SERVERS STACKED · TOP-OF-RACK SWITCH', '랙 하나 — 높이 약 2 m에 서버가 층층이 꽂혀 있고, 맨 위 스위치가 네트워크를 잇는다'],
  [8.0, 12.5, 'ONE GAME SERVER', '1U · LID OFF · 2 CPUs · 16 DIMMs · NIC · ILLUSTRATIVE LAYOUT', '게임 서버 한 대 — 뚜껑을 열면 CPU 2개, 메모리 모듈(DIMM) 16개, 네트워크 카드(NIC)가 있다'],
  [12.6, 17.9, 'PACKET IN → DMA', 'NIC → PCIe → MEMORY CONTROLLER IN THE CPU → DIMM', 'NIC가 받은 패킷을 DMA로 메인 메모리에 쓴다. CPU 코어가 한 바이트씩 옮기지 않는다'],
  [18.0, 22.5, 'ONE DIMM', 'DDR4 RDIMM · 64-BIT DATA BUS · 8 DATA CHIPS (x8) + ECC · ILLUSTRATIVE', '8바이트는 데이터 칩 8개에 1바이트씩 나뉘어 저장된다'],
  [22.6, 26.5, 'ONE DRAM CHIP', 'PACKAGE OPENED · ONE SILICON DIE INSIDE · ILLUSTRATIVE', 'DRAM 칩 하나 — 검은 몰딩 아래에 실리콘 다이가 들어 있다'],
  [26.6, 30.3, 'DRAM DIE', '16 BANKS IN 4 BANK GROUPS · GENERIC FLOORPLAN · ILLUSTRATIVE', 'DDR4 다이는 뱅크 16개로 나뉘고, 뱅크는 다시 작은 셀 어레이(매트) 여러 개로 나뉜다'],
  [30.4, 33.7, 'CELL ARRAY', 'WORD LINES (ROWS) × BIT LINES (COLUMNS) · ILLUSTRATIVE', '워드 라인(행)과 비트 라인(열)이 엇갈리는 자리마다 셀이 하나씩 있다'],
  [33.8, 38.3, "THE PACKET'S BYTES", '8-BYTE MOVEMENT PAYLOAD = 64 BITS = 64 CELLS', '이동 정보 8바이트 = 셀 64개. 이 칩에는 그중 1바이트, 셀 8개가 있다',
    '* 헤더(이더넷 · IP · UDP 42B)까지 합친 패킷 전체는 이보다 크다 · 셀 위치와 비트 순서는 예시'],
  [38.4, 41.9, 'ONE CELL', '1 TRANSISTOR + 1 CAPACITOR · EVERY ROW REFRESHED WITHIN 64 MS · ILLUSTRATIVE', '비트 하나 = 커패시터 하나의 전하. 전하가 조금씩 새기 때문에 주기적으로 다시 채운다',
    '* 충전 = 1은 예시 · 실제 커패시터는 이보다 훨씬 가늘고 높다'],
  [42.0, 46.0, 'BACK OUT', 'CELL → DIE → CHIP → DIMM → SERVER → RACK → HALL', '같은 길을 거꾸로 — 셀에서 홀까지'],
];

// ── three.js setup ───────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0c0d');
scene.fog = new THREE.Fog(0x0b0c0d, 10, 100);
const camera = new THREE.PerspectiveCamera(35, W / H, .1, 1000);
scene.add(camera);
const hemi = new THREE.HemisphereLight('#e2e0dc', '#3a3734', 1.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff4e6', 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);
const LDIR = V3(-.5, 1, .62).normalize();

const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .55, .45, .92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ── builders ─────────────────────────────────────────────────
function canvasTex(w, h, draw, { rep = [1, 1], srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const tx = new THREE.CanvasTexture(c);
  if (srgb) tx.colorSpace = THREE.SRGBColorSpace;
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(rep[0], rep[1]); tx.anisotropy = ANISO;
  return tx;
}
// box with a vertical gradient baked into vertex colours (cheap ambient occlusion: darker toward the base)
function boxAO(w, h, d, lo = .5) {
  const g = new THREE.BoxGeometry(w, h, d); const pos = g.attributes.position; const col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) { const k = lo + (1 - lo) * Math.pow(clamp((pos.getY(i) + h / 2) / h), .7); col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = k; }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); return g;
}
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .72, metalness: .12, vertexColors: true, ...o });
const MP = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .72, metalness: .12, ...o });   // no vertex colours
function mesh(parent, geo, mat, x = 0, y = 0, z = 0, { cast = true, recv = true } = {}) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = recv; parent.add(m); return m;
}
function box(parent, w, h, d, x, y, z, mat, lo, o) { return mesh(parent, boxAO(w, h, d, lo), mat, x, y, z, o); }
const _o = new THREE.Object3D();
function inst(parent, geo, mat, list, { cast = true, recv = true } = {}) {
  const im = new THREE.InstancedMesh(geo, mat, Math.max(1, list.length));
  list.forEach((it, i) => {
    _o.position.set(it[0], it[1], it[2]); _o.rotation.set(it[6] || 0, it[7] || 0, it[8] || 0);
    _o.scale.set(it[3] ?? 1, it[4] ?? 1, it[5] ?? 1); _o.updateMatrix(); im.setMatrixAt(i, _o.matrix);
    if (it[9] !== undefined) im.setColorAt(i, new THREE.Color().setScalar(it[9]));
  });
  im.count = list.length; im.castShadow = cast; im.receiveShadow = recv; im.computeBoundingSphere(); parent.add(im); return im;
}
const limeMat = k => new THREE.MeshBasicMaterial({ color: new THREE.Color(LIME).multiplyScalar(k), toneMapped: true });
function polyTube(points, r, segs = 400, rad = 6) {
  const path = new THREE.CurvePath();
  for (let i = 0; i < points.length - 1; i++) path.add(new THREE.LineCurve3(points[i], points[i + 1]));
  const g = new THREE.TubeGeometry(path, segs, r, rad, false); g.userData = { segs, rad }; return g;
}
function setTubeRange(g, a, b) {   // show the tube between path fractions a..b
  const { segs, rad } = g.userData; const i0 = Math.floor(clamp(a) * segs), i1 = Math.ceil(clamp(b) * segs);
  g.setDrawRange(i0 * rad * 6, Math.max(0, i1 - i0) * rad * 6);
}

// ── levels: each one is modelled in its own units and nested in its parent ──
// local(t): matrix child → parent. unit: metres per local unit.
const LV = [];
function compose(pos, rot, s) {
  return new THREE.Matrix4().compose(V3(...pos), new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)), V3(s, s, s));
}
function level(name, unit, parent, local) {
  const g = new THREE.Group(); g.matrixAutoUpdate = false; scene.add(g);
  const L = { name, unit, parent, local, g, ph: null }; LV.push(L); return L;
}
const SLIDE = t => eio(p(t, 7.3, 1.9)) * (1 - eio(p(t, 45.0, .8)));          // server slides out of the rack (and back on the way out)
const LIDK = t => eio(p(t, 8.9, 1.6)) * (1 - eio(p(t, 44.75, .6)));
const SINKK = t => eio(p(t, 10.1, 1.3)) * (1 - eio(p(t, 44.7, .6)));
const FANK = t => eio(p(t, 10.0, 1.2)) * (1 - eio(p(t, 44.7, .6)));
const DLIFT = t => eio(p(t, 17.5, 1.3)) * (1 - eio(p(t, 44.45, .5)));             // target DIMM lifts out of its slot
const MOLDK = t => eio(p(t, 23.7, 1.6)) * (1 - eio(p(t, 44.15, .45)));

// bank / mat geometry shared by L4 (texture) and L5 (3D mats) so the grids line up
const MAT_PX = .27, MAT_PZ = .21;                  // mat pitch in L4 units (0.1 mm): 27 µm × 21 µm
const BANK_NX = 52, BANK_NZ = 93;
const BANK_W = BANK_NX * MAT_PX, BANK_H = BANK_NZ * MAT_PZ;
const BANK_X0 = c => -29.73 + c * 15.14;
const BANK_Z0 = [-43.53, -23.73, 4.2, 24.0];
const TBANK = [1, 1];                              // target bank: column 1, row 1 (next to the spine)
const TMAT = [26, 46];
const MX = BANK_X0(TBANK[0]) + TMAT[0] * MAT_PX + .125, MZ = BANK_Z0[TBANK[1]] + TMAT[1] * MAT_PZ + .09;
