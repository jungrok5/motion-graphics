<script type="module">
// ─────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────
//  One Byte Stack — 바닥부터 쌓아 올리기, vertical ~20 s cut.
//  One selected byte (8 bit cells that read 0/1) is copied × 50 → × 10 → × 5,000 → × 86,400 → × 30 until it is a city of data
//  (6.5 TB/월), then the four sizes stand as towers of those month-slices (324/259/227/156 TB, 34B → 8B −168TB). Same engine and
//  look as ../one-byte-stack-wide/ (hex-dump world, dissector field colours, selection yellow). Every frame is a pure function of t.
// ─────────────────────────────────────────────────────────────
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const W = 1080, H = 1920, DURATION = 20.5;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';
// Roles: sel = the byte we follow / operators (hex-editor selection) · tag = protobuf tag · length · id / pos / dir / state / time = fields
//        save = what shrinks · other = non-movement traffic · combat / chat = other outbound traffic
const C = {
  bg: '#0b0d11', panel: '#12161d', line: '#252b36', text: '#ecebe6', dim: '#9097a3', faint: '#5d6470',
  sel: '#ffd84d', tag: '#ff5d5d', id: '#f0a04b', pos: '#4cc3d9', dir: '#9ad15a', state: '#c39bff', time: '#8a96a8',
  save: '#5fe0a8', other: '#3d4450', combat: '#e07fb0', chat: '#6b7280', empty: '#171b22', rack: '#2a303b', grey: '#b9b3a6',
};

// ── math / easing ────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const win = (t, s, e, f = .45) => Math.min(eo(p(t, s, f)), 1 - eio(p(t, e - f, f)));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const hash = n => rng(n * 7919 + 13)();
const fmt = n => Math.round(n).toLocaleString('en-US');

// ── story numbers (same model as ../one-byte) ────────────────
// 5,000 CCU · 50 viewers · 10Hz → 1 byte of movement = 6.48TB/month; movement = 60% of outbound at 24B
const CCU = 5000, VIEW = 50, HZ = 10, TB_PER_BYTE = 6.48;
const OTHER_TB = 24 * TB_PER_BYTE / .6 * .4;   // non-movement outbound, fixed (103.68 TB)
const totalTB = b => b * TB_PER_BYTE + OTHER_TB;
function bytesFmt(b) { const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; } return (b >= 100 || i === 0 ? Math.round(b) : b.toFixed(1)) + ' ' + u[i]; }
const money = tb => '$' + (tb * .05).toFixed(1) + 'k~' + (tb * .09).toFixed(1) + 'k';
const servers = b => Math.ceil(25 * totalTB(b) / totalTB(34) - 1e-9);

// ── the real bytes of one example movement, four encodings ───
const varint = v => { const out = []; v = BigInt(v); do { let b = Number(v & 0x7Fn); v >>= 7n; if (v) b |= 0x80; out.push(b); } while (v); return out; };
const f32 = v => { const d = new DataView(new ArrayBuffer(4)); d.setFloat32(0, v, true); return [0, 1, 2, 3].map(i => d.getUint8(i)); };
const uint = (v, n) => Array.from({ length: n }, (_, i) => Number((BigInt(v) >> BigInt(8 * i)) & 0xFFn));
const VAL = { id: 100042, x: 1203.37, y: 845.62, z: 12.85, dir: 271.35, st: 2, ms: 1760000000123, ms32: 123456789, dt: 100 };
const dir16 = Math.round(VAL.dir / 360 * 65536) & 0xFFFF;
function encode(parts) { const b = [], f = []; for (const [arr, key] of parts) for (const v of arr) { b.push(v); f.push(key); } return { b, f }; }
function packBits(fields) { const bits = [], keys = []; for (const [v, n, key] of fields) for (let i = n - 1; i >= 0; i--) { bits.push((v >> i) & 1); keys.push(key); } return { bits, keys }; }
const BITS8F = (slot, x, y, z, d, s, dt) => [[slot, 12, 'id'], [x, 14, 'pos'], [y, 14, 'pos'], [z, 8, 'pos'], [d, 6, 'dir'], [s, 4, 'state'], [dt, 6, 'time']];
const E34 = encode([[[0x0A, 32], 'tag'], [[0x08], 'tag'], [varint(VAL.id), 'id'], [[0x15], 'tag'], [f32(VAL.x), 'pos'], [[0x1D], 'tag'], [f32(VAL.y), 'pos'],
  [[0x25], 'tag'], [f32(VAL.z), 'pos'], [[0x28], 'tag'], [varint(Math.round(VAL.dir * 1000)), 'dir'], [[0x30], 'tag'], [varint(VAL.st), 'state'], [[0x38], 'tag'], [varint(VAL.ms), 'time']]);
const E24 = encode([[uint(VAL.id, 4), 'id'], [f32(VAL.x), 'pos'], [f32(VAL.y), 'pos'], [f32(VAL.z), 'pos'], [uint(dir16, 2), 'dir'], [uint(VAL.st, 2), 'state'], [uint(VAL.ms32, 4), 'time']]);
const E19 = encode([[uint(VAL.id, 3), 'id'], [f32(VAL.x), 'pos'], [f32(VAL.y), 'pos'], [f32(VAL.z), 'pos'], [uint(dir16, 2), 'dir'], [uint(VAL.st, 1), 'state'], [uint(VAL.dt, 1), 'time']]);
const P8 = packBits(BITS8F(37, 9215, 3380, 96, 48, 2, 10));
function bitsToBytes(bits) { const out = []; for (let i = 0; i < bits.length; i += 8) { let v = 0; for (let j = 0; j < 8; j++) v = v << 1 | bits[i + j]; out.push(v); } return out; }
function majority(keys) { const c = {}; keys.forEach(k => c[k] = (c[k] || 0) + 1); return Object.keys(c).sort((a, b) => c[b] - c[a])[0]; }
const E8 = { b: bitsToBytes(P8.bits), f: Array.from({ length: 8 }, (_, r) => majority(P8.keys.slice(r * 8, r * 8 + 8))), bitKeys: P8.keys };
const ENC = [[34, '프로토버퍼 기본', E34], [24, '커스텀 기본', E24], [19, '커스텀 비트 패킹', E19], [8, '이동 전용 극단 양자화', E8]];
ENC.forEach(([b, , e]) => console.assert(e.b.length === b, 'encoding size', b, e.b.length));
const SEED_ROW = 4;                                   // the 24B entry's first x byte: the byte we follow
const SEED_BYTE = E24.b[SEED_ROW];
const byteBits = v => Array.from({ length: 8 }, (_, j) => (v >> (7 - j)) & 1);
const hex2 = v => v.toString(16).toUpperCase().padStart(2, '0');

// ── timeline (vertical) ──────────────────────────────────────
const HEAD = [
  [2.4, 12.2, '01', '1바이트에 붙는 곱하기', '보는 사람 × 갱신 빈도 × 동접 × 시간'],
  [12.2, 17.6, '02', '크기별 총량', '서버 전체 송신 / 월 · 34B · 24B · 19B · 8B'],
];
const OUTRO_T = 17.6;
const ST = [2.7, 4.1, 5.5, 6.9, 8.3, 9.7];                  // 1 byte, ×50, ×10, ×5,000, ×86,400, ×30
const HIDE_D = ST[4] + 1.2, HIDE_3 = ST[5] + 1.6, CITY_FADE = 11.7, CITY_END = 12.4, T4 = 12.8;

// ── three.js setup ───────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);
const camera = new THREE.PerspectiveCamera(40, W / H, .1, 1000);
scene.add(camera);
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .45, .45, .78);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// shared uniforms
const U = { uT: { value: 0 }, uFog: { value: new THREE.Color(C.bg) }, uFogNear: { value: 100 }, uFogFar: { value: 1000 }, uL: { value: new THREE.Vector3(-.38, 1, .62).normalize() } };

// glyph atlas: "0" | "1" (alpha only); redrawn once fonts are in
const glyphCanvas = document.createElement('canvas'); glyphCanvas.width = 256; glyphCanvas.height = 128;
const glyphTex = new THREE.CanvasTexture(glyphCanvas); glyphTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
function drawGlyphs() {
  const g = glyphCanvas.getContext('2d'); g.clearRect(0, 0, 256, 128);
  g.fillStyle = '#fff'; g.font = `800 112px ${MONO}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('0', 64, 70); g.fillText('1', 192, 70); glyphTex.needsUpdate = true;
}
drawGlyphs();

// ── cell material: instanced boxes that read as bits (0/1 glyph) or as aggregates (grid of what they contain) ──
const CELL_VS = `
attribute vec3 aCol; attribute vec4 aInfo; attribute vec3 aGrid;
uniform float uT, uDur, uDrop;
varying vec3 vCol, vLocal, vN, vGrid; varying float vBit, vGlow, vIdx, vDist;
void main() {
  float k = clamp((uT - aInfo.y) / uDur, 0., 1.);
  float e = 1. - pow(1. - k, 3.);
  vec4 wp = modelMatrix * instanceMatrix * vec4(position * max(e, 1e-4), 1.);
  wp.y += (1. - e) * uDrop;
  vLocal = position + .5; vN = normal; vGrid = aGrid; vCol = aCol; vBit = aInfo.x; vGlow = aInfo.z; vIdx = aInfo.w;
  vec4 mv = viewMatrix * wp; vDist = -mv.z;
  gl_Position = projectionMatrix * mv;
}`;
const CELL_FS = `
uniform sampler2D uGlyph; uniform float uOpacity, uGlowK, uHi, uHiK, uFogNear, uFogFar; uniform vec3 uFog, uL;
varying vec3 vCol, vLocal, vN, vGrid; varying float vBit, vGlow, vIdx, vDist;
void main() {
  vec3 n = normalize(vN);
  vec2 uv; vec2 gc;
  if (abs(n.x) > .5) { uv = vLocal.zy; gc = vGrid.zy; }
  else if (abs(n.y) > .5) { uv = vec2(vLocal.x, 1. - vLocal.z); gc = vGrid.xz; }
  else { uv = vLocal.xy; gc = vGrid.xy; }
  vec3 base = vCol;
  if (vBit > -.5 && vBit < .5) base *= .36;
  float lit = .46 + .54 * max(dot(n, uL), 0.) + (n.y > .5 ? .1 : 0.);
  vec3 col = base * lit;
  vec2 ed = min(uv, 1. - uv); float edge = min(ed.x, ed.y);
  col *= mix(.5, 1., smoothstep(0., max(.05, fwidth(edge) * 1.5), edge));
  if (gc.x > 1.5 || gc.y > 1.5) {
    vec2 q = uv * gc; vec2 fw = fwidth(q);
    vec2 gd = abs(fract(q - .5) - .5) / max(fw, vec2(1e-4));
    float line = 1. - min(min(gd.x, gd.y), 1.);
    float vis = 1. - smoothstep(.22, .45, max(fw.x, fw.y));
    col *= 1. - .5 * line * vis;
  }
  if (vBit > -.5 && (n.z > .5 || n.y > .5)) {
    vec2 g = (uv - .5) / .78 + .5;
    if (g.x > 0. && g.x < 1. && g.y > 0. && g.y < 1.) {
      float a = texture2D(uGlyph, vec2((g.x + vBit) * .5, g.y)).a;
      vec3 gcol = vBit > .5 ? vec3(.008) : min(base * 2.6, vec3(1.));
      col = mix(col, gcol, a * .92);
    }
  }
  if (vIdx >= uHi) col *= mix(1., .2, uHiK);
  col += vCol * vGlow * uGlowK;
  col = mix(col, uFog, smoothstep(uFogNear, uFogFar, vDist));
  gl_FragColor = vec4(col, uOpacity);
}`;
function cellMat({ dur = .45, drop = 0, glowK = 1 } = {}) {
  return new THREE.ShaderMaterial({
    vertexShader: CELL_VS, fragmentShader: CELL_FS,
    uniforms: { uT: U.uT, uFog: U.uFog, uFogNear: U.uFogNear, uFogFar: U.uFogFar, uL: U.uL, uGlyph: { value: glyphTex },
      uDur: { value: dur }, uDrop: { value: drop }, uOpacity: { value: 1 }, uGlowK: { value: glowK }, uHi: { value: 1e9 }, uHiK: { value: 0 } },
  });
}
const BOX = new THREE.BoxGeometry(1, 1, 1);
const _o = new THREE.Object3D(), _c = new THREE.Color();
// items: { x, y, z, sx, sy, sz, col, bit (-1 none), t0, glow, idx, gx, gy, gz }  (sx.. default s)
function cells(parent, items, opt = {}) {
  const n = Math.max(1, items.length), geo = BOX.clone();
  const col = new Float32Array(n * 3), info = new Float32Array(n * 4), grid = new Float32Array(n * 3);
  const im = new THREE.InstancedMesh(geo, cellMat(opt), n);
  items.forEach((it, i) => {
    const s = it.s ?? .86;

const CHAIN = [

// ── frame ────────────────────────────────────────────────────
function renderAt(t) {
  t = clamp(t, 0, DURATION);
  U.uT.value = t;
  const c = camAt(t);
  applyVis(t);
  camera.position.copy(c.T).addScaledVector(c.dir, c.d); camera.up.set(0, 1, 0); camera.lookAt(c.T);
  camera.near = c.d * .02; camera.far = c.d * 60;
  camera.setViewOffset(W, H, -c.ox, -c.oy, W, H);
  camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  U.uFogNear.value = c.d * 1.5; U.uFogFar.value = c.d * 6;
  floor.position.set(c.T.x, 0, c.T.z); floor.scale.set(c.d * 40, c.d * 40, 1);
  floorMat.uniforms.uD.value = c.d; floorMat.uniforms.uCam.value.copy(camera.position);
  back.material.uniforms.uOff.value = (t * .004) % 1;
  composer.render();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.drawImage(renderer.domElement, 0, 0, W, H);

window.renderAt = renderAt;
window.DURATION = DURATION;

window.ready = (async () => {
  const faces = [['Pretendard', 'Pretendard-Variable.woff2', '100 900'], ['JetBrains Mono', 'JetBrainsMono.woff2', '100 800']];
  for (const [family, file, weight] of faces) {
    for (const base of ['assets/fonts/', '../assets/fonts/']) {
      try { document.fonts.add(await new FontFace(family, `url(${base}${file})`, { weight }).load()); break; } catch (e) { /* try next */ }
    }
  }
  await document.fonts.ready;
  drawGlyphs(); drawHex();
  renderAt(0);
})();
// ── player (skipped when ?render) ────────────────────────────
if (!location.search.includes('render')) {
  const $ = id => document.getElementById(id);
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    replay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>',
  };
  const CHAPTERS = [[0, '', '인트로'], ...HEAD.map(h => [h[0], h[2], h[3]]), [OUTRO_T, '', '정리']];
  $('scrub').setAttribute('aria-valuemax', Math.round(DURATION));
  const POSTER = 10.4;
  let t = 0, playing = false, started = false, last = 0;
  const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

  CHAPTERS.forEach(([s, n, label], i) => {
    const b = document.createElement('button');
    b.innerHTML = (n ? `<span>${n}</span>` : '') + label;
    b.addEventListener('click', () => { seek(s + .01); play(); });
    $('chapters').appendChild(b);
    if (i) { const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (s / DURATION * 100) + '%'; $('ticks').appendChild(tk); }
  });

  function ui() {
    const k = t / DURATION, ended = t >= DURATION;
    $('fill').style.width = k * 100 + '%'; $('knob').style.left = k * 100 + '%';
    $('time').textContent = `${mmss(t)} / ${mmss(DURATION)}`;
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
    $('play').innerHTML = playing ? ICON.pause : ended ? ICON.replay : ICON.play;
    $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
    $('big').hidden = playing;
    $('big').innerHTML = ended ? ICON.replay : ICON.play;
    $('big').classList.toggle('replay', ended);
    let cur = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) cur = i; });
    [...$('chapters').children].forEach((b, i) => b.setAttribute('aria-current', i === cur && started));
  }
  function draw() { renderAt(started ? Math.min(t, DURATION - .001) : POSTER); }
  function play() { if (t >= DURATION) t = 0; started = true; playing = true; last = performance.now(); ui(); }
  function pause() { playing = false; ui(); }
  function toggle() { playing ? pause() : play(); }
  function seek(x) { started = true; t = clamp(x, 0, DURATION); draw(); ui(); }

  function frame(now) {
    if (playing) {
      t += (now - last) / 1000 * rate; last = now;
      if (t >= DURATION) { t = DURATION; playing = false; }
      draw(); ui();
    }
    requestAnimationFrame(frame);
  }

  const RATES = [1, .75, .5];
  let rate = 1;
  try { rate = +localStorage.getItem('mg-rate') || 1; } catch (e) { /* storage unavailable */ }
  if (!RATES.includes(rate)) rate = 1;
  function setRate(r) {
    rate = r; $('rate').textContent = r + '×'; $('rate').setAttribute('aria-label', `재생 속도 ${r}배`);

  }
  setRate(rate);
  $('rate').addEventListener('click', () => setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]));

  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {

}
