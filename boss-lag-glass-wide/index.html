<script type="module">
// ─────────────────────────────────────────────────────────────
//  보스가 뜨면 왜 렉이 걸릴까? — style B: 3D grid world + glass panels (16:9 PC cut of ../boss-lag-glass/)
//  16:9 layout: 3D subject in the left two thirds (view offset), glass panel on the right third,
//  header across the top, chip top-left, captions bottom-centre. Same beats/timing/copy as the vertical cut.
//  Grid floor = zone map, small glass cards = players, glowing web = updates per tick.
//  three.js renders offscreen; header/captions/end card are drawn on #c in 2D.
//  Every frame is a pure function of time: renderAt(t). No frame-to-frame state.
//  Facts follow ../boss-lag/index.html: N × (N − 1) per tick (이동만), 20 → 380, 200 → 39,800,
//  반경 2배 → 보이는 인원 약 4배 (밀도가 고르면), 줄이는 법 3가지. 수치는 예시.
// ─────────────────────────────────────────────────────────────
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1920, H = 1080, DURATION = 21.6;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';

// ── math / easing ────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const win = (t, s, e, f = .45) => Math.min(eo(p(t, s, f)), 1 - eio(p(t, e - f, f)));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toLocaleString('en-US');

// ── timeline ─────────────────────────────────────────────────
// [start, end, number, chapter label, header tag, caption line 1, caption line 2]
const HEAD = [
  [0.0, 4.3, '01', '보스 등장', 'SPAWN', '보스가 뜨면', '사람이 한곳에 몰린다'],
  [4.3, 9.7, '02', '갱신 수', 'PER TICK', '갱신 수는', 'N × (N − 1)로 는다'],
  [9.7, 14.0, '03', '시야 반경', 'VIEW', '시야가 2배면', '보이는 인원은 약 4배'],
  [14.0, 18.7, '04', '줄이는 방법', 'REDUCE', '게임은 이렇게 줄인다', '양을 줄이거나, 인원을 나눈다'],
];
const END = 19.4;
// beat-4 stages (match the three checked rows)
const T_FAR = 14.7, T_KNN = 15.8, T_SPLIT = 16.9;
// example head-count shown in panel 01 and the chip: 20 → 200 while the crowd packs in
const headCount = t => Math.round(20 + 180 * eio(p(t, 1.0, 2.9)));

// ── three.js setup ───────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#040713');
scene.fog = new THREE.Fog(0x050a1c, 40, 170);
const FOV = 38;
const camera = new THREE.PerspectiveCamera(FOV, W / H, .1, 600);
// shift the picture left so the 3D subject sits in the left two thirds (subject centre → x ≈ 960 − OFFX);
// the right third belongs to the glass panel. OFFX eases back to 0 once the last panel has left (viewOffX).
const OFFX = 330, OFFY = 0;
const viewOffX = t => OFFX * (1 - eio(p(t, 18.0, 1.2)));
camera.setViewOffset(W, H, OFFX, -OFFY, W, H);
scene.add(camera);   // panels ride along as camera children

const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .8, .5, .9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// sky dome
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec3 vP; void main(){ float h = vP.y; vec3 top = vec3(.0008,.001,.004); vec3 hor = vec3(.005,.007,.03);
    vec3 c = mix(hor, top, smoothstep(-.02, .45, h)); c += vec3(.008,.012,.05) * exp(-abs(h) * 14.); gl_FragColor = vec4(c,1.); }`,
}));
scene.add(sky);

// floor: grid lines + boss pools + view ring + channel sections, all in one shader
const floorMat = new THREE.ShaderMaterial({
  depthWrite: true, fog: false,
  uniforms: {
    uCam: { value: new THREE.Vector3() },
    uBoss: { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] },
    uRing: { value: new THREE.Vector4() },
    uSec: { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] },
    uSecH: { value: 6.5 },
  },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `varying vec3 vW; uniform vec3 uCam; uniform vec3 uBoss[3]; uniform vec4 uRing; uniform vec3 uSec[3]; uniform float uSecH;
    float grid(vec2 c){ vec2 g = abs(fract(c - .5) - .5) / fwidth(c); return 1. - min(min(g.x, g.y), 1.); }
    void main(){
      float d = length(vW - uCam);
      float fade = exp(-d * .016);
      float minor = grid(vW.xz / 1.2) * .55;
      float major = grid(vW.xz / 6.0);
      vec3 c = vec3(.0012,.0018,.007) + vec3(.06,.11,.5) * (minor * .35 + major * .9) * fade;
      for (int i = 0; i < 3; i++) {
        float b = exp(-length(vW.xz - uBoss[i].xy) * .17) * uBoss[i].z;
        c += vec3(.09,.015,.07) * b;
        // channel sections: lit square border + faint fill
        vec2 q = abs(vW.xz - uSec[i].xy); float m = max(q.x, q.y);
        float edge = exp(-pow((m - uSecH) / .07, 2.)) + .35 * exp(-pow((m - uSecH) / .5, 2.));
        c += vec3(.25,.55,1.6) * edge * uSec[i].z + vec3(.006,.012,.05) * step(m, uSecH) * uSec[i].z;
      }
      // view ring
      float rd = length(vW.xz - uRing.xy);
      c += vec3(1.2,.75,.22) * (exp(-pow((rd - uRing.z) / .07, 2.)) + .3 * exp(-pow((rd - uRing.z) / .4, 2.))) * uRing.w;
      c += vec3(.05,.03,.005) * smoothstep(uRing.z, uRing.z - .3, rd) * uRing.w;
      vec3 far = vec3(.005,.007,.03);
      c = mix(far, c, clamp(fade * 1.8, 0., 1.));
      gl_FragColor = vec4(c, 1.);
    }`,
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const glowTex = (() => {
  const c = mkCanvas(128, 128), g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.18, 'rgba(220,235,255,0.85)'); gr.addColorStop(.45, 'rgba(120,160,255,0.3)'); gr.addColorStop(1, 'rgba(40,80,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
})();

// ── crowd: final packed positions around the boss (origin) ───
const RC = rng(42);
const NC = 56, R_IN = 1.9, R_OUT = 7.6;
const crowd = [];
for (let guard = 0; crowd.length < NC && guard < 20000; guard++) {
  const a = RC() * Math.PI * 2, r = Math.sqrt(lerp(R_IN * R_IN, R_OUT * R_OUT, RC()));
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (crowd.every(c => Math.hypot(c.x - x, c.z - z) > 1.3)) crowd.push({ x, z, a, r });
}
crowd.forEach(c => {
  const sa = c.a + (RC() - .5) * 1.3, sr = 12 + RC() * 26;
  c.sx = Math.cos(sa) * sr; c.sz = Math.sin(sa) * sr;
  c.t0 = .9 + RC() * 1.3; c.dur = 1.5 + RC() * .9;
  c.ph = RC() * 6.28; c.bright = .8 + RC() * .35;
});
// channel / instance split: three copies of the zone laid out side by side along the final camera's
// screen-right axis (16:9: left · middle · right; middle copy keeps the boss at the origin). Cards split
// into thirds by position along that axis, then each third re-forms an even disc around its own boss copy.
const AZ_END = 2.5, AX = [Math.cos(AZ_END), -Math.sin(AZ_END)];   // screen-right of the final camera
const SEC_R = 10.6, SEC_H = 4.6;
const SEC_C = [-1, 0, 1].map(k => ({ x: AX[0] * SEC_R * k, z: AX[1] * SEC_R * k }));
{
  const order = crowd.map((c, i) => [c.x * AX[0] + c.z * AX[1], i]).sort((a, b) => a[0] - b[0]);
  const per = Math.ceil(NC / 3);
  order.forEach(([, i], rank) => {
    const g = Math.min(2, Math.floor(rank / per)), k = rank - g * per, n = Math.min(per, NC - g * per);
    const c = crowd[i]; c.g = g;
    const r2 = 1.45 + 2.85 * Math.sqrt((k + .5) / n), a2 = k * 2.39996 + g;
    c.cx = SEC_C[g].x + Math.cos(a2) * r2; c.cz = SEC_C[g].z + Math.sin(a2) * r2;
  });
}
// hero card for "one player's move goes to everyone": front-facing at t ≈ 4.6 (camera on +z side)
const HERO = crowd.map((c, i) => [c.r > 3 && c.r < 5.5 ? c.z + c.x * .3 : -99, i]).sort((a, b) => b[0] - a[0])[0][1];
// view-ring centre + radius: search so the count with 2r is close to 4× the count with r
const RING = (() => {
  let best = null;
  crowd.forEach((c, i) => {
    if (c.r < 3.2 || c.r > 5.6) return;
    for (let r1 = 1.5; r1 <= 2.3; r1 += .05) {
      let n1 = 0, n2 = 0;
      crowd.forEach((o, j) => { if (j === i) return; const d = Math.hypot(o.x - c.x, o.z - c.z); if (d < r1) n1++; if (d < r1 * 2) n2++; });
      if (n1 < 3) continue;
      const score = Math.abs(n2 / n1 - 4) + Math.abs(r1 - 1.9) * .2;
      if (!best || score < best.score) best = { i, r1, n1, n2, score };
    }
  });
  return best;
})();
const RC_I = RING.i, RC_P = crowd[RING.i];

// ── pairs: everyone ↔ everyone in the crowd ──────────────────
const RP = rng(9);
const pairs = [];
for (let i = 0; i < NC; i++) for (let j = i + 1; j < NC; j++) {
  const d = Math.hypot(crowd[i].x - crowd[j].x, crowd[i].z - crowd[j].z);
  pairs.push({ i, j, d, rank: RP(), b: .35 + .65 * Math.pow(RP(), 1.6), hue: RP(), hero: i === HERO || j === HERO });
}
// nearest K per card (cap on visible players)
const K = 5;
const knn = crowd.map((c, i) => new Set(crowd.map((o, j) => [Math.hypot(o.x - c.x, o.z - c.z), j]).filter(a => a[1] !== i).sort((a, b) => a[0] - b[0]).slice(0, K).map(a => a[1])));
pairs.forEach(q => {
  q.knn = knn[q.i].has(q.j) || knn[q.j].has(q.i);
  q.same = crowd[q.i].g === crowd[q.j].g;
  q.farW = clamp(1.3 - q.d / 5.5, .1, 1);
  const o = q.i === HERO ? q.j : q.i; q.heroRank = Math.atan2(crowd[o].z - crowd[HERO].z, crowd[o].x - crowd[HERO].x) / 6.2832 + .5;
});

// crowd position at t (pure)
function cardPos(i, t, out) {
  const c = crowd[i];
  const k = eio(p(t, c.t0, c.dur));
  let x = lerp(c.sx, c.x, k), z = lerp(c.sz, c.z, k);
  const ks = eio(p(t, T_SPLIT + c.r * .03, 1.3));
  if (ks > 0) { x = lerp(x, c.cx, ks); z = lerp(z, c.cz, ks); }
  // everyone keeps moving a little (all players moving)
  x += Math.sin(t * 1.3 + c.ph) * .07; z += Math.cos(t * 1.1 + c.ph * 1.7) * .07;
  out.x = x; out.z = z; return out;
}
const webDim = t => 1 - .42 * win(t, 5.4, 14.6, .8);   // cards step back while the web is the subject
const splitK = t => eio(p(t, T_SPLIT, 1.5));
const ringR = t => t < 11.3 ? RING.r1 * eo(p(t, 9.9, .7)) : lerp(RING.r1, RING.r1 * 2, eio(p(t, 11.3, 1.4)));
const ringA = t => win(t, 9.85, 14.2, .5);

// ── player cards (instanced glass) + reflections + floor glows ─
const cardTex = (() => {
  const c = mkCanvas(128, 180), g = c.getContext('2d');

    $('time').textContent = `${mmss(t)} / ${mmss(DURATION)}`;
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
    $('play').innerHTML = playing ? ICON.pause : ended ? ICON.replay : ICON.play;
    $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
    $('big').hidden = playing;
    $('big').innerHTML = ended ? ICON.replay : ICON.play;
    $('big').classList.toggle('replay', ended);
    let cur = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) cur = i; });
    [...$('chapters').children].forEach((b, i) => b.setAttribute('aria-current', i === cur && started));
  }
  function draw() { renderAt(started ? Math.min(t, DURATION - .001) : POSTER); }
  function play() { if (t >= DURATION) t = 0; started = true; playing = true; last = performance.now(); ui(); }
  function pause() { playing = false; ui(); }
  function toggle() { playing ? pause() : play(); }
  function seek(x) { started = true; t = clamp(x, 0, DURATION); draw(); ui(); }

  function frame(now) {
    if (playing) {
      t += (now - last) / 1000 * rate; last = now;
      if (t >= DURATION) { t = DURATION; playing = false; }
      draw(); ui();
    }
    requestAnimationFrame(frame);
  }

  const RATES = [1, .75, .5];
  let rate = 1;
  try { rate = +localStorage.getItem('mg-rate') || 1; } catch (e) { /* storage unavailable */ }
  if (!RATES.includes(rate)) rate = 1;
  function setRate(r) {
    rate = r; $('rate').textContent = r + '×'; $('rate').setAttribute('aria-label', `재생 속도 ${r}배`);
    try { localStorage.setItem('mg-rate', String(r)); } catch (e) { /* storage unavailable */ }
  }
  setRate(rate);
  $('rate').addEventListener('click', () => setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]));
  $('stage').addEventListener('click', toggle);
  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {
    const el = $('stage');
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
  });
  const scrub = $('scrub');
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
    else if (e.key === ',' || e.key === '<') setRate(RATES[Math.min(RATES.length - 1, RATES.indexOf(rate) + 1)]);
    else if (e.key === '.' || e.key === '>') setRate(RATES[Math.max(0, RATES.indexOf(rate) - 1)]);
  });

  const posterMode = location.hash === '#poster';
  if (posterMode) document.body.classList.add('poster');
  ui();
  const deep = /^#ch(\d\d)$/.exec(location.hash), deepHead = deep && HEAD.find(r => r[2] === deep[1]);
  window.ready.then(() => {
    draw(); requestAnimationFrame(frame);
    if (deepHead) seek(deepHead[0] + .01);
    if (posterMode) { play(); setInterval(() => { if (!playing) { t = 0; play(); } }, 500); }
  });
  renderAt(POSTER);
}
</script>
