  .bar { display: flex; align-items: center; gap: 14px; }

<script>
// ─────────────────────────────────────────────────────────────
//  TCP Retransmission Whiteboard Vertical — ~21 s cut: dup ACK ×3 vs the RTO timer running twice, then the receive buffer with its hole.
//  Every frame is a pure function of time: renderAt(t).
// ─────────────────────────────────────────────────────────────
const W = 1080, H = 1920, DURATION = 21.5;
// ── board kit: liquid-chalk strokes, handwriting-placed text, stickies, taped printouts, eraser ──

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// Liquid-chalk markers on this glass board: white = structure and data segments, cyan = ACK and what we measure,

const INK = { k: '#eef1f4', b: '#56d4ff', r: '#ff6262', a: '#ffc23d', g: '#4fe08c', dim: '#a1abb8', faint: '#5f6a78' };

const PINK = { k: '#1d2128', b: '#1559b8', r: '#cf2622', a: '#a35a00', g: '#11804a', dim: '#5a616d' };

let PEN = null;

// stroke(id, points, k, color): a marker line drawn along its path up to fraction k, with a seeded hand wobble.

function setPen(x, y, col) {

}
function arrowS(id, x0, y0, x1, y1, k, col, o = {}) {

// a polyline with a head on its last leg
function pathArrow(id, pts, k, col, o = {}) {
  if (k <= 0) return;
  stroke(id, pts, clamp(k / .9), col, o);

  const oh = { ...o, dash: null, amp: .5 };

}
function boxS(id, x, y, w, h, k, col, o = {}) {
  const r = rng(hash(id + 'b')), j = () => (r() - .5) * 5;
  stroke(id, [[x - 5 + j(), y + j()], [x + w + j(), y + j()], [x + w + j(), y + h + j()], [x + j(), y + h + j()], [x + 2, y - 9]], k, col, o);
}

  const r = rng(hash(id + 'r')), a0 = -2.4 + r() * .8, ph = r() * 6, pts = [];

}
// a hand-drawn X (loss)
function xmark(id, x, y, s, k, col, lw = 6) {
  stroke(id + 'a', [[x - s, y - s], [x + s, y + s]], clamp(k * 2), col, { lw, amp: .6 });

// a check mark (the fix)
function checkS(id, x, y, s, k, col, lw = 6) { stroke(id, [[x - s * .45, y], [x - s * .1, y + s * .35], [x + s * .5, y - s * .4]], k, col, { lw, amp: .5 }); }

function dotS(x, y, r, col, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore(); }

function hatch(x, y, w, h, col, a = 1, step = 15) {

// wr: text written left to right up to fraction k (a clip that follows the pen). Set in a readable face, placed with a slight hand tilt.
function wr(s, x, y, k, o = {}) {
  if (k <= 0 || !s) return 0;
  const { size = 30, weight = 700, color = INK.k, align = 'left', mono = false, alpha = 1, rot = null, ls = 0 } = o;

// several colored runs on one line, written in sequence
function sayParts(parts, x, y, u, t0, o = {}) {

// strike a written line through (the reasoning "this no longer holds")
function strike(id, x0, x1, y, k, col, o = {}) { stroke(id, [[x0, y + 3], [x1, y - 3]], k, col, { lw: 5, ...o }); }

// sticky note: slapped on (slight overshoot in scale, shadow settles), content drawn in local coords (0,0 = top-left)
function sticky(x, y, w, h, k, o, fn) {
  if (k <= 0 || PEEL <= 0) return;
  const { rot = -.02, col = '#ffe45e' } = o || {};

function shade(hex, f) { const n = parseInt(hex.slice(1), 16); const c = v => Math.round(clamp(v + v * f, 0, 255)); return `rgb(${c(n >> 16 & 255)},${c(n >> 8 & 255)},${c(n & 255)})`; }

function paper(x, y, w, h, k, o, fn) {
  if (k <= 0 || PEEL <= 0) return;
  const { rot = -.008, col = '#f7f6f1', tape = true } = o || {};

//  End card
// ═════════════════════════════════════════════════════════════
const OUTRO = { link: ['jungrok5.github.io/motion-graphics/', 'tcp-retransmission-board-wide'] };
function sOutro(t) {
  if (t < OUT_S) return;
  const v = t - OUT_S;
  const [lx] = sayParts([['TCP는 ', INK.k], ['빠진', INK.r], [' 패킷을', INK.k]], W / 2, 820, v, .1, { size: 84, weight: 800, align: 'center', cps: 26 });
  sayParts([['기다리느라 늦어진다.', INK.k]], W / 2, 940, v, .6, { size: 84, weight: 800, align: 'center', cps: 26 });
  const ux = lx + tw('TCP는 ', 84, 800), uw = tw('빠진', 84, 800);
  stroke('o-ul', [[ux, 850], [ux + uw / 2, 856], [ux + uw + 4, 846]], clamp((v - 1.3) / .3), INK.r, { lw: 8 });
  say('전체 영상 · 설명 · 용어집', W / 2, 1180, v, 1.5, { size: 40, weight: 700, color: INK.dim, align: 'center', cps: 60 });
  OUTRO.link.forEach((l, i) => say(l, W / 2, 1250 + i * 50, v, 1.8 + i * .3, { size: 34, weight: 600, mono: true, color: INK.b, align: 'center', cps: 110 }));
}

// ── frame ────────────────────────────────────────────────────
function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; PEN = null; PEEL = 1;
  board();
  sHeader(t); sTwoKinds(t); sHOL(t); sOutro(t);
  onBoardV(t, WIPE1, 380, 1680, () => caption(t, [
    [2.3, 4.7, 'dup ACK 3개면 바로 재전송', '* 수치는 예시: 패킷 20ms 간격, 100ms 지점 손실'],
    [4.7, WIPE1, '띄엄띄엄하면 RTO까지 기다린다', '* 예시: 원본 · 첫 재전송 2번 손실, 리눅스 RTO 최소 200ms'],
  ]));
  onBoardV(t, OUT_S, 0, H, () => caption(t, [[WIPE1 + .5, OUT_S, '하나가 빠지면 뒤에 온 것도 전부 대기', '이동 · 스킬 · 채팅이 같은 연결이면 모두 같이 멈춘다']]));
  const erasing = eraser(t);
  boardFrame(); progress(t); tray(erasing);
  if (!erasing) drawPen(1.25);
  const fo = p(t, DURATION - .6, .6); if (fo > 0) { ctx.fillStyle = `rgba(7,10,19,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;
window.DURATION = DURATION;

window.ready = (async () => {
  const faces = [['Pretendard', 'Pretendard-Variable.woff2', '100 900'], ['JetBrains Mono', 'JetBrainsMono.woff2', '100 800']];
  for (const [family, file, weight] of faces) {
    for (const base of ['assets/fonts/', '../assets/fonts/']) {
      try { document.fonts.add(await new FontFace(family, `url(${base}${file})`, { weight }).load()); break; } catch (e) { /* try next */ }
    }
  }
  await document.fonts.ready;
})();

// ── player (skipped when ?render) ────────────────────────────
if (!location.search.includes('render')) {
  const $ = id => document.getElementById(id);
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    replay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>',
  };
  const CHAPTERS = [[0, '', '인트로'], ...HEAD.map(h => [h[0], h[2], h[3]]), [OUT_S, '', '정리']];
  $('scrub').setAttribute('aria-valuemax', Math.round(DURATION));
  const POSTER = 9.8;   // beat 1 complete: dup ACK ×3 ≈100 ms above, RTO 200 → 400 ms (2번 손실) and the 620 ms sticky below
  let t = 0, playing = false, started = false, last = 0;
  const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

  CHAPTERS.forEach(([s, n, label], i) => {
    const b = document.createElement('button');
    b.innerHTML = (n ? `<span>${n}</span>` : '') + label;
    b.addEventListener('click', () => { seek(s + .01); play(); });
    $('chapters').appendChild(b);
    if (i) { const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (s / DURATION * 100) + '%'; $('ticks').appendChild(tk); }
  });

  function ui() {
    const k = t / DURATION, ended = t >= DURATION;
    $('fill').style.width = k * 100 + '%'; $('knob').style.left = k * 100 + '%';
    $('time').textContent = `${mmss(t)} / ${mmss(DURATION)}`;
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
    $('play').innerHTML = playing ? ICON.pause : ended ? ICON.replay : ICON.play;
    $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
    $('big').hidden = playing;
    $('big').innerHTML = ended ? ICON.replay : ICON.play;
    $('big').classList.toggle('replay', ended);
    let cur = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) cur = i; });
    [...$('chapters').children].forEach((b, i) => b.setAttribute('aria-current', i === cur && started));
  }
  function draw() { renderAt(started ? Math.min(t, DURATION - .001) : POSTER); }
  function play() { if (t >= DURATION) t = 0; started = true; playing = true; last = performance.now(); ui(); }
  function pause() { playing = false; ui(); }
  function toggle() { playing ? pause() : play(); }
  function seek(x) { started = true; t = clamp(x, 0, DURATION); draw(); ui(); }

  function frame(now) {
    if (playing) {
      t += (now - last) / 1000 * rate; last = now;
      if (t >= DURATION) { t = DURATION; playing = false; }
      draw(); ui();
    }
    requestAnimationFrame(frame);
  }

  const RATES = [1, .75, .5];
  let rate = 1;
  try { rate = +localStorage.getItem('mg-rate') || 1; } catch (e) { /* storage unavailable */ }
  if (!RATES.includes(rate)) rate = 1;
  function setRate(r) {
    rate = r; $('rate').textContent = r + '×'; $('rate').setAttribute('aria-label', `재생 속도 ${r}배`);
    try { localStorage.setItem('mg-rate', String(r)); } catch (e) { /* storage unavailable */ }
  }
  setRate(rate);
  $('rate').addEventListener('click', () => setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]));
  $('stage').addEventListener('click', toggle);
  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {
    const el = $('stage');
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
  });
  const scrub = $('scrub');
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
    else if (e.key === ',' || e.key === '<') setRate(RATES[Math.min(RATES.length - 1, RATES.indexOf(rate) + 1)]);
    else if (e.key === '.' || e.key === '>') setRate(RATES[Math.max(0, RATES.indexOf(rate) - 1)]);
  });

  const posterMode = location.hash === '#poster';
  if (posterMode) document.body.classList.add('poster');
  ui();
  // chapter deep link: index.html#ch03 opens paused at that chapter
  const deep = /^#ch(\d\d)$/.exec(location.hash), deepHead = deep && HEAD.find(r => r[2] === deep[1]);
  window.ready.then(() => {
    draw(); requestAnimationFrame(frame);
    if (deepHead) seek(deepHead[0] + .01);
    if (posterMode) { play(); setInterval(() => { if (!playing) { t = 0; play(); } }, 500); }
  });
  renderAt(POSTER);
}
</script>
