<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motion Graphics</title>
<style>
  /* Layout: a narrow column of video entries, each a wide poster row. Single dark look. */
  @font-face { font-family: Pretendard; src: url(assets/fonts/Pretendard-Variable.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url(assets/fonts/JetBrainsMono.woff2) format("woff2"); font-weight: 100 800; }
  :root {
    --bg: #070a13; --surface: #0e1424; --line: #24304a; --fg: #e8ecf4; --dim: #8b95a7; --accent: #a78bfa; --live: #34d399;
    --sans: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
    padding-block: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
  header { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(32px, 6vw, 48px); font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  header p { margin: 0; color: var(--dim); font-size: 17px; line-height: 1.6; max-width: 60ch; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 20px; }
  a.card { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; text-decoration: none; color: inherit;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); transition: border-color .2s; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  .poster { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--bg); }
  .poster iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .meta { display: flex; flex-direction: column; gap: 8px; padding: 18px 20px 20px; min-width: 0; }
  .meta h2 { margin: 0; font-size: 22px; font-weight: 800; }
  .meta p { margin: 0; color: var(--dim); line-height: 1.55; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; font: 500 12px/1 var(--mono); color: var(--dim); }
  .tags span { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
  .tags .len { color: var(--live); border-color: var(--live); }
  footer { color: var(--dim); font-size: 13px; }
  footer a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <header>
    <span class="eyebrow">Code-driven motion graphics</span>
    <h1>코드로 그리는 기술 설명 영상</h1>
    <p>모든 프레임을 코드로 그립니다. 브라우저에서 바로 재생되고, 같은 페이지를 프레임별로 구워 MP4도 만듭니다.</p>
  </header>
  <ul id="list"></ul>
  <footer>Source: <a href="https://github.com/jungrok5/motion-graphics">github.com/jungrok5/motion-graphics</a></footer>
</main>
<script>
  // Add one entry per video. `path` is the folder holding its index.html.
  const VIDEOS = [
    { path: 'proto-bot-pipeline/', title: '패킷 정의 하나로, 개발부터 라이브까지', length: '1:04',
      desc: '프로토버퍼로 패킷을 정의하고 클라·서버·봇 코드를 생성해, 서버 선개발 컨텐츠 테스트와 퍼블리셔 부하 테스트까지 잇는 과정.',
      tags: ['protobuf', 'codegen', 'bot client', 'load test'] },
    { path: 'rubber-banding/', title: '앞으로 달렸는데, 왜 뒤로 끌려갈까?', length: '1:07',
      desc: 'MMO 러버밴딩이 생기는 구조(클라 예측 · 서버 판정)와 원인(네트워크 지연·손실, 속도 검증, 충돌, 상태이상, 서버 틱), 그리고 재조정·스무딩으로 줄이는 방법.',
      tags: ['client prediction', 'server authority', 'reconciliation', 'netcode'] },
    { path: 'lag-diagnosis/', title: '렉 걸렸다. 서버 탓일까, 내 탓일까?', length: '1:13',
      desc: '클라렉 · 네트워크렉 · 서버렉의 증상과 원인, 프레임타임 · 전송 핑 · 앱 핑 · 영향 범위로 판별하는 순서.',
      tags: ['frame time', 'RTT', 'server tick', 'diagnosis'] },
    { path: 'server-tick/', title: '서버 안의 50ms, 무슨 일이 일어날까?', length: '1:21',
      desc: 'MMO 게임서버의 스레드 구조(I/O · 메시지 큐 · 존별 로직 · DB 워커)와 틱 루프, 그리고 큐 적체 · AOI 폭발 · DB · 락 · GC가 틱을 늦추는 방식과 볼 지표.',
      tags: ['threads', 'tick loop', 'message queue', 'AOI'] },
    { path: 'tcp-retransmission/', title: '사라진 패킷 하나가 전부를 멈춘다', length: '1:21',
      desc: 'TCP 재전송이 왜 · 언제 생기는지(Fast Retransmit vs RTO, HOL 블로킹), 클라 · 서버 · 인프라에 나타나는 현상과 메트릭, 확인 명령과 완화법.',
      tags: ['TCP', 'retransmission', 'RTO', 'metrics'] },
    { path: 'skill-journey/', title: '내 스킬 하나가 상대 화면에 뜨기까지', length: '1:25',
      desc: '버튼 입력부터 예측 실행 · 패킷 생성, 네트워크 홉, 서버의 I/O · 큐 · 틱 검증 · 판정 · AOI, 다운링크, 상대 클라의 보간 · 렌더까지 단계별 경로와 지연 합계.',
      tags: ['input', 'packet', 'server tick', 'interpolation'] },
    { path: 'tick-and-rtt/', title: '50ms와 RTT, 렉은 어디서 생길까?', length: '1:23',
      desc: '서버 틱 처리시간이 50ms를 넘으면 왜 문제인지(응답 · 끊김 · 시간 왜곡), RTT가 느리면 무엇이 달라지는지(결과 지연 · 과거의 나 · 판정 불일치 · 지터).',
      tags: ['tick budget', 'RTT', 'jitter', 'lag compensation'] },
    { path: 'boss-lag/', title: '보스가 뜨면 왜 렉이 걸릴까?', length: '1:22',
      desc: '인원이 몰리면 브로드캐스트가 N×(N−1)로 늘고, 시야 반경이 2배면 보이는 인원이 4배가 되는 이유. 광역기 · 이펙트 · AI 부하, 서버 · 망 · 클라에서 터지는 지점과 대응.',
      tags: ['broadcast N²', 'AOI', 'view radius', 'boss fight'] },
    { path: 'slow-client/', title: '클라가 느리면 서버도 느려진다', length: '1:49',
      desc: '보스전에 받을 양은 늘고 클라 처리는 떨어진다. 클라 수신 큐 → 소켓 정체 → Zero Window → 서버 송신 큐로 압력이 올라오는 과정, 상한 전에도 서버가 느려지는 이유, 안전장치로서의 큐 상한, 클라 · 서버 쪽 해결 방법과 인프라 확인법.',
      tags: ['boss fight', 'receive queue', 'zero window', 'send queue'] },
    { path: 'one-byte/', title: '이동 패킷, 바이트를 줄이면 무슨 일이?', length: '1:37',
      desc: '같은 이동 정보가 프로토버퍼 34B · 커스텀 24B · 비트 패킹 19B · 극단 양자화 8B. 1바이트 = 월 6.5TB가 되는 곱하기, 크기별 송신 트래픽 · 비용 · 서버 대수 · 보스존 수용, 패킷 하나에 담기는 인원, 그리고 프로토버퍼는 이동만 bytes로.',
      tags: ['bandwidth', 'quantization', 'protobuf', 'cost'] },
    { path: 'ue-client-threads/', title: '언리얼 클라의 스레드와 렉', length: '1:52',
      desc: '게임 · 렌더 · GPU 스레드와 따로 둔 리시브 · 센드 스레드, 클라의 프레임 = 게임 스레드 한 틱(FPS와 서버 틱 처리 시간의 관계). 받은 패킷이 다음 틱까지 기다리는 이유, 내 FPS가 남들 화면의 내 움직임을 끊기게 하는 이유, FPS에 따른 화면 지연, 보스전 GPU 대기, GC · 동기 로딩 히치와 줄이는 방법.',
      tags: ['unreal', 'game thread', 'recv thread', 'frame'] },
  ];
  const list = document.getElementById('list');
  for (const v of VIDEOS) {
    const li = document.createElement('li');
    li.innerHTML = `<a class="card" href="${v.path}">
      <div class="poster"><iframe src="${v.path}#poster" title="${v.title}" loading="lazy" tabindex="-1"></iframe></div>
      <div class="meta"><h2></h2><p></p><div class="tags"><span class="len">${v.length}</span>${v.tags.map(t => `<span>${t}</span>`).join('')}</div></div></a>`;
    li.querySelector('h2').textContent = v.title;
    li.querySelector('p').textContent = v.desc;
    list.appendChild(li);
  }
</script>
</body>
</html>
