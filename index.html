<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motion Graphics</title>
<style>
  /* Layout: a narrow column of video entries, each a wide poster row. Single dark look. */
  @font-face { font-family: Pretendard; src: url(assets/fonts/Pretendard-Variable.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url(assets/fonts/JetBrainsMono.woff2) format("woff2"); font-weight: 100 800; }
  :root {
    --bg: #070a13; --surface: #0e1424; --line: #24304a; --fg: #e8ecf4; --dim: #8b95a7; --accent: #a78bfa; --live: #34d399;
    --sans: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
    padding-block: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
  header { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(32px, 6vw, 48px); font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  header p { margin: 0; color: var(--dim); font-size: 17px; line-height: 1.6; max-width: 60ch; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 20px; }
  a.card { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; text-decoration: none; color: inherit;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); transition: border-color .2s; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  .poster { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--bg); }
  /* vertical (mobile) videos: tall poster beside the text */
  a.card.v { grid-template-columns: minmax(0, 220px) minmax(0, 1fr); }
  a.card.v .poster { aspect-ratio: 9 / 16; }
  @media (max-width: 560px) { a.card.v { grid-template-columns: minmax(0, 1fr); } a.card.v .poster { width: 60%; justify-self: center; } }
  .poster iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .meta { display: flex; flex-direction: column; gap: 8px; padding: 18px 20px 20px; min-width: 0; }
  .meta h2 { margin: 0; font-size: 22px; font-weight: 800; }
  .meta p { margin: 0; color: var(--dim); line-height: 1.55; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; font: 500 12px/1 var(--mono); color: var(--dim); }
  .tags span { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
  .tags .len { color: var(--live); border-color: var(--live); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .links a, .head-links a { font: 600 14px/1 var(--sans); color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; background: var(--surface); }
  .links a:hover, .head-links a:hover { border-color: var(--accent); }
  .head-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  footer { color: var(--dim); font-size: 13px; }
  footer a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <header>
    <span class="eyebrow">Code-driven motion graphics</span>
    <h1>코드로 그리는 기술 설명 영상</h1>
    <p>모든 프레임을 코드로 그립니다. 브라우저에서 바로 재생되고, 주제마다 영상 · 설명 · 용어집이 한 세트입니다.</p>
  </header>
  <ul id="list"></ul>
  <footer>Source: <a href="https://github.com/jungrok5/motion-graphics">github.com/jungrok5/motion-graphics</a></footer>
</main>
<script>
  // Add one entry per video. `path` is the folder holding its index.html.
  const VIDEOS = [
    { path: 'proto-bot-pipeline/', mp4: 'out/proto-bot-pipeline.mp4', title: '패킷 정의 하나로, 개발부터 라이브까지', length: '1:04',
      desc: '프로토버퍼로 패킷을 정의하고 클라·서버·봇 코드를 생성해, 서버 선개발 컨텐츠 테스트와 퍼블리셔 부하 테스트까지 잇는 과정.',
      tags: ['protobuf', 'codegen', 'bot client', 'load test'] },
    { path: 'proto-bot-pipeline-shorts/', vertical: true, mp4: 'out/proto-bot-pipeline-shorts.mp4', full: 'proto-bot-pipeline/', title: '세로 · 패킷 정의 하나로, 개발부터 라이브까지', length: '0:57',
      desc: '모바일용 세로 영상. .proto 하나로 클라 · 서버 · 봇 코드를 생성하고, 서버가 먼저 봇으로 테스트하고, 같은 봇으로 퍼블리셔가 장비를 산정한다. 57초에.',
      tags: ['mobile', '9:16', 'protobuf', 'bot', 'load test'] },
    { path: 'rubber-banding/', mp4: 'out/rubber-banding.mp4', title: '앞으로 달렸는데, 왜 뒤로 끌려갈까?', length: '1:07',
      desc: 'MMO 러버밴딩이 생기는 구조(클라 예측 · 서버 판정)와 원인(네트워크 지연·손실, 속도 검증, 충돌, 상태이상, 서버 틱), 그리고 재조정·스무딩으로 줄이는 방법.',
      tags: ['client prediction', 'server authority', 'reconciliation', 'netcode'] },
    { path: 'rubber-banding-shorts/', vertical: true, mp4: 'out/rubber-banding-shorts.mp4', full: 'rubber-banding/', title: '세로 · 앞으로 달렸는데, 왜 뒤로 끌려갈까?', length: '0:55',
      desc: '모바일용 세로 영상. 클라 예측과 서버 판정이 어긋나면 서버 위치로 되돌린다. 네트워크와 판정 불일치 두 원인, 재조정 · 스무딩으로 줄이는 법을 55초에.',
      tags: ['mobile', '9:16', 'rubber-banding', 'prediction'] },
    { path: 'lag-diagnosis/', mp4: 'out/lag-diagnosis.mp4', title: '렉 걸렸다. 서버 탓일까, 내 탓일까?', length: '1:13',
      desc: '클라렉 · 네트워크렉 · 서버렉의 증상과 원인, 프레임타임 · 전송 핑 · 앱 핑 · 영향 범위로 판별하는 순서.',
      tags: ['frame time', 'RTT', 'server tick', 'diagnosis'] },
    { path: 'lag-diagnosis-shorts/', vertical: true, mp4: 'out/lag-diagnosis-shorts.mp4', full: 'lag-diagnosis/', title: '세로 · 렉 걸렸다. 서버 탓일까, 내 탓일까?', length: '0:55',
      desc: '모바일용 세로 영상. 체감 렉은 클라 · 네트워크 · 서버 구간의 합. 렉 세 종류의 신호, 전송 핑과 앱 핑으로 가르는 법, 판별 순서를 55초에.',
      tags: ['mobile', '9:16', 'lag diagnosis', 'ping'] },
    { path: 'server-tick/', mp4: 'out/server-tick.mp4', title: '서버 안의 50ms, 무슨 일이 일어날까?', length: '1:21',
      desc: 'MMO 게임서버의 스레드 구조(I/O · 메시지 큐 · 존별 로직 · DB 워커)와 틱 루프, 그리고 큐 적체 · AOI 폭발 · DB · 락 · GC가 틱을 늦추는 방식과 볼 지표.',
      tags: ['threads', 'tick loop', 'message queue', 'AOI'] },
    { path: 'server-tick-shorts/', vertical: true, mp4: 'out/server-tick-shorts.mp4', full: 'server-tick/', title: '세로 · 서버 안의 50ms', length: '0:55',
      desc: '모바일용 세로 영상. 틱 하나는 단계 시간의 합. 큐가 밀리고, 브로드캐스트가 인원의 제곱으로 늘고, DB · 락 · GC가 틱을 막는 순간을 55초에.',
      tags: ['mobile', '9:16', 'tick budget'] },
    { path: 'tcp-retransmission/', mp4: 'out/tcp-retransmission.mp4', title: '사라진 패킷 하나가 전부를 멈춘다', length: '1:21',
      desc: 'TCP 재전송이 왜 · 언제 생기는지(Fast Retransmit vs RTO, HOL 블로킹), 클라 · 서버 · 인프라에 나타나는 현상과 메트릭, 확인 명령과 완화법.',
      tags: ['TCP', 'retransmission', 'RTO', 'metrics'] },
    { path: 'tcp-retransmission-shorts/', vertical: true, mp4: 'out/tcp-retransmission-shorts.mp4', full: 'tcp-retransmission/', title: '세로 · 사라진 패킷 하나가 전부를 멈춘다', length: '0:55',
      desc: '모바일용 세로 영상. Dup ACK 3개면 바로 재전송, 띄엄띄엄 보내면 RTO까지 기다린다. HOL 블로킹, ss · nstat으로 확인하고 줄이는 법을 55초에.',
      tags: ['mobile', '9:16', 'TCP', 'retransmission', 'HOL'] },
    { path: 'skill-journey/', mp4: 'out/skill-journey.mp4', title: '내 스킬 하나가 상대 화면에 뜨기까지', length: '1:25',
      desc: '버튼 입력부터 예측 실행 · 패킷 생성, 네트워크 홉, 서버의 I/O · 큐 · 틱 검증 · 판정 · AOI, 다운링크, 상대 클라의 보간 · 렌더까지 단계별 경로와 지연 합계.',
      tags: ['input', 'packet', 'server tick', 'interpolation'] },
    { path: 'skill-journey-shorts/', vertical: true, mp4: 'out/skill-journey-shorts.mp4', full: 'skill-journey/', title: '세로 · 내 스킬 하나가 상대 화면에 뜨기까지', length: '0:54',
      desc: '모바일용 세로 영상. 내 클라 → 네트워크 → 서버 → 네트워크 → 상대 클라. 내 화면은 ~25ms, 상대 화면은 200ms+가 되는 이유와 보간 버퍼 ~100ms를 54초에.',
      tags: ['mobile', '9:16', 'latency', 'interpolation'] },
    { path: 'tick-and-rtt/', mp4: 'out/tick-and-rtt.mp4', title: '50ms와 RTT, 렉은 어디서 생길까?', length: '1:23',
      desc: '서버 틱 처리시간이 50ms를 넘으면 왜 문제인지(응답 · 끊김 · 시간 왜곡), RTT가 느리면 무엇이 달라지는지(결과 지연 · 과거의 나 · 판정 불일치 · 지터).',
      tags: ['tick budget', 'RTT', 'jitter', 'lag compensation'] },
    { path: 'tick-and-rtt-shorts/', vertical: true, mp4: 'out/tick-and-rtt-shorts.mp4', full: 'tick-and-rtt/', title: '세로 · 50ms와 RTT, 렉은 어디서 생길까?', length: '0:54',
      desc: '모바일용 세로 영상. 20Hz 틱 50ms를 넘으면 같은 존 전원이 늦고, RTT가 길면 나와 나를 보는 사람이 늦는다. 54초에.',
      tags: ['mobile', '9:16', 'tick budget', 'RTT'] },
    { path: 'boss-lag/', mp4: 'out/boss-lag.mp4', title: '보스가 뜨면 왜 렉이 걸릴까?', length: '1:22',
      desc: '인원이 몰리면 브로드캐스트 갱신이 N×(N−1)로 늘고, 시야 반경이 2배면 보이는 인원이 약 4배가 되는 이유. 광역기 · 이펙트 · AI 부하, 서버 · 망 · 클라에서 터지는 지점과 대응.',
      tags: ['broadcast N²', 'AOI', 'view radius', 'boss fight'] },
    { path: 'boss-lag-shorts/', vertical: true, mp4: 'out/boss-lag-shorts.mp4', full: 'boss-lag/', title: '세로 · 보스가 뜨면 왜 렉이 걸릴까?', length: '0:50',
      desc: '모바일용 세로 영상. 인원이 10배로 몰리면 갱신은 약 100배, 시야가 2배면 보이는 인원은 약 4배. 게임이 줄이는 방법까지 50초에.',
      tags: ['mobile', '9:16', 'broadcast'] },
    { path: 'slow-client/', mp4: 'out/slow-client.mp4', title: '클라가 느리면 서버도 느려진다', length: '1:49',
      desc: '보스전에 받을 양은 늘고 클라 처리는 떨어진다. 클라 수신 큐 → 소켓 정체 → Zero Window → 서버 송신 큐로 압력이 올라오는 과정, 상한 전에도 서버가 느려지는 이유, 안전장치로서의 큐 상한, 클라 · 서버 쪽 해결 방법과 인프라 확인법.',
      tags: ['boss fight', 'receive queue', 'zero window', 'send queue'] },
    { path: 'slow-client-shorts/', vertical: true, mp4: 'out/slow-client-shorts.mp4', full: 'slow-client/', title: '세로 · 클라가 느리면 서버도 느려진다', length: '0:56',
      desc: '모바일용 세로 영상. 보스전에 클라 처리가 밀리면 Zero Window를 거쳐 서버 송신 큐가 찬다. 송신 큐 상한과 클라 · 서버 양쪽 해결법을 56초에.',
      tags: ['mobile', '9:16', 'zero window'] },
    { path: 'one-byte/', mp4: 'out/one-byte.mp4', title: '이동 패킷, 바이트를 줄이면 무슨 일이?', length: '1:37',
      desc: '같은 이동 정보가 프로토버퍼 34B · 커스텀 24B · 비트 패킹 19B · 극단 양자화 8B. 1바이트 = 월 6.5TB가 되는 곱하기, 크기별 송신 트래픽 · 비용 · 서버 대수 · 보스존 수용, 패킷 하나에 담기는 인원, 그리고 프로토버퍼는 이동만 bytes로.',
      tags: ['bandwidth', 'quantization', 'protobuf', 'cost'] },
    { path: 'one-byte-shorts/', vertical: true, mp4: 'out/one-byte-shorts.mp4', full: 'one-byte/', title: '세로 · 이동 패킷, 바이트를 줄이면 무슨 일이?', length: '0:54',
      desc: '모바일용 세로 영상. 같은 이동 정보가 34/24/19/8B. 1바이트에 곱이 붙으면 월 6.5TB, 34B → 8B면 월 −168TB. 프로토버퍼와의 비교까지 54초에.',
      tags: ['mobile', '9:16', 'packet size', 'bandwidth'] },
    { path: 'ue-client-threads/', mp4: 'out/ue-client-threads.mp4', title: '언리얼 클라의 스레드와 렉', length: '1:52',
      desc: '게임 · 렌더 · GPU 스레드와 자체 소켓 모듈의 리시브 · 센드 스레드, 클라의 프레임 = 게임 스레드 한 틱(FPS와 서버 틱 처리 시간의 관계). 받은 패킷이 다음 틱까지 기다리는 이유, 내 FPS가 남들 화면의 내 움직임을 끊기게 하는 이유, FPS에 따른 화면 지연, 보스전 GPU 대기, GC · 동기 로딩 히치와 줄이는 방법.',
      tags: ['unreal', 'game thread', 'recv thread', 'frame'] },
    { path: 'ue-client-threads-shorts/', vertical: true, mp4: 'out/ue-client-threads-shorts.mp4', full: 'ue-client-threads/', title: '세로 · 언리얼 클라의 스레드와 FPS', length: '0:56',
      desc: '모바일용 세로 영상. 리시브 · 게임 · 렌더 · GPU 스레드, 받은 패킷이 다음 틱에 적용되는 흐름, FPS가 떨어지면 도착에서 화면까지 늦어지는 이유를 56초에.',
      tags: ['mobile', '9:16', 'game thread', 'FPS'] },
    { path: 'nagle-nodelay/', mp4: 'out/nagle-nodelay.mp4', title: 'Nagle과 TCP_NODELAY', length: '1:41',
      desc: '작은 이동 · 스킬 패킷이 Nagle과 Delayed ACK 때문에 수십 ms 늦게 나가는 이유, 손실 시 dup ACK가 안 생겨 빠른 재전송 대신 RTO(200 ms+)를 기다리는 문제, TCP_NODELAY와 틱 배칭, 서버에서 볼 지표.',
      tags: ['nagle', 'delayed ack', 'TCP_NODELAY', 'retransmission'] },
    { path: 'nagle-nodelay-shorts/', vertical: true, mp4: 'out/nagle-nodelay-shorts.mp4', full: 'nagle-nodelay/', title: '세로 · Nagle과 TCP_NODELAY', length: '0:56',
      desc: '모바일용 세로 영상. Nagle이 작은 스킬 패킷을 ACK까지 붙잡고, delayed ACK와 겹치면 더 늦고, 손실 시 RTO까지 기다린다. TCP_NODELAY + 틱 배칭을 56초에.',
      tags: ['mobile', '9:16', 'Nagle', 'TCP_NODELAY'] },
  ];
  const list = document.getElementById('list');
  for (const v of VIDEOS) {
    const li = document.createElement('li');
    li.innerHTML = `<a class="card${v.vertical ? ' v' : ''}" href="${v.path}">
      <div class="poster"><iframe src="${v.path}#poster" title="${v.title}" loading="lazy" tabindex="-1"></iframe></div>
      <div class="meta"><h2></h2><p></p><div class="tags"><span class="len">${v.length}</span>${v.tags.map(t => `<span>${t}</span>`).join('')}</div></div></a>`;
    const links = document.createElement('div'); links.className = 'links';
    links.innerHTML = v.vertical
      ? `<a href="${v.path}">▶ 세로 영상 보기</a><a href="${v.mp4}">MP4 받기</a><a href="${v.full}">전체 영상</a>`
      : `<a href="${v.path}">▶ 영상 보기</a><a href="${v.path}article.html">설명</a><a href="${v.path}terms.html">용어집</a><a href="${v.mp4}">MP4 받기</a>`;
    li.appendChild(links);
    li.querySelector('h2').textContent = v.title;
    li.querySelector('p').textContent = v.desc;
    list.appendChild(li);
  }
</script>
</body>
</html>
