<script type="module">
// ─────────────────────────────────────────────────────────────
//  Server Tick Inside — 분해해 들어가기 (open it up), vertical ~20 s cut of ../server-tick-inside-wide/ (same engine and scene).
//  Rack → one 1U game server → CPU → the game-server process (threads) → Zone A's thread timeline (ticks)
//  → the AOI step of one tick (the zone's players) → back out. Facts, numbers and chapter timing follow ../server-tick/.

//  Each level is modelled in its own units and nested in its parent; every frame the world is re-rooted on the camera's

// ─────────────────────────────────────────────────────────────

import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

const W = 1080, H = 1920, DURATION = 21;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';
// Roles: io = I/O threads · msg = message queue / message step · world = logic thread / world step · aoi = AOI step

const C = {
  bg: '#0d1117', panel: '#141a23', line: '#283142', text: '#e6eaf0', dim: '#8b95a7', faint: '#566074',
  io: '#4fc3f7', msg: '#ffa94d', world: '#ffd43b', aoi: '#b197fc', send: '#63e6be', db: '#f783ac', red: '#ff4d4f',
  client: '#d0d8e4', idle: '#39414f', budget: '#dfe6ee',

// ── math / easing ────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const ss = u => u * u * u * (u * (u * 6 - 15) + 10);

const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const fmt = n => Math.round(n).toLocaleString('en-US');

// ── story numbers (same as ../server-tick) ───────────────────
const STAGES = [['메시지', 10, C.msg, '메시지 처리', '큐에 쌓인 클라 요청을 순서대로 꺼내 실행'], ['월드', 14, C.world, '월드 업데이트', 'AI · 이동 · 전투 · 버프 · 타이머'],
  ['AOI', 8, C.aoi, 'AOI 계산', '누가 누구를 보는지 (시야 그리드)'], ['송신', 6, C.send, '브로드캐스트', '변화를 주변 플레이어에게 보낼 패킷 생성'], ['대기', 12, C.idle, '대기', '남은 예산만큼 쉼 → 다음 틱']];

const tickMs = s => s < 3 ? 32 + 4 * Math.sin(s * 9) : Math.min(175, 32 + (s - 3) * 22 + 6 * Math.sin(s * 7));

// ── timeline ─────────────────────────────────────────────────
const HEAD = [[3.2, 7.5, '01', '스레드 구조'], [7.5, 12.5, '02', '틱 루프'], [12.5, 17.5, '03', '큐가 밀릴 때']];
const END = 17.5;
// hardware / process build states
const SLIDE = t => eio(p(t, 1.5, 1.4)) * (1 - eio(p(t, 78.2, 1.2)));
const LIDK = t => eio(p(t, 2.4, 1.0)) * (1 - eio(p(t, 77.9, .6)));
const SINKK = t => eio(p(t, 3.1, .9)) * (1 - eio(p(t, 77.6, .6)));
const PROC = t => eio(p(t, 4.1, 1.0)) * (1 - eio(p(t, 77.0, .7)));
const HWK = t => 1 - .85 * eio(p(t, 4.9, 1.1)) * (1 - eio(p(t, 76.3, 1.0)));      // hardware fades as we enter the process
const BUILD = (t, i) => t > 20 ? (t > 76.8 ? 1 : 1) : eo(p(t, 5.2 + i * .3, .6));      // 01 builds the modules in order
const STALL = [52.6, 55.6, 58.6, 61.6, 64.7];                                             // 05: four states, 3 s each

// ── three.js setup ───────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
const ANISO = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);
scene.fog = new THREE.Fog(C.bg, 10, 100);
const camera = new THREE.PerspectiveCamera(35, W / H, .1, 1000);
scene.add(camera);
const hemi = new THREE.HemisphereLight('#dce4ef', '#161b23', 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 2.0);
scene.add(sun, sun.target);
const LDIR = V3(-.45, 1, .6).normalize();
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .5, .5, .8);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ── builders ─────────────────────────────────────────────────
function canvasTex(w, h, draw, { rep = [1, 1], srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const tx = new THREE.CanvasTexture(c);
  if (srgb) tx.colorSpace = THREE.SRGBColorSpace;
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(rep[0], rep[1]); tx.anisotropy = ANISO;

}
function boxAO(w, h, d, lo = .5) {           // vertical gradient in vertex colours = cheap ambient occlusion
  const g = new THREE.BoxGeometry(w, h, d); const pos = g.attributes.position; const col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) { const k = lo + (1 - lo) * Math.pow(clamp((pos.getY(i) + h / 2) / h), .7); col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = k; }

}
// per-level material registry so a whole level can be dimmed (k = 0..1) without touching its meshes
const MATS = [[], [], [], []], DIMK = [1, 1, 1, 1];
function reg(L, m) { m.userData.base = m.color.clone(); m.userData.op = m.opacity; if (m.emissive) m.userData.emi = m.emissive.clone(); MATS[L].push(m); return m; }
function dimLevel(L, k) {
  if (Math.abs(k - DIMK[L]) < 1e-4) return; DIMK[L] = k; k = Math.pow(k, 2.2);      // colours are linear: dim perceptually
  for (const m of MATS[L]) { m.color.copy(m.userData.base).multiplyScalar(k); if (m.userData.emi) m.emissive.copy(m.userData.emi).multiplyScalar(k); if (m.userData.fadeOp) m.opacity = m.userData.op * k; }
}
const M = (L, color, o = {}) => reg(L, new THREE.MeshStandardMaterial({ color, roughness: .62, metalness: .15, vertexColors: true, ...o }));
const MP = (L, color, o = {}) => reg(L, new THREE.MeshStandardMaterial({ color, roughness: .62, metalness: .15, ...o }));
// lit material whose instance / vertex colour also glows a little (profiler blocks read as lit-from-within)
function glowMat(L, k = .35, o = {}) {
  const m = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: .5, metalness: .05, ...o });
  m.userData.emiK = { value: k };
  m.onBeforeCompile = sh => { sh.uniforms.emiK = m.userData.emiK; sh.fragmentShader = 'uniform float emiK;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n\ttotalEmissiveRadiance += diffuseColor.rgb * emiK;'); };
  return reg(L, m);
}
const basic = (L, color, o = {}) => reg(L, new THREE.MeshBasicMaterial({ color, ...o }));
function mesh(parent, geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; }
function box(parent, w, h, d, x, y, z, mat, lo = .6) { return mesh(parent, boxAO(w, h, d, lo), mat, x, y, z); }
const _o = new THREE.Object3D(), _c = new THREE.Color();
function inst(parent, geo, mat, list, colors) {
  const im = new THREE.InstancedMesh(geo, mat, Math.max(1, list.length));
  list.forEach((it, i) => {
    _o.position.set(it[0], it[1], it[2]); _o.rotation.set(it[6] || 0, it[7] || 0, it[8] || 0);
    _o.scale.set(it[3] ?? 1, it[4] ?? 1, it[5] ?? 1); _o.updateMatrix(); im.setMatrixAt(i, _o.matrix);
    if (colors) im.setColorAt(i, _c.set(colors[i]));

  im.count = list.length; im.frustumCulled = false; parent.add(im); return im;
}
function dynInst(parent, geo, mat, n) {        // instanced mesh rewritten every frame (count set per frame)
  const im = new THREE.InstancedMesh(geo, mat, n);
  for (let i = 0; i < n; i++) { im.setMatrixAt(i, new THREE.Matrix4()); im.setColorAt(i, _c.set('#ffffff')); }
  im.count = 0; im.frustumCulled = false; parent.add(im); return im;
}
function setI(im, i, x, y, z, sx, sy, sz, col, ry = 0) {
  _o.position.set(x, y, z); _o.rotation.set(0, ry, 0); _o.scale.set(Math.max(1e-4, sx), Math.max(1e-4, sy), Math.max(1e-4, sz)); _o.updateMatrix();
  im.setMatrixAt(i, _o.matrix); if (col !== undefined) im.setColorAt(i, typeof col === 'string' ? _c.set(col) : col);
}
function done(im, n) { im.count = n; im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true; }
function edges(parent, geo, color, op = .8, L = 1) {
  const m = reg(L, new THREE.LineBasicMaterial({ color, transparent: true, opacity: op }));
  m.userData.fadeOp = true;
  const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo), m); parent.add(l); return l;
}
// unit block with its origin at the min-x end, bottom face, centred in z (profiler block: x = start ms, len = duration)
const UNIT = new THREE.BoxGeometry(1, 1, 1); UNIT.translate(.5, .5, 0);
const UNITC = new THREE.BoxGeometry(1, 1, 1);

// ── levels: each one in its own units, nested in its parent ──
const LV = [];
function compose(pos, rot, s) { return new THREE.Matrix4().compose(V3(...pos), new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)), V3(s, s, s)); }
function level(name, unit, parent, local) { const g = new THREE.Group(); g.matrixAutoUpdate = false; scene.add(g); const L = { name, unit, parent, local, g }; LV.push(L); return L; }

// L0 · hardware, 1 unit = 1 cm. Racks stand on y = 0, front faces at z = 0.
const Uy = u => 8 + (u - 1) * 4.445;
const TU = 22, YU = Uy(TU), CPUX = -10, CPUZ = -38, SPREAD_TOP = 1.38;
const SRV_Z = t => -1 + 55 * SLIDE(t);
const S1 = .018, S2 = .2, S3 = .07;
const L0 = level('hw', .01, -1, () => new THREE.Matrix4());
// L1 · the game-server process, 1 unit = 0.18 mm (drawn on top of CPU 0; the slab top is y = 0)
const L1 = level('proc', .01 * S1, 0, t => compose([CPUX, YU + SPREAD_TOP + 2.6 * S1, SRV_Z(t) + CPUZ], [0, 0, 0], S1));
// L2 · thread timelines, 1 unit = 1 ms along x; lies on the trace strip of Zone A's tile
const ZA = { x0: -25, z: -30, top: 3.05 };
const L2 = level('trace', .01 * S1 * S2, 1, () => compose([ZA.x0, ZA.top, ZA.z], [0, 0, 0], S2));
// L3 · the zone's players, inside the AOI block of tick N (AOI runs 24–32 ms)
const L3 = level('aoi', .01 * S1 * S2 * S3, 2, () => compose([28, .35, 0], [0, 0, 0], S3));

// ═════ L0 · HARDWARE ════════════════════════════════════════
const srv = new THREE.Group(); L0.g.add(srv);
const LID = new THREE.Group(), SINKS = [];
let lidMat, sinkMats = [];
{
  const g = L0.g;
  const floorTex = canvasTex(128, 128, (c, w, h) => { c.fillStyle = '#20242a'; c.fillRect(0, 0, w, h); c.fillStyle = '#171a1f'; c.fillRect(0, 0, w, 3); c.fillRect(0, 0, 3, h); }, { rep: [3000 / 60, 3000 / 60] });
  const floor = mesh(g, new THREE.PlaneGeometry(3000, 3000), MP(0, '#ffffff', { map: floorTex, roughness: .85 }), 0, 0, 200); floor.rotation.x = -Math.PI / 2;
  // server front panel: drive bays, vents, two LEDs (emissive)
  const r = rng(4);
  const front = (led) => canvasTex(512, 52, (c, w, h) => {
    c.fillStyle = led ? '#000' : '#3d424a'; c.fillRect(0, 0, w, h);

    const w = storyT(tt), ms = w >= 28 && w < 40 ? tickMs(w - 28) : 34 + 3 * Math.sin(tt * 9.1) + 2 * Math.sin(tt * 3.7);
    const h = Math.min(40, ms * k), played = tt <= t;
    ctx.fillStyle = played ? (ms > 50 ? C.red : '#9aa6b8') : '#273040';
    ctx.fillRect(x0 + i * bw, y - h, Math.max(1, bw - 1.2), h);
  }
  ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(223,230,238,.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0, y - 50 * k); ctx.lineTo(x1, y - 50 * k); ctx.stroke(); ctx.setLineDash([]);
  txt('50ms', x1, y - 50 * k - 8, { size: 22, mono: true, color: C.dim, align: 'right' });
  ctx.restore();
}
// two-line caption (y 1500–1640)
function vCaption(t, t0, t1, l1, l2) {
  const a = win(t, t0, t1, .4); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, 1380, 0, 1700); g.addColorStop(0, 'rgba(13,17,23,0)'); g.addColorStop(.35, 'rgba(13,17,23,.9)'); g.addColorStop(1, 'rgba(13,17,23,.9)'); ctx.fillStyle = g; ctx.fillRect(0, 1380, W, 320);
  if (Array.isArray(l1)) runs(l1, W / 2, 1548, 54, 800, { align: 'center' }); else txt(l1, W / 2, 1548, { size: 54, weight: 800, align: 'center' });
  if (l2) { const k2 = eo(p(t, t0 + .5, .5)); txt(l2, W / 2, 1618, { size: 42, color: C.dim, align: 'center', alpha: k2 }); }
  ctx.restore();
}

function vIntro(t) {
  const a = win(t, 0, 3.0, .5); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, 0, 0, 760); g.addColorStop(0, 'rgba(13,17,23,.95)'); g.addColorStop(1, 'rgba(13,17,23,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 760);
  const k1 = eo(p(t, .15, .7)), k2 = eo(p(t, .5, .7)), k3 = eo(p(t, 1.0, .7));
  txt('서버 안의', VX, 300 + (1 - k1) * 30, { size: 104, weight: 800, alpha: k1 });
  txt('50ms', VX - 6, 460 + (1 - k1) * 30, { size: 170, weight: 800, mono: true, color: C.world, alpha: k1 });
  ctx.save(); ctx.globalAlpha *= k1; ctx.setLineDash([12, 9]); ctx.strokeStyle = C.world; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(VX, 496); ctx.lineTo(VX + tw('50ms', 170, 800, true) * eio(p(t, .5, 1)), 496); ctx.stroke(); ctx.restore();
  txt('무슨 일이 일어날까?', VX, 600 + (1 - k2) * 30, { size: 64, weight: 800, alpha: k2 });
  txt('게임서버 한 대를 열고 틱 하나까지', VX, 670, { size: 40, color: C.dim, alpha: k3 });
  ctx.restore();
}
function v01(t) {
  const a = win(t, 3.6, 7.2, .4); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const kb = i => eo(p(t, 3.7 + i * .35, .45));
  const o = { dx: -28, dy: 0, size: 36, subSize: 30, align: 'right', lead: false };
  tag(1, [COL.io, 4, 92], 'I/O 스레드', '수신 · 복호화', C.io, kb(0), o);
  tag(1, [COL.q, 4, 92], '메시지 큐', '존마다 하나씩', C.msg, kb(1), o);
  tag(1, [COL.logic, 4, 92], '로직 스레드', '존당 1개 · 틱 루프', C.world, kb(2), o);
  tag(1, [COL.sq, 4, 92], '송신 큐', '직렬화 · 묶기', C.send, kb(3), o);
  tag(1, [COL.ios, 4, 92], 'I/O 송신', '암호화 · 전송', C.io, kb(4), o);
  ctx.restore();
  vCaption(t, 3.7, 7.3, '받고, 줄 세우고, 처리하고, 보낸다', '존 하나는 로직 스레드 하나가 순서대로 처리');
}
function v02(t) {
  const a = win(t, 7.9, 12.4, .4); if (a <= 0) return;
  const w = storyT(t), now = (w - 16 - .8) * 22;
  ctx.save(); ctx.globalAlpha = a;
  for (let n = 0; n < 3; n++) lab(2, [n * 50, 0, 16], 'Tick ' + (n ? 'N+' + n : 'N'), C.dim, 1, { size: 34, align: 'right', dx: -12, dy: 12 });
  let ms = 0;
  STAGES.forEach(([nm, d, col, title], i) => {
    const kk = eo(p(now, ms, 4));
    const q = lab(2, [ms + d / 2, 2.5, -16], title, i === 4 ? C.dim : col, kk, { size: 36, mono: false, dx: 18, dy: 12, weight: 800 });
    if (q) txt(d + 'ms', q.x + 18 + tw(title, 36, 800) + 14, q.y + 12, { size: 32, mono: true, weight: 700, color: C.dim, alpha: kk, shadow: true });
    ms += d;
  });
  lab(2, [50, 0, 16], '50ms 예산', C.budget, eo(p(now, 46, 6)), { size: 30, align: 'right', dx: -12, dy: 52 });
  ctx.restore();
  vCaption(t, 7.9, 12.5, [['로직 스레드는 ', C.text], ['50ms', C.world, true], ['마다 반복', C.text]], '남은 대기 시간이 0이 되면 다음 틱이 밀린다');
}
function v03(t) {
  const a = win(t, 12.9, 17.6, .4); if (a <= 0) return;
  const w = storyT(t), u = w - 28, depth = depthAt(clamp(u, 0, 10)), ms = tickMs(clamp(u, 0, 10)), hz = 1000 / Math.max(50, ms), over = u >= 3;
  ctx.save(); ctx.globalAlpha = a;
  const k = eo(p(t, 13.0, .5));
  tag(1, [COL.q - 12, 3, ZZ[0] + 6], '메시지 큐 (Zone A)', null, C.msg, k, { dx: -10, dy: 110, size: 34, align: 'center' });
  tag(1, [0, 33, -51], '틱 처리시간', null, C.world, k, { dx: 0, dy: -70, size: 34, align: 'center' });
  // numbers
  panel(VX, 1040, VW, 330, k);
  txt('큐 깊이', VX + 36, 1100, { size: 34, weight: 700, color: C.dim, alpha: k });
  txt(fmt(depth) + '개', VX + VW - 36, 1124, { size: 92, weight: 800, mono: true, color: over ? C.red : C.msg, align: 'right', alpha: k });
  chip(over ? '유입 1,420/s' : '유입 800/s', VX + 36, 1168, over ? C.red : C.io, { size: 30, alpha: k });
  chip('처리 1,000/s', VX + 310, 1168, C.world, { size: 30, alpha: k });
  txt('틱 처리시간', VX + 36, 1250, { size: 34, weight: 700, color: C.dim, alpha: k });
  txt(Math.round(ms) + 'ms', VX + VW - 36, 1300, { size: 120, weight: 800, mono: true, color: ms > 50 ? C.red : C.world, align: 'right', alpha: k });
  chip('틱레이트 ' + hz.toFixed(0) + 'Hz', VX + 36, 1330, hz < 18 ? C.red : C.send, { size: 30, alpha: k });
  ctx.restore();
  vCaption(t, 13.0, 17.6, '유입 > 처리 → 큐가 쌓이고 틱이 길어진다', 'DB · 락 · GC 대기도 틱을 같은 식으로 늘린다');
}
function vEnd(t) {
  const a = eo(p(t, END, .8)); if (a <= 0) return;
  ctx.fillStyle = `rgba(13,17,23,${.93 * a})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = a;
  const k1 = eo(p(t, END + .2, .7)), k2 = eo(p(t, END + .8, .7)), k3 = eo(p(t, END + 1.5, .7));
  txt('틱 길이는', W / 2, 640 + (1 - k1) * 24, { size: 96, weight: 800, align: 'center', alpha: k1 });
  runs([['단계 시간의 ', C.text], ['합이다.', C.red]], W / 2, 770 + (1 - k1) * 24, 96, 800, { align: 'center', alpha: k1 });
  // one-tick profile
  const x0 = VX + 20, x1 = VX + VW - 20, y = 900, h = 80, sc = (x1 - x0) / 50;
  let ms = 0;
  STAGES.forEach(([nm, d, col], i) => {
    const kk = eo(p(t, END + .8 + i * .12, .4)); if (kk <= 0) return;
    ctx.save(); ctx.globalAlpha *= kk; rr(x0 + ms * sc + 2, y, d * sc - 4, h, 6); ctx.fillStyle = i === 4 ? rgba(C.idle, .7) : col; ctx.fill(); ctx.restore();
    txt(nm, x0 + (ms + d / 2) * sc, y + h / 2 + 12, { size: d < 9 ? 28 : 34, weight: 800, color: i === 4 ? C.dim : '#0d1117', align: 'center', alpha: kk });
    txt(d + 'ms', x0 + (ms + d / 2) * sc, y + h + 46, { size: 30, mono: true, color: C.dim, align: 'center', alpha: kk });
    ms += d;
  });
  ctx.save(); ctx.globalAlpha *= k2; ctx.setLineDash([10, 8]); ctx.strokeStyle = C.budget; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x1, y - 30); ctx.lineTo(x1, y + h + 14); ctx.stroke(); ctx.restore();
  txt('50ms', x1, y - 44, { size: 32, weight: 700, mono: true, color: C.budget, align: 'right', alpha: k2 });
  txt('한 단계가 길어지면 예산을 넘고 다음 틱이 밀린다', W / 2, 1160, { size: 40, color: C.dim, align: 'center', alpha: k2 });
  txt('전체 영상', W / 2, 1330, { size: 36, weight: 700, color: C.text, align: 'center', alpha: k3 });
  txt('jungrok5.github.io/motion-graphics/', W / 2, 1385, { size: 32, mono: true, color: C.io, align: 'center', alpha: k3 });
  txt('server-tick-inside-wide', W / 2, 1430, { size: 32, mono: true, color: C.io, align: 'center', alpha: k3 });
  ctx.restore();
}

// ── frame ────────────────────────────────────────────────────
function renderAt(t) {
  t = clamp(t, 0, DURATION);
  const w = storyT(t);
  const c = camAt(t), R = c.R;
  LV.forEach((L, i) => { const vis = i >= R - 2 && i <= R + 1; L.g.visible = vis; if (vis) { L.g.matrix.copy(rel(R, i, w)); L.g.matrixWorldNeedsUpdate = true; } });
  REL = LV.map((_, i) => rel(R, i, w));
  L3.g.visible = false;
  if (R >= 2) L0.g.visible = false;
  if (w < 6.2) L2.g.visible = false;
  camera.fov = c.fov; camera.near = c.d * .02; camera.far = c.d * 60;
  camera.setViewOffset(W, H, c.ox, c.oy, W, H);
  camera.position.copy(c.T).addScaledVector(c.dir, c.d); camera.up.copy(c.up); camera.lookAt(c.T); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  animate(w, R);
  scene.fog.near = c.d * (R === 0 ? 2.2 : 1.6); scene.fog.far = c.d * (R === 0 ? 9 : 5.5);
  sun.target.position.copy(c.T); sun.position.copy(c.T).addScaledVector(LDIR, c.d * 4);
  hemi.intensity = R === 0 ? 2.4 : 1.25; sun.intensity = R === 0 ? 2.8 : 1.6;
  bloom.strength = R === 0 ? .55 : .45;
  composer.render();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  vignette();
  vIntro(t); v01(t); v02(t); v03(t);
  vHeaders(t); vStrip(t);
  vEnd(t);
  const fo = p(t, DURATION - .4, .4); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;
window.DURATION = DURATION;

window.ready = (async () => {
  const faces = [['Pretendard', 'Pretendard-Variable.woff2', '100 900'], ['JetBrains Mono', 'JetBrainsMono.woff2', '100 800']];
  for (const [family, file, weight] of faces) {
    for (const base of ['assets/fonts/', '../assets/fonts/']) {
      try { document.fonts.add(await new FontFace(family, `url(${base}${file})`, { weight }).load()); break; } catch (e) { /* try next */ }
    }
  }
  await document.fonts.ready;
  renderAt(0);
})();
// ── player (skipped when ?render) ────────────────────────────
if (!location.search.includes('render')) {
  const $ = id => document.getElementById(id);
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    replay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>',
  };
  const CHAPTERS = [[0, '', '인트로'], ...HEAD.map(h => [h[0], h[2], h[3]]), [END, '', '정리']];
  $('scrub').setAttribute('aria-valuemax', Math.round(DURATION));
  const POSTER = 10.5;
  let t = 0, playing = false, started = false, last = 0;
  const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

  CHAPTERS.forEach(([s, n, label], i) => {
    const b = document.createElement('button');
    b.innerHTML = (n ? `<span>${n}</span>` : '') + label;
    b.addEventListener('click', () => { seek(s + .01); play(); });
    $('chapters').appendChild(b);
    if (i) { const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (s / DURATION * 100) + '%'; $('ticks').appendChild(tk); }
  });

  function ui() {
    const k = t / DURATION, ended = t >= DURATION;
    $('fill').style.width = k * 100 + '%'; $('knob').style.left = k * 100 + '%';
    $('time').textContent = `${mmss(t)} / ${mmss(DURATION)}`;
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
    $('play').innerHTML = playing ? ICON.pause : ended ? ICON.replay : ICON.play;
    $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
    $('big').hidden = playing;
    $('big').innerHTML = ended ? ICON.replay : ICON.play;
    $('big').classList.toggle('replay', ended);
    let cur = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) cur = i; });
    [...$('chapters').children].forEach((b, i) => b.setAttribute('aria-current', i === cur && started));
  }
  function draw() { renderAt(started ? Math.min(t, DURATION - .001) : POSTER); }
  function play() { if (t >= DURATION) t = 0; started = true; playing = true; last = performance.now(); ui(); }
  function pause() { playing = false; ui(); }
  function toggle() { playing ? pause() : play(); }
  function seek(x) { started = true; t = clamp(x, 0, DURATION); draw(); ui(); }

  function frame(now) {
    if (playing) {
      t += (now - last) / 1000 * rate; last = now;
      if (t >= DURATION) { t = DURATION; playing = false; }
      draw(); ui();
    }
    requestAnimationFrame(frame);
  }

  const RATES = [1, .75, .5];
  let rate = 1;
  try { rate = +localStorage.getItem('mg-rate') || 1; } catch (e) { /* storage unavailable */ }
  if (!RATES.includes(rate)) rate = 1;
  function setRate(r) {
    rate = r; $('rate').textContent = r + '×'; $('rate').setAttribute('aria-label', `재생 속도 ${r}배`);
    try { localStorage.setItem('mg-rate', String(r)); } catch (e) { /* storage unavailable */ }
  }
  setRate(rate);
  $('rate').addEventListener('click', () => setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]));
  $('stage').addEventListener('click', toggle);
  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {
    const el = $('stage');
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
  });
  const scrub = $('scrub');
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
    else if (e.key === ',' || e.key === '<') setRate(RATES[Math.min(RATES.length - 1, RATES.indexOf(rate) + 1)]);
    else if (e.key === '.' || e.key === '>') setRate(RATES[Math.max(0, RATES.indexOf(rate) - 1)]);
  });

  const posterMode = location.hash === '#poster';
  if (posterMode) document.body.classList.add('poster');
  ui();
  // chapter deep link: index.html#ch03 opens paused at that chapter
  const deep = /^#ch(\d\d)$/.exec(location.hash), deepHead = deep && HEAD.find(r => r[2] === deep[1]);
  window.ready.then(() => {
    draw(); requestAnimationFrame(frame);
    if (deepHead) seek(deepHead[0] + .01);
    if (posterMode) { play(); setInterval(() => { if (!playing) { t = 0; play(); } }, 500); }
  });
}
</script>
