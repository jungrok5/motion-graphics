<style>
  /* Layout: one 16:9 stage, a slim transport bar under it, chapter chips below. Single dark look. */
  :root {
    --bg: #070a13; --surface: #0e1424; --line: #24304a; --fg: #e8ecf4; --dim: #8b95a7;
    --accent: #a78bfa; --live: #34d399; --text2: #c3cad8;
    --sans: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; overflow-x: hidden; }
  .player { width: min(100%, calc((100vh - 170px) * 16 / 9)); min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .big { position: absolute; inset: auto 0 5% 0; margin: 0 auto; width: clamp(44px, 11%, 84px); height: auto; aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--accent);
    background: rgba(14,20,36,.78); color: var(--fg); display: grid; place-items: center; cursor: pointer; transition: transform .15s, opacity .2s; }
  .big[hidden] { display: none; }
  .big:hover { transform: scale(1.06); }
  .big svg { width: 36%; height: 36%; margin-left: 6%; }
  .big.replay svg { margin-left: 0; }
  .bar { display: flex; align-items: center; gap: 14px; }
  .btn { flex: none; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--fg); display: grid; place-items: center; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn svg { width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .time { flex: none; font: 500 13px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .scrub { position: relative; flex: 1; min-width: 0; height: 28px; cursor: pointer; touch-action: none; }

  .tick { position: absolute; top: 8px; width: 2px; height: 12px; background: var(--dim); opacity: .6; }
  .knob { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 4px rgba(167,139,250,.25); }
  .chapters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chapters button { font: 600 13px/1 var(--sans); color: var(--dim); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; cursor: pointer; }
  .chapters button span { font-family: var(--mono); color: var(--accent); margin-right: 6px; }
  .chapters button:hover { color: var(--fg); }
  .chapters button[aria-current="true"] { color: var(--fg); border-color: var(--accent); background: rgba(167,139,250,.12); }
  .hint { font-size: 12px; color: var(--dim); margin-left: auto; }
  @media (max-width: 600px) { .hint { display: none; } .time { font-size: 12px; } }
  .set { display: flex; flex-wrap: wrap; gap: 8px; }

  body.poster .set { display: none; }

  /* Notes under the player: chapter-by-chapter explanation + glossary */

  .notes p, .notes li { color: var(--text2); }
  .notes ul { padding-left: 1.2em; }
  .notes article { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 24px; }
  .notes h3 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 18px; line-height: 1.4; margin: 0 0 8px; }
  .notes h3 .n { font: 600 13px/1 var(--mono); color: var(--accent); }
  .notes h3 button { margin-left: auto; font: 600 12px/1 var(--sans); color: var(--dim); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 10px; cursor: pointer; }

  .notes .terms { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: 12px 24px; margin: 0; }

  @media (max-width: 600px) { .notes .terms { grid-template-columns: minmax(0, 1fr); gap: 2px; } .notes dd { margin-bottom: 14px; } }
  /* #poster: embed mode for gallery thumbnails — canvas only, loops */
  body.poster { padding: 0; }
  body.poster .player { width: 100%; }
  body.poster .bar, body.poster .chapters, body.poster .big, body.poster .notes { display: none; }
  body.poster .stage { border: 0; border-radius: 0; }

<script type="module">
// ─────────────────────────────────────────────────────────────
//  내 스킬 하나가 상대 화면에 뜨기까지 — style B: 3D grid world + glass panels (16:9 PC cut)
//  Landscape recomposition of ../skill-journey-glass/: same beats, timing and copy; the camera frames
//  the current panel plus the next one so the packet visibly travels between them.
//  three.js renders offscreen; header/captions/end card are drawn on #c in 2D.
//  Every frame is a pure function of time: renderAt(t). No frame-to-frame state.
//  Facts follow ../skill-journey/index.html (예시: 20Hz · RTT 50ms, 합계 ~221ms).
// ─────────────────────────────────────────────────────────────
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1920, H = 1080, DURATION = 21.5;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';

// ── math / easing ────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const win = (t, s, e, f = .45) => Math.min(eo(p(t, s, f)), 1 - eio(p(t, e - f, f)));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

// ── timeline ─────────────────────────────────────────────────
// [start, end, number, chapter label, header tag, caption line 1, caption line 2]
const HEAD = [
  [0.0, 4.2, '01', '내 클라', 'CLIENT', '스킬을 누르면', '패킷이 만들어지고'],
  [4.2, 8.2, '02', '네트워크', 'UPLINK', '여러 장비를 지나', '서버에 닿고'],
  [8.2, 12.2, '03', '게임 서버', 'SERVER', '서버 틱에서', '판정되고'],
  [12.2, 16.2, '04', '상대 클라', 'REMOTE', '상대 화면에는', '약 221ms 뒤에 보인다'],
  [16.2, 18.9, '05', '주변 플레이어', 'ZONE', '주변 플레이어 32명에게', '같은 알림이 간다'],
];
const END = 18.9;

// running total (ms) — example budget from skill-journey: 10 · 25 · 25 · 12 · 25 · 8 · 100 · 16 = 221
const MS_KEYS = [
  [0, 0], [2.6, 0], [3.2, 10],                                        // 입력 · 처리 10
  [5.0, 10], [5.4, 12], [5.8, 18], [6.2, 26], [6.6, 33], [7.0, 34], [7.4, 35], // 업링크 hops: 2 8 16 23 24 25
  [8.9, 35], [9.9, 60], [10.1, 60], [10.9, 72],                       // 틱 대기 25 · 틱 처리 12
  [12.6, 72], [13.1, 97], [13.25, 97], [13.55, 105], [13.65, 105], [15.0, 205], [15.1, 205], [15.5, 221],
];
function msAt(t) {
  if (t <= MS_KEYS[0][0]) return 0;
  for (let i = 1; i < MS_KEYS.length; i++) {
    const [t1, v1] = MS_KEYS[i], [t0, v0] = MS_KEYS[i - 1];
    if (t <= t1) return lerp(v0, v1, (t - t0) / (t1 - t0 || 1));
  }
  return 221;
}

// ── three.js setup ───────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const BG = new THREE.Color('#040713');
scene.background = BG;
scene.fog = new THREE.Fog(0x050a1c, 30, 120);
const camera = new THREE.PerspectiveCamera(50, W / H, .1, 400);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .55, .4, .88);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// sky dome: deep navy with an indigo horizon glow
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec3 vP; void main(){ float h = vP.y; vec3 top = vec3(.0008,.001,.004); vec3 hor = vec3(.005,.007,.03);
    vec3 c = mix(hor, top, smoothstep(-.02, .45, h)); c += vec3(.008,.012,.05) * exp(-abs(h) * 14.); gl_FragColor = vec4(c,1.); }`,
}));
scene.add(sky);

// floor: anti-aliased grid lines that fade with distance
const floorMat = new THREE.ShaderMaterial({
  transparent: false, depthWrite: true, fog: false,
  uniforms: { uCam: { value: new THREE.Vector3() }, uGlow: { value: new THREE.Vector3(0, 0, 0) } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `varying vec3 vW; uniform vec3 uCam; uniform vec3 uGlow;
    float grid(vec2 c){ vec2 g = abs(fract(c - .5) - .5) / fwidth(c); return 1. - min(min(g.x, g.y), 1.); }
    void main(){
      float d = length(vW.xz - uCam.xz);
      float fade = exp(-d * .028);
      float minor = grid(vW.xz / 1.2) * .55;
      float major = grid(vW.xz / 6.0);
      vec3 base = vec3(.0012,.0018,.007);
      vec3 lc = vec3(.06,.11,.5);
      vec3 c = base + lc * (minor * .35 + major * .9) * fade;
      float pool = exp(-length(vW.xz - uGlow.xy) * .16) * uGlow.z;
      c += vec3(.02,.035,.14) * pool;
      vec3 far = vec3(.005,.007,.03);
      c = mix(far, c, clamp(fade * 1.6, 0., 1.));
      gl_FragColor = vec4(c, 1.);
    }`,
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// ── glass panel canvases ─────────────────────────────────────
// 16:9: panels are squarer (1000×1100) with ~1.25× type so text stays readable when a panel fills ~70% of 1080.
const CW = 1000, CH = 1100, PH = 8.4, PW = PH * CW / CH, YAW = .22, GAP = 10.6;
const PANEL_Y = 4.7;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const COL = { white: '#f5f8ff', dim: 'rgba(205,218,255,0.78)', faint: 'rgba(190,205,255,0.50)', cyan: '#8fd3ff', green: '#4ade80',
  yellow: '#fde047', red: '#fb7185', pink: '#f472b6', line: 'rgba(200,215,255,0.22)' };

function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function gtxt(g, s, x, y, o = {}) {
  const { size = 34, weight = 500, color = COL.white, align = 'left', mono = false, alpha = 1, base = 'alphabetic' } = o;
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = `${weight} ${size}px ${mono ? MONO : SANS}`;
  g.fillStyle = color; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); g.restore();
}
function glassBase(g, w, h, tint = [70, 105, 255]) {
  g.clearRect(0, 0, w, h);
  const [r, gg, b] = tint;
  rrect(g, 4, 4, w - 8, h - 8, 34);
  const fill = g.createLinearGradient(0, 0, w * .6, h);
  fill.addColorStop(0, `rgba(${r + 30},${gg + 40},255,0.78)`);
  fill.addColorStop(.5, `rgba(${r},${gg},${b},0.66)`);
  fill.addColorStop(1, `rgba(${r - 30},${gg - 50},${b - 40},0.60)`);
  g.fillStyle = fill; g.fill();
  const sh = g.createLinearGradient(0, 0, w * .5, h * .45);
  sh.addColorStop(0, 'rgba(255,255,255,0.18)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sh; g.fill();
  const eg = g.createLinearGradient(0, 0, w, h);
  eg.addColorStop(0, 'rgba(225,235,255,0.95)'); eg.addColorStop(.55, 'rgba(160,190,255,0.55)'); eg.addColorStop(1, 'rgba(140,170,255,0.8)');
  g.lineWidth = 3; g.strokeStyle = eg; g.stroke();
  rrect(g, 12, 12, w - 24, h - 24, 28); g.lineWidth = 1.2; g.strokeStyle = 'rgba(255,255,255,0.10)'; g.stroke();
}
function check(g, x, y, k, col = COL.green) {   // filled circle with tick, k = 0..1
  g.save();
  if (k <= 0) { g.beginPath(); g.arc(x, y, 18, 0, 7); g.lineWidth = 3; g.strokeStyle = COL.faint; g.stroke(); g.restore(); return; }
  g.beginPath(); g.arc(x, y, 18 * (.6 + .4 * eo(k)), 0, 7); g.fillStyle = col; g.fill();
  g.beginPath(); g.moveTo(x - 8, y); g.lineTo(x - 2, y + 7); g.lineTo(x + 9, y - 7);
  g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0b1640'; g.globalAlpha = eo(k); g.stroke();
  g.restore();
}
function dotR(g, x, y, on) {   // row connector dot at the right edge
  g.save(); g.beginPath(); g.arc(x, y, on ? 10 : 8, 0, 7);
  if (on) { g.fillStyle = '#e8f3ff'; g.shadowColor = '#9fd3ff'; g.shadowBlur = 16; g.fill(); }
  else { g.lineWidth = 2.5; g.strokeStyle = COL.faint; g.stroke(); }
  g.restore();
}
const L = 60, RX = CW - 108, DX = CW - 56;   // left margin, right-aligned value x, connector dot x
function header(g, num, title, tag, meta) {
  gtxt(g, num, L, 132, { size: 88, weight: 800, color: COL.cyan });
  g.font = `800 88px ${SANS}`; const nw = g.measureText(num).width;
  gtxt(g, title, L + nw + 24, 132, { size: 80, weight: 800 });
  gtxt(g, tag, CW - L, 84, { size: 30, weight: 600, mono: true, align: 'right', color: COL.dim });
  meta.forEach(([k, v], i) => {
    gtxt(g, k, L + 2, 196 + i * 46, { size: 32, mono: true, color: COL.faint });
    gtxt(g, v, 230, 196 + i * 46, { size: 32, mono: true, color: COL.dim });
  });
  g.fillStyle = COL.line; g.fillRect(L - 4, 196 + meta.length * 46 - 10, CW - 2 * L + 8, 2);
}
function footer(g, left, ms) {
  const y = CH - 92;
  g.fillStyle = COL.line; g.fillRect(L - 4, y - 34, CW - 2 * L + 8, 2);
  gtxt(g, left, L + 2, y + 28, { size: 36, weight: 600, color: COL.dim });
  rrect(g, CW - 360, y - 12, 304, 66, 33); g.fillStyle = 'rgba(10,20,70,0.55)'; g.fill();
  g.lineWidth = 2; g.strokeStyle = 'rgba(160,200,255,0.5)'; g.stroke();
  gtxt(g, '누적', CW - 330, y + 32, { size: 32, weight: 600, color: COL.dim });
  gtxt(g, `${Math.round(ms)} ms`, CW - 82, y + 33, { size: 38, weight: 700, mono: true, align: 'right', color: COL.white });
}
// rows: y positions (canvas px) of the connector dots, per panel
const ROWS = [[], [], [], []];

// Panel 01 — 내 클라: UseSkillReq fields
const P1_FIELDS = [['seq', '입력 순번'], ['skill_id', '스킬 번호'], ['target_id', '대상'], ['pos', '내가 본 내 위치'], ['client_ms', '보낸 시각']];
const P1_ROWY = P1_FIELDS.map((_, i) => 398 + i * 74);
ROWS[0] = P1_ROWY.map(y => y - 14);
function drawP1(g, t) {
  const u = t - HEAD[0][0];
  glassBase(g, CW, CH);
  header(g, '01', '내 클라', 'CLIENT', [['loop', '60fps · 16ms 프레임'], ['msg', 'UseSkillReq']]);
  gtxt(g, 'message UseSkillReq {', L + 2, 324, { size: 34, mono: true, color: COL.cyan, weight: 600 });
  P1_FIELDS.forEach(([f, d], i) => {
    const y = P1_ROWY[i], k = p(u, .9 + i * .28, .3);
    if (k > 0 && k < 1 || (u > .9 + i * .28 && u < 1.2 + i * .28)) { rrect(g, 44, y - 52, CW - 88, 70, 12); g.fillStyle = `rgba(253,224,71,${.22 * (1 - k)})`; g.fill(); }
    check(g, 88, y - 14, k);
    gtxt(g, f, 132, y, { size: 42, mono: true, weight: 600, alpha: .55 + .45 * clamp(k * 2) });
    gtxt(g, d, RX, y, { size: 40, align: 'right', color: COL.dim });
    dotR(g, DX, y - 14, k >= 1);
  });
  gtxt(g, '}', L + 2, 398 + 5 * 74 - 18, { size: 34, mono: true, color: COL.cyan, weight: 600 });
  // prediction callout
  const kc = eo(p(u, 2.2, .5));
  if (kc > 0) {

    ctx.fillStyle = 'rgba(160,180,255,0.22)'; ctx.fillRect(64, 86, W - 128, 2);
    ctx.fillStyle = 'rgba(143,190,255,0.9)'; ctx.fillRect(64, 86, (W - 128) * clamp(t / END), 2);
    // running total chip, top-left (beats 1–4)
    const ka = win(t, .5, 16.6, .5);
    if (ka > 0) {
      ctx.save(); ctx.globalAlpha *= ka;
      ctx.beginPath(); ctx.roundRect(64, 108, 300, 72, 36); ctx.fillStyle = 'rgba(8,14,50,0.6)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(160,200,255,0.45)'; ctx.stroke();
      txt('누적', 96, 155, { size: 30, weight: 600, color: 'rgba(200,215,255,0.8)' });
      txt(`${Math.round(msAt(t))} ms`, 336, 158, { size: 42, weight: 800, mono: true, align: 'right' });
      ctx.restore();
    }
    // captions: bottom-centre, the source's two lines joined on one line, second half fading in after the first
    const grad = ctx.createLinearGradient(0, 840, 0, H);
    grad.addColorStop(0, 'rgba(3,5,16,0)'); grad.addColorStop(.5, 'rgba(3,5,16,0.55)'); grad.addColorStop(1, 'rgba(3,5,16,0.8)');
    ctx.fillStyle = grad; ctx.fillRect(0, 840, W, H - 840);
    HEAD.forEach(([s, e, , , , l1, l2]) => {
      const ca = win(t, s + .25, s === HEAD[4][0] ? END + .1 : e, .35); if (ca <= 0) return;
      const size = 60, gap = 22;
      ctx.font = `800 ${size}px ${SANS}`;
      const w1 = ctx.measureText(l1).width, w2 = ctx.measureText(l2).width, x0 = W / 2 - (w1 + gap + w2) / 2;
      [[l1, x0], [l2, x0 + w1 + gap]].forEach(([l, x], i) => {
        const k = eo(p(t, s + .25 + i * .3, .45));
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 18;
        txt(l, x, 1014 + (1 - k) * 14, { size, weight: 800, alpha: ca * k });
        ctx.restore();
      });
    });
    txt('* 수치는 예시 (20Hz · RTT 50ms)', W - 64, 1056, { size: 24, weight: 500, align: 'right', color: 'rgba(190,205,255,0.6)', alpha: win(t, .6, 4.2, .4) });
    ctx.restore();

}
function endCard(t) {
  const a = eio(p(t, END - .1, .7)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const bg = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, W * .6);
  bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#e3e8f3');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const k1 = eo(p(t, END + .4, .6)), k2 = eo(p(t, END + .65, .6)), k3 = eo(p(t, END + .9, .6)), k4 = eo(p(t, END + 1.15, .6));
  const cx = W / 2, cy = 330 + (1 - k1) * 30, s = 190;
  ctx.save(); ctx.globalAlpha = k1;
  ctx.shadowColor = 'rgba(70,90,255,0.45)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 16;
  const ig = ctx.createLinearGradient(cx - s / 2, cy - s / 2, cx + s / 2, cy + s / 2); ig.addColorStop(0, '#7c8cff'); ig.addColorStop(1, '#3b3fe0');
  ctx.beginPath(); ctx.roundRect(cx - s / 2, cy - s / 2, s, s, 52); ctx.fillStyle = ig; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy + 10, 50, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 14, cy - 58); ctx.lineTo(cx + 14, cy - 58); ctx.stroke();
  const ang = -Math.PI / 2 + eo(p(t, END + .5, 1.2)) * Math.PI * 2 * (221 / 300);
  ctx.beginPath(); ctx.moveTo(cx, cy + 10); ctx.lineTo(cx + Math.cos(ang) * 32, cy + 10 + Math.sin(ang) * 32); ctx.stroke();
  ctx.restore();
  txt('스킬 하나의 221ms', W / 2, 590 + (1 - k2) * 24, { size: 104, weight: 800, align: 'center', color: '#0b1024', alpha: k2 });
  txt('내 화면 ~25ms · 상대 화면 ~221ms', W / 2, 676 + (1 - k3) * 20, { size: 46, weight: 600, align: 'center', color: '#4a5372', alpha: k3 });
  ctx.save(); ctx.globalAlpha = k4;
  const url = 'jungrok5.github.io/motion-graphics/skill-journey';
  ctx.font = `600 30px ${SANS}`; const uw = ctx.measureText(url).width;
  ctx.fillStyle = 'rgba(80,90,200,0.4)'; ctx.fillRect(W / 2 - uw / 2 - 120, 789, 90, 2); ctx.fillRect(W / 2 + uw / 2 + 30, 789, 90, 2);
  ctx.restore();
  txt(url, W / 2, 800, { size: 30, weight: 600, align: 'center', color: '#4f55d8', alpha: k4 });
}

// ── frame ────────────────────────────────────────────────────
const LAST_DRAWN = new Map();   // cache only: redraw a canvas when its content key changes (content is still f(t))
function panelKey(i, t) { const s = HEAD[i][0] - 1; return t < s ? 's' : t > 16.3 ? 'e' : Math.round(t * 60); }
const keyTime = (i, key) => key === 's' ? 0 : key === 'e' ? 16.3 : key / 60;
function renderAt(t) {
  t = clamp(t, 0, DURATION);
  // panel contents
  panels.forEach((pn, i) => {
    const key = panelKey(i, t);
    if (LAST_DRAWN.get(i) !== key) { DRAW[i](pn.g, keyTime(i, key)); pn.tex.needsUpdate = true; LAST_DRAWN.set(i, key); }
  });
  { const key = t > 4.6 ? 'e' : Math.round(t * 60); if (LAST_DRAWN.get('code') !== key) { drawCode(codeG, key === 'e' ? 4.6 : key / 60); codeTex.needsUpdate = true; LAST_DRAWN.set('code', key); } }
  // panel presence: rise from the floor slightly at start, dim when out of focus, fade in finale
  const fin = eio(p(t, 16.3, 1.2));
  panels.forEach((pn, i) => {
    const k = eo(p(t, -.45 + i * .12, 1.0));
    pn.m.position.set(PANEL_POS[i].x, PANEL_POS[i].y - (1 - k) * 2, PANEL_POS[i].z);
    pn.mat.opacity = k * (1 - .35 * fin);
    pn.m.updateMatrixWorld();
  });
  // code card floats in front of panel 01, lower-right
  {
    const k = eo(p(t, .7, .6)) * (1 - eio(p(t, 2.0, .45)));
    const P = panelPt(0, CW + 400, CH * .5, 1.2 + (1 - k) * .5);
    codeMesh.position.copy(P); codeMesh.rotation.y = YAW - .08; codeMesh.material.opacity = k; codeMesh.visible = k > .01;
  }
  // camera
  const cam = camAt(t);
  camera.position.copy(cam.pos);
  camera.position.x += Math.sin(t * .7) * .12; camera.position.y += Math.sin(t * .53 + 1) * .08;
  camera.lookAt(cam.tgt);
  floorMat.uniforms.uCam.value.copy(camera.position);
  const fi = Math.min(3, chapterAt(t));
  floorMat.uniforms.uGlow.value.set(PANEL_POS[fi].x, PANEL_POS[fi].z, .9 * (1 - fin));
  // glow lines: fans from checked rows → convergence point
  const pos = lineGeo.attributes.position.array, col = lineGeo.attributes.color.array;
  let n = 0;
  const seg = (a, b, k, c, inten) => {
    const e = a.clone().lerp(b, k);
    pos.set([a.x, a.y, a.z, e.x, e.y, e.z], n * 6);
    col.set([c[0] * inten, c[1] * inten, c[2] * inten, c[0] * inten * 1.6, c[1] * inten * 1.6, c[2] * inten * 1.6], n * 6); n++;
  };
  const fanTimes = [P1_FIELDS.map((_, r) => 1.2 + r * .28), HOP_T, P3_T.map(x => x + .3)];
  fanTimes.forEach((ts, i) => {
    const out = 1 - eio(p(t, HEAD[i + 1][0] + 1.2, .8));
    ts.forEach((tt, r) => { const k = eo(p(t, tt, .5)) * out; if (k > 0) seg(rowDot(i, r), FAN[i], k, [.35, .6, 1], .9); });
  });
  // finale: broadcast lines to the 32 nearest cards
  const srcTop = new THREE.Vector3(SRC.x, PANEL_Y + PH / 2, SRC.z);
  near.forEach((ci, j) => {
    const c = cells[ci], k = eo(p(t, 16.9 + j * .025, .6)) * (1 - p(t, END - .2, .5));
    if (k > 0) seg(srcTop, new THREE.Vector3(c.x, 1.4, c.z), k, [.4, .75, 1], 1.3);
  });
  for (let j = n; j < MAXSEG; j++) { pos.fill(0, j * 6, j * 6 + 6); col.fill(0, j * 6, j * 6 + 6); }
  lineGeo.attributes.position.needsUpdate = true; lineGeo.attributes.color.needsUpdate = true;
  // field of cards
  cells.forEach((c, i) => {
    const k = eo(p(t, 16.4 + c.d * .018, .8));
    _s.set(1, Math.max(k, .0001), 1); _p.set(c.x, 0, c.z);
    _m4.compose(_p, _q, _s); cardsMesh.setMatrixAt(i, _m4);
    const lit = nearSet.has(i) ? eo(p(t, 17.3 + c.d * .02, .4)) : 0;
    const base = .32 * k;
    _c.setRGB(base + lit * 1.4, base + lit * 1.6, base + lit * 2.0); cardsMesh.setColorAt(i, _c);
  });
  cardsMesh.instanceMatrix.needsUpdate = true; cardsMesh.instanceColor.needsUpdate = true;
  cardsMesh.visible = t > 16.3;
  // packet + trail
  const pa = eo(p(t, 1.0, .3)) * (1 - p(t, 16.0, .4));
  sprites.forEach((s, i) => {
    const q = packetAt(t - i * .035);
    s.position.copy(q);
    const sz = (i ? .4 * (1 - i / TRAIL) : .7) * (1 + .1 * Math.sin(t * 9));
    s.scale.set(sz, sz, 1); s.material.opacity = pa * (i ? .55 * (1 - i / TRAIL) : 1); s.visible = pa > 0;
    s.material.color.setScalar(i ? 1.1 : 1.6);
  });
  dust.rotation.y = t * .01; dust.position.y = Math.sin(t * .3) * .2;
  composer.render();
  // composite
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  overlay(t);
  const fo = p(t, DURATION - .35, .35); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo * .0})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;
window.DURATION = DURATION;

window.ready = (async () => {
  const faces = [['Pretendard', 'Pretendard-Variable.woff2', '100 900'], ['JetBrains Mono', 'JetBrainsMono.woff2', '100 800']];
  for (const [family, file, weight] of faces) {
    for (const base of ['assets/fonts/', '../assets/fonts/']) {
      try { document.fonts.add(await new FontFace(family, `url(${base}${file})`, { weight }).load()); break; } catch (e) { /* try next */ }
    }
  }
  await document.fonts.ready;
  LAST_DRAWN.clear();
})();

// ── player (skipped when ?render) ────────────────────────────
if (!location.search.includes('render')) {
  const $ = id => document.getElementById(id);
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    replay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>',
  };
  const CHAPTERS = [...HEAD.map(h => [h[0], h[2], h[3]]), [END, '', '정리']];
  $('scrub').setAttribute('aria-valuemax', Math.round(DURATION));
  const POSTER = 7.7;
  let t = 0, playing = false, started = false, last = 0;
  const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

  CHAPTERS.forEach(([s, n, label], i) => {
    const b = document.createElement('button');
    b.innerHTML = (n ? `<span>${n}</span>` : '') + label;
    b.addEventListener('click', () => { seek(s + .01); play(); });
    $('chapters').appendChild(b);
    if (i) { const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (s / DURATION * 100) + '%'; $('ticks').appendChild(tk); }
  });

  function ui() {
    const k = t / DURATION, ended = t >= DURATION;
    $('fill').style.width = k * 100 + '%'; $('knob').style.left = k * 100 + '%';
    $('time').textContent = `${mmss(t)} / ${mmss(DURATION)}`;
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
    $('play').innerHTML = playing ? ICON.pause : ended ? ICON.replay : ICON.play;
    $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
    $('big').hidden = playing;
    $('big').innerHTML = ended ? ICON.replay : ICON.play;
    $('big').classList.toggle('replay', ended);
    let cur = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) cur = i; });
    [...$('chapters').children].forEach((b, i) => b.setAttribute('aria-current', i === cur && started));
  }
  function draw() { renderAt(started ? Math.min(t, DURATION - .001) : POSTER); }
  function play() { if (t >= DURATION) t = 0; started = true; playing = true; last = performance.now(); ui(); }
  function pause() { playing = false; ui(); }
  function toggle() { playing ? pause() : play(); }
  function seek(x) { started = true; t = clamp(x, 0, DURATION); draw(); ui(); }

  function frame(now) {
    if (playing) {
      t += (now - last) / 1000 * rate; last = now;
      if (t >= DURATION) { t = DURATION; playing = false; }
      draw(); ui();
    }
    requestAnimationFrame(frame);
  }

  const RATES = [1, .75, .5];
  let rate = 1;
  try { rate = +localStorage.getItem('mg-rate') || 1; } catch (e) { /* storage unavailable */ }
  if (!RATES.includes(rate)) rate = 1;
  function setRate(r) {
    rate = r; $('rate').textContent = r + '×'; $('rate').setAttribute('aria-label', `재생 속도 ${r}배`);
    try { localStorage.setItem('mg-rate', String(r)); } catch (e) { /* storage unavailable */ }
  }
  setRate(rate);
  $('rate').addEventListener('click', () => setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]));
  $('stage').addEventListener('click', toggle);
  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {
    const el = $('stage');
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
  });
  const scrub = $('scrub');
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
    else if (e.key === ',' || e.key === '<') setRate(RATES[Math.min(RATES.length - 1, RATES.indexOf(rate) + 1)]);

  window.ready.then(() => {
    draw(); requestAnimationFrame(frame);

}
