<meta charset="utf-8">
<title>Nagle Whiteboard Vertical</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one 9:16 stage (a whiteboard drawn on canvas), a slim transport bar under it, chapter chips below. */
  :root {
    --bg: #070a13; --surface: #0e1424; --line: #24304a; --fg: #e8ecf4; --dim: #8b95a7;
    --accent: #a78bfa; --live: #34d399; --text2: #c3cad8;
    --sans: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; overflow-x: hidden; }
  .player { width: min(100%, calc((100vh - 170px) * 9 / 16), 480px); min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .big { position: absolute; inset: auto 0 5% 0; margin: 0 auto; width: clamp(44px, 11%, 84px); height: auto; aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--accent);
    background: rgba(14,20,36,.78); color: var(--fg); display: grid; place-items: center; cursor: pointer; transition: transform .15s, opacity .2s; }
  .big[hidden] { display: none; }
  .big:hover { transform: scale(1.06); }
  .big svg { width: 36%; height: 36%; margin-left: 6%; }
  .big.replay svg { margin-left: 0; }
  .bar { display: flex; align-items: center; gap: 14px; }
  .btn { flex: none; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--fg); display: grid; place-items: center; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn svg { width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .time { flex: none; font: 500 13px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .scrub { position: relative; flex: 1; min-width: 0; height: 28px; cursor: pointer; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--line); }
  .fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--live)); }
  .tick { position: absolute; top: 8px; width: 2px; height: 12px; background: var(--dim); opacity: .6; }
  .knob { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 4px rgba(167,139,250,.25); }
  .chapters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chapters button { font: 600 13px/1 var(--sans); color: var(--dim); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; cursor: pointer; }
  .chapters button span { font-family: var(--mono); color: var(--accent); margin-right: 6px; }
  .chapters button:hover { color: var(--fg); }
  .chapters button[aria-current="true"] { color: var(--fg); border-color: var(--accent); background: rgba(167,139,250,.12); }
  .hint { font-size: 12px; color: var(--dim); margin-left: auto; }
  @media (max-width: 600px) { .hint { display: none; } .time { font-size: 12px; } }
  .set { display: flex; flex-wrap: wrap; gap: 8px; }
  .set a { font: 600 13px/1 var(--sans); color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
  .set a:hover { border-color: var(--accent); }
  body.poster .set { display: none; }
  .rate { width: auto; min-width: 56px; padding: 0 10px; font: 600 13px/1 var(--mono); }
  /* Notes under the player: chapter-by-chapter explanation + glossary */
  .notes { width: min(100%, 860px); margin-top: 56px; padding-bottom: 48px; font-size: 16px; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
  .notes h2 { font-size: 22px; line-height: 1.4; margin: 48px 0 16px; text-wrap: balance; }
  .notes h2:first-child { margin-top: 0; }
  .notes h2 .more { font: 600 13px/1 var(--sans); color: var(--accent); margin-left: 10px; white-space: nowrap; }
  .notes .lede { font-size: 18px; color: var(--fg); }
  .notes p, .notes li { color: var(--text2); }
  .notes ul { padding-left: 1.2em; }
  .notes article { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 24px; }
  .notes h3 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 18px; line-height: 1.4; margin: 0 0 8px; }
  .notes h3 .n { font: 600 13px/1 var(--mono); color: var(--accent); }
  .notes h3 button { margin-left: auto; font: 600 12px/1 var(--sans); color: var(--dim); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .notes h3 button:hover { color: var(--fg); border-color: var(--accent); }
  .notes code { font: 500 .88em var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
  .notes .terms { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: 12px 24px; margin: 0; }
  .notes dt { font-weight: 700; }
  .notes dd { margin: 0; color: var(--text2); }
  @media (max-width: 600px) { .notes .terms { grid-template-columns: minmax(0, 1fr); gap: 2px; } .notes dd { margin-bottom: 14px; } }
  /* #poster: embed mode for gallery thumbnails — canvas only, loops */
  body.poster { padding: 0; }
  body.poster .player { width: 100%; }
  body.poster .bar, body.poster .chapters, body.poster .big, body.poster .notes { display: none; }
  body.poster .stage { border: 0; border-radius: 0; }
</style>

<!-- A ~21 s vertical cut of ../nagle-nodelay-board-wide/; no notes of its own (설명 · 용어집 are ../nagle-nodelay/article.html and terms.html). -->
<section class="notes" id="notes" hidden></section>
<script>
// ─────────────────────────────────────────────────────────────
//  Nagle Whiteboard Vertical — ~21 s cut: the delayed-ACK sequence drawn, NODELAY redrawn beside it, tick batching.
//  Every frame is a pure function of time: renderAt(t).
// ─────────────────────────────────────────────────────────────
const W = 1080, H = 1920, DURATION = 22.0;
// ── board kit: marker strokes, handwriting-placed text, stickies, taped paper, eraser ──
// Every frame is a pure function of t. Wobble comes from a seed hashed from each stroke's id, so a stroke looks the same every frame.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// Marker set on this board: black = structure and data segments, blue = ACK, red = waiting / the problem, green = the fix (TCP_NODELAY).
const INK = { k: '#1e2229', b: '#1c4fc7', r: '#d22b26', g: '#12864a', dim: '#59606c', faint: '#9298a1' };
const BOARD = '#f3f2ec';
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(sz, wt = 500, mono = false) { ctx.font = `${wt} ${sz}px ${mono ? MONO : SANS}`; }
function tw(s, size, weight = 500, mono = false) { font(size, weight, mono); return ctx.measureText(s).width; }
function txt(s, x, y, o = {}) {
  const { size = 30, weight = 600, color = INK.k, align = 'left', alpha = 1, mono = false, ls = 0 } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; font(size, weight, mono); if (ls) ctx.letterSpacing = ls + 'px';
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); ctx.restore();

// The marker in hand: the last stroke or line of text still being drawn this frame.
let PEN = null;
let PEEL = 1;   // stickies and taped paper (and what is written on them) come off the board just before the eraser passes

// stroke(id, points, k, color): a marker line drawn along its path up to fraction k, with a seeded hand wobble.
function stroke(id, pts, k, col, o = {}) {
  if (k <= 0 || pts.length < 2) return;
  const { lw = 6, amp = 1.8, alpha = 1, dash = null, pen = true } = o;
  const r = rng(hash(id)), f1 = .007 + r() * .009, f2 = .024 + r() * .018, p1 = r() * 6.283, p2 = r() * 6.283, A = amp * (.6 + r() * .8);

  if (total < .5) return;

  let s = 0, first = true, tip = null;
  for (let i = 0; i < segs.length && s < lim; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], L = segs[i];
    if (L < 1e-6) continue;
    const nx = -(y1 - y0) / L, ny = (x1 - x0) / L, n = Math.max(1, Math.ceil(L / 6));
    for (let j = 0; j <= n; j++) {
      let d = L * j / n; const last = s + d >= lim; if (last) d = lim - s;
      const ss = s + d, off = A * (.65 * Math.sin(ss * f1 + p1) + .35 * Math.sin(ss * f2 + p2));
      const x = x0 + (x1 - x0) * d / L + nx * off, y = y0 + (y1 - y0) * d / L + ny * off;
      if (first) { path.moveTo(x, y); first = false; } else path.lineTo(x, y);
      tip = [x, y];
      if (last) break;
    }

  }

  if (dash) ctx.setLineDash(dash);

  ctx.globalAlpha *= .2; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, lw * .22);

// pen position in canvas space, so strokes drawn on a taped card (inside its transform) still put the marker in the right place
function setPen(x, y, col) {
  const m = ctx.getTransform(), c = [INK.b, INK.r, INK.g].includes(col) ? col : INK.k;   // gray notes are written with the black marker
  PEN = { x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f, col: c };
}
function arrowS(id, x0, y0, x1, y1, k, col, o = {}) {
  if (k <= 0) return;
  const kl = clamp(k / .86), kh = clamp((k - .86) / .14), L = o.head || 22, a = Math.atan2(y1 - y0, x1 - x0);
  stroke(id, [[x0, y0], [x1, y1]], kl, col, o);
  const oh = { ...o, dash: null, amp: .5 };
  stroke(id + 'h1', [[x1, y1], [x1 - L * Math.cos(a - .44), y1 - L * Math.sin(a - .44)]], clamp(kh * 2), col, oh);
  stroke(id + 'h2', [[x1, y1], [x1 - L * Math.cos(a + .44), y1 - L * Math.sin(a + .44)]], clamp(kh * 2 - 1), col, oh);
}
function boxS(id, x, y, w, h, k, col, o = {}) {
  const r = rng(hash(id + 'b')), j = () => (r() - .5) * 5;
  stroke(id, [[x - 5 + j(), y + j()], [x + w + j(), y + j()], [x + w + j(), y + h + j()], [x + j(), y + h + j()], [x + 2, y - 9]], k, col, o);
}
function ringS(id, cx, cy, rx, ry, k, col, o = {}) {
  const r = rng(hash(id + 'r')), a0 = -2.4 + r() * .8, ph = r() * 6, pts = [];
  for (let i = 0; i <= 80; i++) { const a = a0 + i / 80 * Math.PI * 2 * 1.1, q = 1 + .035 * Math.sin(a * 2 + ph) + i / 80 * .06; pts.push([cx + Math.cos(a) * rx * q, cy + Math.sin(a) * ry * q]); }

}
// hatching for waiting time; lines are anchored to the board so they do not slide while the region grows
function hatch(x, y, w, h, col, a = 1, step = 15) {
  if (w <= 0 || h <= 0 || a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = rgba(col, .08); ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = rgba(col, .8); ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();

  for (let c = c0; c < x + w - y; c += step) { ctx.moveTo(c + y, y); ctx.lineTo(c + y + h, y + h); }
  ctx.stroke(); ctx.restore();
}

// wr: text written left to right up to fraction k (a clip that follows the pen). Set in a readable face, placed with a slight hand tilt.
function wr(s, x, y, k, o = {}) {
  if (k <= 0 || !s) return 0;
  const { size = 30, weight = 700, color = INK.k, align = 'left', mono = false, alpha = 1, rot = null, ls = 0 } = o;
  ctx.save(); font(size, weight, mono); if (ls) ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(s).width, X = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  const r = rot ?? ((hash(s) % 1000) / 1000 - .5) * .012;
  ctx.globalAlpha *= alpha; ctx.translate(X, y); ctx.rotate(r);
  if (k < 1) { ctx.beginPath(); ctx.rect(-8, -size * 1.2, (w + 16) * k, size * 1.75); ctx.clip(); }
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, 0, 0);
  ctx.restore();
  if (k < 1) setPen(X + w * k, y - size * .2, color);
  return w;
}
const wk = (u, t0, s, cps = 26) => clamp((u - t0) / Math.max(.22, s.length / cps));
function say(s, x, y, u, t0, o = {}) { return wr(s, x, y, wk(u, t0, s, o.cps || 26), o); }
// several colored runs on one line, written in sequence
function sayParts(parts, x, y, u, t0, o = {}) {
  const { size = 30, weight = 700, align = 'left', cps = 26, mono = false } = o;
  font(size, weight, mono);
  const ws = parts.map(([s]) => ctx.measureText(s).width), tot = ws.reduce((a, b) => a + b, 0);
  let X = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x, tt = t0;
  parts.forEach(([s, col], i) => { const d = Math.max(.1, s.length / cps); wr(s, X, y, clamp((u - tt) / d), { ...o, align: 'left', color: col, rot: 0 }); X += ws[i]; tt += d; });
  return [x - (align === 'center' ? tot / 2 : align === 'right' ? tot : 0), tot];
}
// strike a written line through (the reasoning "this no longer holds")
function strike(id, x0, x1, y, k, col, o = {}) { stroke(id, [[x0, y + 3], [x1, y - 3]], k, col, { lw: 5, ...o }); }

// sticky note: slapped on (slight overshoot in scale, shadow settles), content drawn in local coords (0,0 = top-left)
function sticky(x, y, w, h, k, o, fn) {
  if (k <= 0 || PEEL <= 0) return;
  const { rot = -.02, col = '#ffe45e' } = o || {};
  const kk = eo(clamp(k)), sc = 1 + (1 - kk) * .1;
  ctx.save(); ctx.globalAlpha *= clamp(k * 3) * PEEL; ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.save(); ctx.shadowColor = 'rgba(40,36,20,.22)'; ctx.shadowBlur = 14 + (1 - kk) * 24; ctx.shadowOffsetY = 6 + (1 - kk) * 16; ctx.shadowOffsetX = 3;

  ctx.quadraticCurveTo(w / 2 - 6, h / 2 + 1, w / 2 - 30, h / 2 + 3); ctx.lineTo(-w / 2, h / 2); ctx.closePath();
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, col); g.addColorStop(1, shade(col, -.06));

function shade(hex, f) { const n = parseInt(hex.slice(1), 16); const c = v => Math.round(clamp(v + v * f, 0, 255)); return `rgb(${c(n >> 16 & 255)},${c(n >> 8 & 255)},${c(n & 255)})`; }
// taped paper (printouts, code cards): two strips of masking tape on the top corners
function paper(x, y, w, h, k, o, fn) {
  if (k <= 0 || PEEL <= 0) return;
  const { rot = -.008, col = '#fdfcf8', tape = true } = o || {};
  const kk = eo(clamp(k));

    ctx.save(); ctx.translate(tx, ty); ctx.rotate(a); ctx.fillStyle = 'rgba(226,212,170,.82)'; ctx.fillRect(-46, -15, 92, 30);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(-46, -15, 92, 8); ctx.restore();
  });

}

// the marker in hand, drawn at the tip of whatever is being drawn
function drawPen(sc = 1) {
  if (!PEN) return;
  const { x, y, col } = PEN;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate(.62);
  ctx.save(); ctx.translate(10, 22); ctx.rotate(-.05); ctx.fillStyle = 'rgba(20,20,20,.13)'; rr(20, -14, 220, 30, 13); ctx.fill(); ctx.restore();
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-1, 0); ctx.lineTo(15, -6); ctx.lineTo(15, 6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c9ccd1'; ctx.beginPath(); ctx.moveTo(13, -7); ctx.lineTo(36, -14); ctx.lineTo(36, 14); ctx.lineTo(13, 7); ctx.closePath(); ctx.fill();
  const g = ctx.createLinearGradient(0, -14, 0, 14); g.addColorStop(0, '#ffffff'); g.addColorStop(.55, '#e9eaee'); g.addColorStop(1, '#b9bcc3');
  ctx.fillStyle = g; rr(34, -14, 172, 28, 5); ctx.fill();
  ctx.fillStyle = col; ctx.fillRect(46, -14, 9, 28);
  rr(200, -15, 44, 30, 8); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(204, -12, 36, 6);
  ctx.restore();
}
function eraserAt(x, y, rot = .06, sc = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);

const eraseK = (t, E) => eio(p(t, E - .75, .65));
const eraserPos = (e, y0, y1) => [W / 2 + Math.sin(e * Math.PI * 5) * 330, lerp(y0 - 150, y1 + 150, e)];
// draw fn, wiped by the eraser (E, zone y0..y1) at the end

  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
    else if (e.key === ',' || e.key === '<') setRate(RATES[Math.min(RATES.length - 1, RATES.indexOf(rate) + 1)]);
    else if (e.key === '.' || e.key === '>') setRate(RATES[Math.max(0, RATES.indexOf(rate) - 1)]);
  });

  const posterMode = location.hash === '#poster';
  if (posterMode) document.body.classList.add('poster');
  ui();
  // chapter deep link: index.html#ch03 opens paused at that chapter
  const deep = /^#ch(\d\d)$/.exec(location.hash), deepHead = deep && HEAD.find(r => r[2] === deep[1]);
  window.ready.then(() => {
    draw(); requestAnimationFrame(frame);
    if (deepHead) seek(deepHead[0] + .01);
    if (posterMode) { play(); setInterval(() => { if (!playing) { t = 0; play(); } }, 500); }
  });
  renderAt(POSTER);
}
</script>
