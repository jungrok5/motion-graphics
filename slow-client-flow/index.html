<script type="module">
// ─────────────────────────────────────────────────────────────
//  Slow Client Flow Vertical — 클라가 느리면 서버도 느려진다 (~20.5s, 1080×1920, mobile)
//  The ~20 s cut of ../slow-client-flow-wide/ (흐름과 관계를 빛으로): the same pipe of real buffers made of memory cells,
//  stood upright — server on top, client at the bottom — so the fill (mint → orange → red) visibly climbs from the
//  client's receive queue to the server's app send queue. Every frame is a pure function of time: renderAt(t).
//  Facts follow ../slow-client/index.html:
//    boss fight: to receive 1,500 → 8,000/s · FPS 60 → 15 · processing = FPS × 200 (example) 12,000 → 3,000/s
//    recv thread stops → SO_RCVBUF (Recv-Q) fills → ACK Win=0 → SO_SNDBUF (Send-Q) fills → send() EAGAIN → app send queue grows
//    the queue cap cuts the connection; it is the last safety net — client drains fast, server bounds what it sends per client
// ─────────────────────────────────────────────────────────────
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1080, H = 1920, DURATION = 20.5;
const FOV = 40;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SANS = 'Pretendard, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const MONO = '"JetBrains Mono", Pretendard, "DejaVu Sans Mono", monospace';

// ── math ─────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, s, d) => clamp((t - s) / d);
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const win = (t, s, e, f = .45) => Math.min(eo(p(t, s, f)), 1 - eio(p(t, e - f, f)));
const fract = x => x - Math.floor(x);
const h2 = (a, b) => fract(Math.sin(a * 127.1 + b * 311.7 + 1.7) * 43758.5453);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const fmt = n => Math.round(n).toLocaleString('en-US');
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };

// ── timeline ─────────────────────────────────────────────────
// [start, end, number, title] — beats (header gauge + chapter chips)
const HEAD = [
  [0, 2.6, '01', '클라 · 서버'],
  [2.6, 7.0, '02', '보스전'],
  [7.0, 13.4, '03', '역압'],
  [13.4, 17.6, '04', '상한 · 해결'],
];
const END_AT = 17.6, OUTRO_AT = END_AT;
const B5 = [999, 999, 999, 999, 999];      // (the server-cost beats live in the wide cut only)
const T_STOP = 7.4;                        // recv thread stops
const T_ZW0 = 9.0, T_ZW = 9.5;             // the Win=0 ACK crosses the wire
const T_EAG = 10.7;                        // send() → EAGAIN
const T_CAP = 14.4, T_RE = 15.3, T_FIX = 15.9;   // cap reached → cut, reconnect, fixes
const FIX_C = T_FIX, FIX_S = T_FIX;
const C6 = [13.5, 16.0];
const CAPW = [[13.3, 16.0], [99, 99.1], [99, 99.1]];
const PRESSW = [[T_STOP, T_CAP + .1, 1]];
const MEMW = [10.6, T_CAP];
const GENA = .35;

// ── 01 numbers (formulas of ../slow-client/index.html sSqueeze) ──
const BUDGET = 200;
const inRate = s => s < 3 ? 1500 : s < 4 ? lerp(1500, 8000, s - 3) : 8000;
const fpsAt = s => s < 3 ? 60 : s < 4.5 ? lerp(60, 15, (s - 3) / 1.5) : 15;
const sim1 = t => clamp((t - 3.0) / 3.4) * 10;
function backlogAt(smax) { let b = 0; for (let s = 0; s < smax; s += .05) { const cap = fpsAt(s) * BUDGET, inc = inRate(s); if (inc > cap) b += (inc - cap) * .05; } return b; }
const BL_MAX = backlogAt(10);

// ── palette (socket instrumentation: fill gauge mint → orange → red, role colours for labels) ──
const HEX = { mint: '#3df0a8', orange: '#ff9a3c', red: '#ff3d5a', data: '#d6fff0', ack: '#8fb4ff', server: '#ffcf5a', kernel: '#b9a2ff', client: '#5cc8ff', ink: '#eef3f8', dimc: '#2a3446' };
const COL = Object.fromEntries(Object.entries(HEX).map(([k, v]) => [k, new THREE.Color(v)]));
const _rc = new THREE.Color();
function ramp(l, out = _rc) {   // buffer fill → colour
  if (l < .5) return out.copy(COL.mint);
  if (l < .85) return out.copy(COL.mint).lerp(COL.orange, (l - .5) / .35);
  return out.copy(COL.orange).lerp(COL.red, clamp((l - .85) / .13));
}

// ── three setup ──────────────────────────────────────────────
const gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
gl.setPixelRatio(1); gl.setSize(W, H, false);
gl.setClearColor(0x03050a, 1);
gl.toneMapping = THREE.ACESFilmicToneMapping; gl.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
const WORLD = new THREE.Group(); scene.add(WORLD);
const camera = new THREE.PerspectiveCamera(FOV, W / H, .1, 400);
const composer = new EffectComposer(gl);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), .6, .38, .6);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const U = { uPx: { value: H / (2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2))) } };
const blendAdd = { transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending };

// memory cells and packets: unlit cubes with a bright rim (the rim feeds the bloom)
const CELL_VS = `
attribute vec3 aCol;
varying vec3 vC; varying vec3 vP; varying vec3 vN;
void main() {
  vP = position; vC = aCol;
  mat4 m = modelMatrix * instanceMatrix;
  vN = normalize(mat3(m) * normal);
  gl_Position = projectionMatrix * viewMatrix * m * vec4(position, 1.0);
}`;
const CELL_FS = `
varying vec3 vC; varying vec3 vP; varying vec3 vN;
void main() {
  vec3 a = abs(vP) * 2.0;
  float mx = max(a.x, max(a.y, a.z)), mn = min(a.x, min(a.y, a.z));
  float mid = a.x + a.y + a.z - mx - mn;
  float edge = smoothstep(.70, .9, mid);
  float lam = .5 + .5 * max(dot(vN, normalize(vec3(.3, .85, .45))), 0.0);
  gl_FragColor = vec4(vC * (.36 * lam) + vC * edge * 1.05, 1.0);
}`;
const cellMat = () => new THREE.ShaderMaterial({ vertexShader: CELL_VS, fragmentShader: CELL_FS });
function cellMesh(n, order = 5) {
  const g = new THREE.BoxGeometry(1, 1, 1);
  const col = new Float32Array(n * 3);
  g.setAttribute('aCol', new THREE.InstancedBufferAttribute(col, 3));
  const m = new THREE.InstancedMesh(g, cellMat(), n);
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.frustumCulled = false; m.renderOrder = order;
  m.userData.col = col; m.userData.mat = m.instanceMatrix.array;
  WORLD.add(m); return m;
}
function setInst(m, i, x, y, z, sx, sy, sz, c, k = 1) {
  const a = m.userData.mat, o = i * 16;
  a[o] = sx; a[o + 1] = 0; a[o + 2] = 0; a[o + 3] = 0;
  a[o + 4] = 0; a[o + 5] = sy; a[o + 6] = 0; a[o + 7] = 0;
  a[o + 8] = 0; a[o + 9] = 0; a[o + 10] = sz; a[o + 11] = 0;
  a[o + 12] = x; a[o + 13] = y; a[o + 14] = z; a[o + 15] = 1;
  const cc = m.userData.col; cc[i * 3] = c.r * k; cc[i * 3 + 1] = c.g * k; cc[i * 3 + 2] = c.b * k;
}
function hideInst(m, i) { const a = m.userData.mat, o = i * 16; a[o] = a[o + 5] = a[o + 10] = 0; a[o + 12] = 0; a[o + 13] = -999; a[o + 14] = 0; a[o + 15] = 1; }
function flushInst(m) { m.instanceMatrix.needsUpdate = true; m.geometry.attributes.aCol.needsUpdate = true; }

// soft additive glows (packet halos, the heat strip, the pressure front)
const GVS = `
attribute float size; attribute float alpha; attribute vec3 color;
uniform float uPx, uGain;
varying vec3 vC;
void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  float d = max(-mv.z, 0.05);
  gl_PointSize = max(size * uPx / d, 1.5);
  vC = color * alpha * uGain;
  gl_Position = projectionMatrix * mv;
  if (alpha <= 0.0) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
}`;
const GFS = `varying vec3 vC; void main() { vec2 c = gl_PointCoord * 2.0 - 1.0; float d = dot(c, c); if (d > 1.0) discard; gl_FragColor = vec4(vC * (exp(-d * 5.0) + .12 * exp(-d * 1.5)), 1.0); }`;
function glowPts(n, order = 6, gain = 1) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('size', new THREE.BufferAttribute(new Float32Array(n), 1));
  g.setAttribute('alpha', new THREE.BufferAttribute(new Float32Array(n), 1));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const o = new THREE.Points(g, new THREE.ShaderMaterial({ uniforms: { ...U, uGain: { value: gain } }, vertexShader: GVS, fragmentShader: GFS, ...blendAdd }));
  o.frustumCulled = false; o.renderOrder = order; WORLD.add(o); return o;
}
function setPt(o, i, x, y, z, size, alpha, c) {
  const A = o.geometry.attributes;
  A.position.setXYZ(i, x, y, z); A.size.setX(i, size); A.alpha.setX(i, alpha); A.color.setXYZ(i, c.r, c.g, c.b);
}
function flushPts(o) { const A = o.geometry.attributes; A.position.needsUpdate = A.size.needsUpdate = A.alpha.needsUpdate = A.color.needsUpdate = true; }

// line objects with a per-frame colour/opacity
const lineMat = () => new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false });
function setLine(o, c, a) { o.material.color.copy(c); o.material.opacity = clamp(a); o.visible = a > .003; }
const BOXEDGE = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
const RECT = (() => { const g = new THREE.BufferGeometry(); const P = [[0, -.5, -.5], [0, .5, -.5], [0, .5, -.5], [0, .5, .5], [0, .5, .5], [0, -.5, .5], [0, -.5, .5], [0, -.5, -.5]]; g.setAttribute('position', new THREE.Float32BufferAttribute(P.flat(), 3)); return g; })();
const CIRCLE = (() => { const g = new THREE.BufferGeometry(), P = []; for (let i = 0; i < 64; i++) { const a = i / 64 * 6.2832, b = (i + 1) / 64 * 6.2832; P.push(0, Math.cos(a), Math.sin(a), 0, Math.cos(b), Math.sin(b)); } g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); return g; })();
function lines(geo, order = 4) { const o = new THREE.LineSegments(geo, lineMat()); o.frustumCulled = false; o.renderOrder = order; WORLD.add(o); return o; }
function faceBox(order = 1) { const o = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .05, blending: THREE.AdditiveBlending, depthWrite: false })); o.frustumCulled = false; o.renderOrder = order; WORLD.add(o); return o; }
function setFace(o, c, a) { o.material.color.copy(c); o.material.opacity = a; o.visible = a > .002; }
function tube(order = 3) { const o = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 10, 1, true).rotateZ(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); o.frustumCulled = false; o.renderOrder = order; WORLD.add(o); return o; }
function setTube(o, x0, x1, y, r, c, a) { o.position.set((x0 + x1) / 2, y, 0); o.scale.set(Math.max(.001, x1 - x0), r, r); o.material.color.copy(c); o.material.opacity = clamp(a); o.visible = a > .003 && x1 > x0; }

// ═════════════════════════════════════════════════════════════
//  THE PIPE: geometry along x, server (left) → client (right)
// ═════════════════════════════════════════════════════════════
const PITCH = .24, ROWS = 6, DEPS = 2, PER = ROWS * DEPS, CS = .175;
const BH = ROWS * PITCH + .16, BD = DEPS * PITCH + .16;
const XG = { gen: -14.7, aqE: -6.2, sendG: -5.75, ksE: -2.9, wS: -2.75, wE: 2.75, krE: 5.3, recvG: 5.75, cqE: 9.8, mainG: 10.35, game: 11.45 };
const AQ_BASE = 15, AQ_MAX = 34, KCOLS = 10, CQ_COLS = 15;
XG.ksS = XG.ksE - KCOLS * PITCH; XG.krS = XG.krE - KCOLS * PITCH; XG.cqS = XG.cqE - CQ_COLS * PITCH; XG.aqS = XG.aqE - AQ_BASE * PITCH;
XG.cap = XG.aqS - .06;
const NL = 1;                          // lane 0 = the slow client's connection (full path); lanes 1–6 = other sessions (server side)
const SLOW5 = new Set([0, 3]);         // slow sessions in 05
const REF5 = [0, 1, 2, 4, 5, 6];        // sessions that reference the shared broadcast buffer in 05 (only lane 0 is slow among them)
const LSP = 1.8;                        // lane spacing (rows of sessions, like ss rows)

// buffers
const BUFS = [];
let CELL_N = 0;
function addBuf(lane, kind, exitX, cols, maxCols, role) {
  const b = { lane, kind, exitX, cols, maxCols, role, off: CELL_N, box: lines(BOXEDGE, 4), face: faceBox(1) };
  CELL_N += maxCols * PER; BUFS.push(b); return b;

    ctx.save(); ctx.globalAlpha *= kf;
    txt('클라는 빨리 뽑아내고', X0, 300, { size: 60, weight: 800, color: CLI });
    txt('서버는 클라당', X0, 384, { size: 60, weight: 800, color: SRV, alpha: eo(p(t, T_FIX + .3, .5)) });
    txt('보내는 양을 묶는다', X0, 468, { size: 60, weight: 800, color: SRV, alpha: eo(p(t, T_FIX + .3, .5)) });
    ctx.restore();
  }
  ctx.restore();
  const k = a;
  side('상한', XG.cap, k * kc, { color: RED, size: 34, left: true });
  if (cut) side('✕ 연결 끊김', 0, k, { color: RED, size: 34 });
  if (re) side('재접속', 0, k, { color: SRV, size: 34 });
  const fx = [['시야 인원 상한 · 먼 대상 드물게', XG.aqS + .3, SRV], ['이동은 최신값으로 덮어쓰기', XG.aqE - .6, SRV],
    ['수신 전용 스레드', XG.recvG, CLI], ['프레임당 예산 + 최신값만', XG.mainG, CLI]];
  fx.forEach(([s, lx, col], i) => side(s, lx, k * eo(p(t, T_FIX + .2 + i * .25, .4)), { color: col, size: 34 }));
  caption(['상한은 마지막 안전장치', '닿지 않게 클라당 보내는 양을 줄인다'], t, 14.5, T_FIX + .05, [INK, DIM]);
  caption(['양쪽 다 고쳐야 한다', '느린 회선은 클라가, 클라 처리는 서버가 못 고친다'], t, T_FIX + 1.0, END_AT + .1, [MINT, DIM]);
}

// ── end card ──
function endCard(t) {
  const v = t - END_AT, a = eio(p(v, 0, .6)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(3,5,10,.8)'; ctx.fillRect(0, 0, W, H);
  const k1 = eo(p(v, .3, .6)), k2 = eo(p(v, .7, .6));
  const L1 = [['클라가 ', INK], ['빨리', CLI], [' 뽑아내야', INK]], L2 = [['서버도 ', INK], ['버틴다.', SRV]];
  [[L1, 800, k1], [L2, 920, k2]].forEach(([parts, y, k]) => {
    const tot = parts.reduce((s, [w]) => s + tw(w, 96, 800, false, -1), 0); let x = CX - tot / 2;
    parts.forEach(([s, c]) => { txt(s, x, y + (1 - k) * 20, { size: 96, weight: 800, color: c, alpha: k, blur: (1 - k) * 10, ls: -1 }); x += tw(s, 96, 800, false, -1); });
  });
  const k3 = eo(p(v, 1.4, .6));
  txt('Recv-Q → Win=0 → Send-Q → EAGAIN → 송신 큐 상한', CX, 1030, { size: 30, weight: 600, mono: true, color: DIM, align: 'center', alpha: k3 });
  txt('전체 영상 · 설명 · 용어집', CX, 1200, { size: 40, weight: 700, color: DIM, align: 'center', alpha: eo(p(v, 1.8, .6)) });
  txt('jungrok5.github.io/motion-graphics/slow-client', CX, 1270, { size: 34, weight: 600, mono: true, color: MINT, align: 'center', alpha: eo(p(v, 1.8, .6)) });
  ctx.restore();
}

// ── frame ────────────────────────────────────────────────────
function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.shadowBlur = 0;
  update3D(t);
  composer.render();
  ctx.drawImage(gl.domElement, 0, 0, W, H);
  vignette();
  sTitle(t); sBoss(t); sBack(t); sCapFix(t);
  ctx.save(); shadow(12);
  txt('* 수치는 예시', X1, 200, { size: 30, weight: 600, color: 'rgba(214,226,240,.62)', align: 'right', alpha: win(t, 2.8, END_AT, .5) });
  ctx.restore();
  if (t > END_AT) endCard(t);
  header(t);
  const fo = p(t, DURATION - .5, .5); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;
window.DURATION = DURATION;

window.ready = (async () => {
  const faces = [['Pretendard', 'Pretendard-Variable.woff2', '100 900'], ['JetBrains Mono', 'JetBrainsMono.woff2', '100 800']];
  for (const [family, file, weight] of faces) {
    for (const base of ['assets/fonts/', '../assets/fonts/']) {
      try { document.fonts.add(await new FontFace(family, `url(${base}${file})`, { weight }).load()); break; } catch (e) { /* try next */ }
    }
  }
  await document.fonts.ready;
})();
// ── player (skipped when ?render) ────────────────────────────
if (!location.search.includes('render')) {
  const $ = id => document.getElementById(id);
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    replay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>',
  };
  const CHAPTERS = HEAD.map(h => [h[0], h[2], h[3]]);
  $('scrub').setAttribute('aria-valuemax', Math.round(DURATION));
  const POSTER = 11.6;   // the pressure has climbed to the app send queue: Win=0, EAGAIN, all buffers red
  let t = 0, playing = false, started = false, last = 0;
  const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

  CHAPTERS.forEach(([s, n, label], i) => {
    const b = document.createElement('button');
    b.innerHTML = (n ? `<span>${n}</span>` : '') + label;
    b.addEventListener('click', () => { seek(s + .01); play(); });
    $('chapters').appendChild(b);
    if (i) { const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (s / DURATION * 100) + '%'; $('ticks').appendChild(tk); }
  });

  function ui() {
    const k = t / DURATION, ended = t >= DURATION;
    $('fill').style.width = k * 100 + '%'; $('knob').style.left = k * 100 + '%';
    $('time').textContent = `${mmss(t)} / ${mmss(DURATION)}`;
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
    $('play').innerHTML = playing ? ICON.pause : ended ? ICON.replay : ICON.play;
    $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
    $('big').hidden = playing;
    $('big').innerHTML = ended ? ICON.replay : ICON.play;
    $('big').classList.toggle('replay', ended);
    let cur = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) cur = i; });
    [...$('chapters').children].forEach((b, i) => b.setAttribute('aria-current', i === cur && started));
  }
  function draw() { renderAt(started ? Math.min(t, DURATION - .001) : POSTER); }
  function play() { if (t >= DURATION) t = 0; started = true; playing = true; last = performance.now(); ui(); }
  function pause() { playing = false; ui(); }
  function toggle() { playing ? pause() : play(); }
  function seek(x) { started = true; t = clamp(x, 0, DURATION); draw(); ui(); }

  function frame(now) {
    if (playing) {
      t += (now - last) / 1000 * rate; last = now;
      if (t >= DURATION) { t = DURATION; playing = false; }
      draw(); ui();
    }
    requestAnimationFrame(frame);
  }

  const RATES = [1, .75, .5];
  let rate = 1;
  try { rate = +localStorage.getItem('mg-rate') || 1; } catch (e) { /* storage unavailable */ }
  if (!RATES.includes(rate)) rate = 1;
  function setRate(r) {
    rate = r; $('rate').textContent = r + '×'; $('rate').setAttribute('aria-label', `재생 속도 ${r}배`);
    try { localStorage.setItem('mg-rate', String(r)); } catch (e) { /* storage unavailable */ }
  }
  setRate(rate);
  $('rate').addEventListener('click', () => setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]));
  $('stage').addEventListener('click', toggle);
  $('play').addEventListener('click', toggle);
  $('fs').addEventListener('click', () => {
    const el = $('stage');
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
  });
  const scrub = $('scrub');
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DURATION; };
  let wasPlaying = false;
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); wasPlaying = playing; playing = false; seek(fromEvent(e)); });
  scrub.addEventListener('pointermove', e => { if (scrub.hasPointerCapture(e.pointerId)) seek(fromEvent(e)); });
  scrub.addEventListener('pointerup', () => { if (wasPlaying && t < DURATION) play(); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(t + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(t - 5); }
    else if (e.key === 'Home') seek(0);
    else if (e.key === ',' || e.key === '<') setRate(RATES[Math.min(RATES.length - 1, RATES.indexOf(rate) + 1)]);
    else if (e.key === '.' || e.key === '>') setRate(RATES[Math.max(0, RATES.indexOf(rate) - 1)]);
  });

  const posterMode = location.hash === '#poster';
  if (posterMode) document.body.classList.add('poster');
  ui();
  // chapter deep link: index.html#ch03 opens paused at that chapter
  const deep = /^#ch(\d\d)$/.exec(location.hash), deepHead = deep && HEAD.find(r => r[2] === deep[1]);
  window.ready.then(() => {
    draw(); requestAnimationFrame(frame);
    if (deepHead) seek(deepHead[0] + .01);
    if (posterMode) { play(); setInterval(() => { if (!playing) { t = 0; play(); } }, 500); }
  });
  renderAt(POSTER);
}
</script>
